# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL MEDIA AGENT - PLATFORM SETTINGS CONFIGURATION
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

platform_settings:
  version: "1.0.0"
  last_updated: "2026-01-22"

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTAGRAM CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  instagram:
    platform_id: "INSTAGRAM"
    account_type: "Business"

    content_types:
      feed_post:
        enabled: true
        formats:
          image:
            aspect_ratios: ["1:1", "4:5", "1.91:1"]
            recommended: "1:1"
            max_size: "30MB"
            formats: ["jpg", "png"]
          carousel:
            min_slides: 2
            max_slides: 10
            image_size: "1080x1080"
          video:
            max_duration: 60
            aspect_ratios: ["1:1", "4:5", "16:9"]
            max_size: "100MB"
        caption:
          max_length: 2200
          recommended_length: 150
          max_hashtags: 30
          recommended_hashtags: "5-10"

      story:
        enabled: true
        duration: 24
        media:
          image:
            aspect_ratio: "9:16"
            size: "1080x1920"
          video:
            max_duration: 15
            aspect_ratio: "9:16"
        features:
          - "Stickers"
          - "Polls"
          - "Questions"
          - "Links (swipe up)"
          - "Mentions"
          - "Location"
          - "Hashtags"

      reels:
        enabled: true
        duration:
          min: 15
          max: 90
          recommended: "15-30"
        aspect_ratio: "9:16"
        size: "1080x1920"
        features:
          - "Audio"
          - "Effects"
          - "Text"
          - "Stickers"

    posting_settings:
      optimal_times:
        weekdays: ["11:00", "13:00", "14:00", "19:00"]
        weekends: ["10:00", "11:00", "12:00"]
      frequency:
        feed: "1-2 per day"
        stories: "3-5 per day"
        reels: "3-5 per week"
      hashtag_strategy:
        branded: 1
        niche: "3-5"
        trending: "2-3"
        broad: "2-3"

    engagement_settings:
      response_time_target: "2 hours"
      dm_response_time: "4 hours"
      comment_monitoring: "real_time"
      auto_responses:
        enabled: true
        types: ["FAQs", "Greetings"]

  # ═══════════════════════════════════════════════════════════════════════════
  # LINKEDIN CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  linkedin:
    platform_id: "LINKEDIN"
    page_type: "Company"

    content_types:
      text_post:
        enabled: true
        max_length: 3000
        recommended_length: "150-300"
        features:
          - "Mentions"
          - "Hashtags"
          - "Links"

      image_post:
        enabled: true
        recommended_size: "1200x627"
        aspect_ratio: "1.91:1"
        max_images: 1
        caption_length: 700

      video_post:
        enabled: true
        max_duration: 600
        min_duration: 3
        max_size: "200MB"
        recommended_duration: "30-90"
        aspect_ratios: ["16:9", "1:1", "9:16"]

      carousel:
        enabled: true
        name: "Document post"
        max_slides: 300
        formats: ["pdf", "ppt", "pptx"]
        size: "1080x1080"

      article:
        enabled: true
        max_length: 125000
        features:
          - "Rich formatting"
          - "Images"
          - "Videos"
          - "Mentions"

      newsletter:
        enabled: true
        subscriber_required: true

      poll:
        enabled: true
        max_options: 4
        duration_options: ["1 day", "3 days", "1 week", "2 weeks"]

    posting_settings:
      optimal_times:
        b2b: ["07:00", "08:00", "12:00", "17:00"]
        best_days: ["Tuesday", "Wednesday", "Thursday"]
      frequency:
        recommended: "1-2 per day"
        minimum: "3 per week"
        maximum: "5 per day"
      hashtag_strategy:
        count: "3-5"
        types: ["Industry", "Topic", "Branded"]

    engagement_settings:
      response_time_target: "4 hours"
      comment_style: "Professional"
      employee_advocacy:
        enabled: true
        content_sharing: true

  # ═══════════════════════════════════════════════════════════════════════════
  # TWITTER/X CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  twitter:
    platform_id: "TWITTER"

    content_types:
      tweet:
        enabled: true
        max_length: 280
        media:
          images:
            max_count: 4
            formats: ["jpg", "png", "gif"]
            max_size: "5MB"
          video:
            max_duration: 140
            max_size: "512MB"
          gif:
            max_count: 1

      thread:
        enabled: true
        max_tweets: 25
        connector: true

      poll:
        enabled: true
        max_options: 4
        duration: { min: "5 minutes", max: "7 days" }

      space:
        enabled: true
        type: "Live audio"
        scheduling: true

    posting_settings:
      optimal_times:
        weekdays: ["08:00", "09:00", "12:00", "17:00"]
        weekends: ["09:00", "12:00"]
      frequency:
        recommended: "3-5 per day"
        minimum: "1 per day"
        replies: "Unlimited"
      hashtag_strategy:
        count: "1-2"
        placement: "End of tweet"

    engagement_settings:
      response_time_target: "1 hour"
      mention_monitoring: "real_time"
      quote_tweet_strategy: "Engagement"
      lists:
        enabled: true
        types: ["Influencers", "Competitors", "Industry"]

  # ═══════════════════════════════════════════════════════════════════════════
  # TIKTOK CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  tiktok:
    platform_id: "TIKTOK"
    account_type: "Business"

    content_types:
      video:
        enabled: true
        duration:
          min: 5
          max: 180
          recommended: "21-34"
        aspect_ratio: "9:16"
        size: "1080x1920"
        max_file_size: "287.6MB"
        features:
          - "Effects"
          - "Sounds"
          - "Text"
          - "Stickers"
          - "Duet"
          - "Stitch"

    posting_settings:
      optimal_times:
        best_times: ["07:00", "08:00", "12:00", "15:00", "19:00", "20:00", "21:00"]
        best_days: ["Tuesday", "Thursday", "Friday"]
      frequency:
        recommended: "1-3 per day"
        minimum: "3 per week"
      sound_strategy:
        trending_sounds: true
        original_sounds: true
      hashtag_strategy:
        count: "3-5"
        include_fyp: true
        niche_specific: true

    engagement_settings:
      response_time_target: "2 hours"
      comment_style: "Casual, authentic"
      duet_enabled: true
      stitch_enabled: true

  # ═══════════════════════════════════════════════════════════════════════════
  # FACEBOOK CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  facebook:
    platform_id: "FACEBOOK"
    page_type: "Business"

    content_types:
      text_post:
        enabled: true
        max_length: 63206
        recommended_length: "40-80"

      image_post:
        enabled: true
        recommended_size: "1200x630"
        aspect_ratio: "1.91:1"
        max_images: 10

      video_post:
        enabled: true
        max_duration: 240
        recommended_duration: "15-60"
        aspect_ratios: ["16:9", "1:1", "4:5", "9:16"]

      story:
        enabled: true
        duration: 24
        media_duration: 20
        aspect_ratio: "9:16"

      reel:
        enabled: true
        max_duration: 60
        aspect_ratio: "9:16"

      live:
        enabled: true
        max_duration: 480

    posting_settings:
      optimal_times:
        best_times: ["09:00", "13:00", "16:00"]
        best_days: ["Wednesday", "Thursday", "Friday"]
      frequency:
        recommended: "1-2 per day"
        minimum: "3 per week"

    engagement_settings:
      response_time_target: "2 hours"
      messenger_response: "4 hours"
      review_monitoring: true

  # ═══════════════════════════════════════════════════════════════════════════
  # YOUTUBE CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  youtube:
    platform_id: "YOUTUBE"
    channel_type: "Brand"

    content_types:
      long_form_video:
        enabled: true
        max_duration: 720
        recommended_duration: "8-15"
        aspect_ratio: "16:9"
        resolution: "1920x1080"
        max_file_size: "256GB"

      shorts:
        enabled: true
        max_duration: 60
        aspect_ratio: "9:16"
        resolution: "1080x1920"

      community_post:
        enabled: true
        types: ["Text", "Image", "Poll", "Quiz"]

      live_stream:
        enabled: true
        scheduling: true

    posting_settings:
      optimal_times:
        best_times: ["14:00", "15:00", "16:00"]
        best_days: ["Thursday", "Friday", "Saturday"]
      frequency:
        long_form: "1-2 per week"
        shorts: "3-5 per week"
        community: "Daily"

    optimization:
      seo:
        title_length: "60-70 characters"
        description_length: "200-300 words"
        tags: "5-8 relevant tags"
        chapters: "Enabled for long videos"
      thumbnails:
        size: "1280x720"
        text: "Minimal, readable"

  # ═══════════════════════════════════════════════════════════════════════════
  # CROSS-PLATFORM SETTINGS
  # ═══════════════════════════════════════════════════════════════════════════

  cross_platform:
    default_timezone: "America/New_York"

    content_adaptation:
      enabled: true
      rules:
        - "Adjust caption length per platform"
        - "Adapt aspect ratios"
        - "Platform-specific hashtags"
        - "Tone adjustments"

    link_management:
      link_shortening: true
      utm_tracking: true
      utm_parameters:
        source: "Platform name"
        medium: "social"
        campaign: "Campaign name"

    brand_guidelines:
      tone_of_voice: "Professional yet approachable"
      emoji_usage: "Moderate"
      hashtag_style: "Lowercase"
      response_style: "Helpful, friendly"
