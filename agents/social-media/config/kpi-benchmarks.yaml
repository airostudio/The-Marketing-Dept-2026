# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL MEDIA AGENT - KPI BENCHMARKS CONFIGURATION
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

kpi_benchmarks:
  version: "1.0.0"
  last_calibrated: "2026-01-22"

  # ═══════════════════════════════════════════════════════════════════════════
  # ENGAGEMENT RATE BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  engagement_rate:
    definition: "Total engagements / Total reach * 100"

    by_platform:
      instagram:
        feed:
          excellent: 6.0
          good: 3.5
          average: 1.5
          below_average: 0.5
        reels:
          excellent: 8.0
          good: 5.0
          average: 2.5
          below_average: 1.0
        stories:
          reply_rate:
            excellent: 3.0
            good: 1.5
            average: 0.5

      linkedin:
        excellent: 4.0
        good: 2.0
        average: 1.0
        below_average: 0.5

      twitter:
        excellent: 3.0
        good: 1.5
        average: 0.5
        below_average: 0.2

      tiktok:
        excellent: 10.0
        good: 6.0
        average: 3.0
        below_average: 1.0

      facebook:
        excellent: 2.0
        good: 1.0
        average: 0.5
        below_average: 0.2

      youtube:
        videos:
          excellent: 5.0
          good: 3.0
          average: 1.5
          below_average: 0.5
        shorts:
          excellent: 8.0
          good: 5.0
          average: 2.0

    by_industry:
      technology:
        instagram: 1.5
        linkedin: 2.0
        twitter: 0.8

      ecommerce:
        instagram: 2.5
        facebook: 0.8
        tiktok: 4.0

      b2b_services:
        linkedin: 2.5
        twitter: 1.0

      consumer_goods:
        instagram: 3.0
        tiktok: 5.0
        facebook: 1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # REACH & IMPRESSIONS BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  reach_metrics:
    reach_rate:
      definition: "Reach / Followers * 100"

      by_platform:
        instagram:
          feed:
            excellent: 40
            good: 25
            average: 15
            below_average: 8
          reels:
            excellent: 100
            good: 50
            average: 25
            below_average: 10
          stories:
            excellent: 15
            good: 10
            average: 5

        linkedin:
          excellent: 20
          good: 12
          average: 6
          below_average: 3

        twitter:
          excellent: 10
          good: 5
          average: 2
          below_average: 1

        facebook:
          excellent: 15
          good: 8
          average: 4
          below_average: 2

    impressions_per_post:
      note: "Varies significantly by follower count"

      scaling_factors:
        small_account: # <10K followers
          multiplier: "1.5-3x follower count"
        medium_account: # 10K-100K
          multiplier: "1-2x follower count"
        large_account: # 100K+
          multiplier: "0.5-1x follower count"

  # ═══════════════════════════════════════════════════════════════════════════
  # FOLLOWER GROWTH BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  follower_growth:
    monthly_growth_rate:
      definition: "Net new followers / Starting followers * 100"

      by_platform:
        instagram:
          excellent: 5.0
          good: 2.5
          average: 1.0
          below_average: 0.0

        linkedin:
          excellent: 4.0
          good: 2.0
          average: 1.0
          below_average: 0.0

        twitter:
          excellent: 3.0
          good: 1.5
          average: 0.5
          below_average: 0.0

        tiktok:
          excellent: 15.0
          good: 8.0
          average: 3.0
          below_average: 0.0

        youtube:
          excellent: 3.0
          good: 1.5
          average: 0.5
          below_average: 0.0

      by_account_size:
        startup: # <1K
          monthly: "10-20%"
        growing: # 1K-10K
          monthly: "5-10%"
        established: # 10K-100K
          monthly: "2-5%"
        large: # 100K+
          monthly: "1-3%"

  # ═══════════════════════════════════════════════════════════════════════════
  # VIDEO PERFORMANCE BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  video_metrics:
    view_rate:
      definition: "Views / Impressions * 100"

      by_platform:
        instagram_reels:
          excellent: 80
          good: 50
          average: 30
          below_average: 15

        tiktok:
          excellent: 90
          good: 70
          average: 50
          below_average: 30

        youtube:
          ctr_thumbnail:
            excellent: 10
            good: 6
            average: 4
            below_average: 2

        linkedin:
          excellent: 50
          good: 30
          average: 15
          below_average: 8

    watch_time:
      average_view_duration:
        tiktok:
          excellent: "75%"
          good: "50%"
          average: "30%"

        youtube:
          excellent: "50%"
          good: "40%"
          average: "30%"

        instagram_reels:
          excellent: "60%"
          good: "40%"
          average: "25%"

    completion_rate:
      definition: "Complete views / Total views * 100"

      by_video_length:
        short_15s:
          excellent: 70
          good: 50
          average: 35

        medium_30s:
          excellent: 50
          good: 35
          average: 20

        long_60s:
          excellent: 35
          good: 25
          average: 15

  # ═══════════════════════════════════════════════════════════════════════════
  # CONVERSION BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  conversion_metrics:
    click_through_rate:
      definition: "Link clicks / Impressions * 100"

      by_platform:
        instagram:
          link_in_bio:
            excellent: 3.0
            good: 1.5
            average: 0.5
          story_swipe:
            excellent: 5.0
            good: 2.5
            average: 1.0

        linkedin:
          excellent: 2.5
          good: 1.5
          average: 0.5

        twitter:
          excellent: 2.0
          good: 1.0
          average: 0.3

        facebook:
          excellent: 2.0
          good: 1.0
          average: 0.4

    conversion_rate:
      definition: "Conversions / Link clicks * 100"
      note: "Highly dependent on offer and landing page"

      benchmarks:
        excellent: 5.0
        good: 2.5
        average: 1.0
        below_average: 0.5

  # ═══════════════════════════════════════════════════════════════════════════
  # COMMUNITY HEALTH BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════

  community_health:
    response_rate:
      definition: "Responses / Total messages * 100"
      target: 95
      minimum: 80

    response_time:
      excellent: "< 1 hour"
      good: "< 4 hours"
      average: "< 24 hours"
      poor: "> 24 hours"

    sentiment_ratio:
      definition: "Positive + Neutral / Total * 100"
      healthy: 85
      warning: 70
      critical: 60

    comment_quality:
      average_comment_length:
        engaged: "> 20 characters"
        low_engagement: "< 5 characters (emojis only)"

      conversation_depth:
        definition: "Replies to comments / Total comments"
        excellent: 0.3
        good: 0.15
        average: 0.05

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT PERFORMANCE SCORING
  # ═══════════════════════════════════════════════════════════════════════════

  content_scoring:
    score_model:
      name: "Content Performance Score"
      scale: "0-100"

      calculation:
        engagement_component:
          weight: 0.40
          formula: "(actual_engagement_rate / benchmark) * 100"

        reach_component:
          weight: 0.30
          formula: "(actual_reach_rate / benchmark) * 100"

        conversion_component:
          weight: 0.20
          formula: "(actual_ctr / benchmark) * 100"

        quality_component:
          weight: 0.10
          factors:
            - "Sentiment of comments"
            - "Save/bookmark rate"
            - "Share rate"

    performance_tiers:
      top_performer:
        score: 85
        action: "Analyze for insights, consider boosting"

      high_performer:
        score: 70
        action: "Document learnings, replicate elements"

      average:
        score: 50
        action: "Standard optimization"

      below_average:
        score: 30
        action: "Review for improvements"

      poor:
        score: 0
        action: "Archive, learn from mistakes"

  # ═══════════════════════════════════════════════════════════════════════════
  # ALERT THRESHOLDS
  # ═══════════════════════════════════════════════════════════════════════════

  alert_thresholds:
    positive_alerts:
      - name: "Viral Content"
        trigger: "Engagement > 5x average"
        action: "Monitor, consider amplification"

      - name: "Rapid Follower Growth"
        trigger: "Daily growth > 3x average"
        action: "Investigate source, capitalize"

    negative_alerts:
      - name: "Engagement Drop"
        trigger: "Engagement < 50% of average for 7 days"
        action: "Review content strategy"

      - name: "Follower Loss"
        trigger: "Net negative growth for 3+ days"
        action: "Investigate cause"

      - name: "Reach Decline"
        trigger: "Reach < 60% of average for 7 days"
        action: "Review algorithm changes, content quality"

      - name: "Sentiment Shift"
        trigger: "Negative sentiment > 30% for 24 hours"
        action: "Immediate investigation"
