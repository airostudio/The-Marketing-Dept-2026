<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audit harness</title></head>
<body>
<!-- seo-audit.js now attaches the session to /api/fetch-page and
     /api/check-url, so the harness loads the same helper the real pages do.
     Without it window.sendAuthHeaders is undefined and every crawl throws. -->
<script src="/send-auth.js"></script>
<script src="/seo-audit.js"></script>
<script>
window.__done = null;
window.runAudit = function (origin) {
  return new Promise((resolve, reject) => {
    const audit = new window.SEOAudit(origin, {
      maxPages: 25,
      maxDepth: 3,
      onComplete: (r) => resolve({
        issues: r.issues,
        crawledUrls: r.crawledUrls,
        pageData: Object.keys(r.pageData),
        state: {
          robotsSkipped: window.SEOAudit.getState().robotsSkipped,
          redirects: window.SEOAudit.getState().redirects,
          robotsRules: window.SEOAudit.getState().robotsRules,
        }
      }),
      onError: (e) => reject(e.message || String(e)),
    });
    audit.start();
  });
};
</script>
</body></html>
