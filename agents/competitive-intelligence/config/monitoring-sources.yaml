# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT - MONITORING SOURCES CONFIGURATION
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

monitoring_sources:
  version: "1.0.0"
  last_updated: "2026-01-22"

  # ═══════════════════════════════════════════════════════════════════════════
  # NEWS & MEDIA SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  news_media:
    mainstream_business:
      sources:
        - name: "Reuters"
          type: "Wire service"
          coverage: "Global business news"
          priority: "High"

        - name: "Bloomberg"
          type: "Financial news"
          coverage: "Business, markets, technology"
          priority: "High"

        - name: "Wall Street Journal"
          type: "Business newspaper"
          coverage: "Business, finance, economics"
          priority: "High"

        - name: "Financial Times"
          type: "Financial newspaper"
          coverage: "Global business, economics"
          priority: "High"

    technology_focused:
      sources:
        - name: "TechCrunch"
          type: "Tech news"
          coverage: "Startups, technology, funding"
          priority: "High"

        - name: "VentureBeat"
          type: "Tech news"
          coverage: "AI, enterprise tech, gaming"
          priority: "Medium"

        - name: "The Verge"
          type: "Tech news"
          coverage: "Technology, culture"
          priority: "Medium"

        - name: "Wired"
          type: "Tech magazine"
          coverage: "Technology, science, culture"
          priority: "Medium"

        - name: "ZDNet"
          type: "Enterprise tech"
          coverage: "Enterprise technology"
          priority: "Medium"

    industry_specific:
      sources:
        - name: "[Industry Publication 1]"
          type: "Trade publication"
          coverage: "Industry-specific news"
          priority: "High"

        - name: "[Industry Publication 2]"
          type: "Trade publication"
          coverage: "Industry-specific news"
          priority: "High"

    monitoring_config:
      frequency: "Real-time with 15-minute aggregation"
      alert_threshold: "Any competitor mention"
      sentiment_tracking: true

  # ═══════════════════════════════════════════════════════════════════════════
  # SOCIAL MEDIA SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  social_media:
    platforms:
      linkedin:
        monitoring:
          - "Company pages"
          - "Executive profiles"
          - "Employee posts"
          - "Job postings"
          - "Company updates"
        signals:
          - "Announcements"
          - "Product updates"
          - "Hiring patterns"
          - "Thought leadership"
        frequency: "Daily"

      twitter:
        monitoring:
          - "Official company accounts"
          - "Executive accounts"
          - "Product accounts"
          - "Mentions and hashtags"
        signals:
          - "Announcements"
          - "Customer interactions"
          - "Campaign activity"
          - "Sentiment"
        frequency: "Real-time"

      facebook:
        monitoring:
          - "Company pages"
          - "Ad library"
          - "Event pages"
        signals:
          - "Marketing campaigns"
          - "Customer engagement"
          - "Event announcements"
        frequency: "Daily"

      youtube:
        monitoring:
          - "Company channels"
          - "Product demos"
          - "Webinar recordings"
        signals:
          - "Product tutorials"
          - "Marketing content"
          - "Customer testimonials"
        frequency: "Weekly"

    aggregation:
      tool: "Social listening platform"
      dashboards: "Per-competitor and aggregate"
      alerts: "Significant engagement or announcements"

  # ═══════════════════════════════════════════════════════════════════════════
  # WEBSITE MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  website_monitoring:
    pages_to_monitor:
      critical:
        - page: "Homepage"
          elements: ["Messaging", "Hero content", "Navigation"]
          frequency: "Daily"

        - page: "Pricing page"
          elements: ["Prices", "Tiers", "Features by tier"]
          frequency: "Daily"

        - page: "Product pages"
          elements: ["Features", "Benefits", "Specifications"]
          frequency: "Weekly"

      important:
        - page: "About/Company"
          elements: ["Team", "Mission", "Investors"]
          frequency: "Weekly"

        - page: "Careers"
          elements: ["Open positions", "Team size signals"]
          frequency: "Weekly"

        - page: "Blog"
          elements: ["New posts", "Topics", "Themes"]
          frequency: "Daily"

        - page: "Resources/Library"
          elements: ["New content", "Topic areas"]
          frequency: "Weekly"

      periodic:
        - page: "Press/Newsroom"
          elements: ["Press releases", "Media coverage"]
          frequency: "Weekly"

        - page: "Partners"
          elements: ["Partner ecosystem", "Integrations"]
          frequency: "Monthly"

        - page: "Customer stories"
          elements: ["New case studies", "Customer logos"]
          frequency: "Monthly"

    change_detection:
      method: "Automated diff monitoring"
      notification: "On significant changes"
      archive: "Store historical snapshots"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB POSTING MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  job_posting_monitoring:
    sources:
      - "LinkedIn Jobs"
      - "Company career pages"
      - "Indeed"
      - "Glassdoor"
      - "AngelList (for startups)"

    tracking_metrics:
      volume:
        - "Total open positions"
        - "Positions by department"
        - "Week-over-week change"

      analysis:
        - "New role types (signals priorities)"
        - "Geographic expansion signals"
        - "Technology stack signals"
        - "Seniority levels (investment signals)"

    strategic_signals:
      expansion:
        - "New geographic hiring"
        - "New department creation"
        - "Leadership hiring"

      product:
        - "Engineering focus areas"
        - "New technology hiring"
        - "Product management priorities"

      go_to_market:
        - "Sales team expansion"
        - "Marketing team growth"
        - "Customer success scaling"

    frequency: "Weekly aggregation"

  # ═══════════════════════════════════════════════════════════════════════════
  # FINANCIAL & CORPORATE SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  financial_sources:
    public_companies:
      sec_filings:
        - "10-K (Annual report)"
        - "10-Q (Quarterly report)"
        - "8-K (Current report)"
        - "Proxy statements"

      earnings:
        - "Earnings call transcripts"
        - "Investor presentations"
        - "Guidance updates"

      frequency: "As filed/quarterly"

    private_companies:
      funding:
        - "Crunchbase"
        - "PitchBook"
        - "CB Insights"
        - "Press release tracking"

      signals:
        - "Funding announcements"
        - "Valuation reports"
        - "Investor updates"

    corporate_registries:
      - "Trademark/patent filings"
      - "Business registration changes"
      - "Executive changes (LinkedIn, press)"

  # ═══════════════════════════════════════════════════════════════════════════
  # INDUSTRY & ANALYST SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  industry_analyst:
    analyst_firms:
      - name: "Gartner"
        reports:
          - "Magic Quadrant"
          - "Market Guide"
          - "Critical Capabilities"
        tracking: "Publication calendar"

      - name: "Forrester"
        reports:
          - "Wave reports"
          - "Now Tech"
          - "Research reports"
        tracking: "Publication calendar"

      - name: "IDC"
        reports:
          - "MarketScape"
          - "Market share reports"
          - "Research"
        tracking: "Publication calendar"

      - name: "G2/TrustRadius"
        data:
          - "Review aggregation"
          - "Rating trends"
          - "Comparison data"
        tracking: "Monthly"

    industry_associations:
      - "Industry group reports"
      - "Conference proceedings"
      - "Benchmark studies"

    monitoring_approach:
      - "Track publication schedules"
      - "Alert on competitor mentions"
      - "Analyze positioning changes"

  # ═══════════════════════════════════════════════════════════════════════════
  # REVIEW & COMMUNITY SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  review_community:
    review_platforms:
      - name: "G2"
        monitoring:
          - "New reviews"
          - "Rating changes"
          - "Competitive comparisons"
        frequency: "Weekly"

      - name: "TrustRadius"
        monitoring:
          - "New reviews"
          - "Rating trends"
          - "TrustMaps positioning"
        frequency: "Weekly"

      - name: "Capterra"
        monitoring:
          - "New reviews"
          - "Category positioning"
          - "Rating trends"
        frequency: "Monthly"

      - name: "Glassdoor"
        monitoring:
          - "Employee reviews"
          - "Rating trends"
          - "Leadership reviews"
        frequency: "Monthly"

    community_forums:
      - "Reddit (relevant subreddits)"
      - "Quora"
      - "Stack Overflow (if relevant)"
      - "Industry forums"
      - "Slack communities"

    monitoring_approach:
      - "Track competitor mentions"
      - "Monitor sentiment trends"
      - "Identify common complaints/praise"

  # ═══════════════════════════════════════════════════════════════════════════
  # FIELD INTELLIGENCE SOURCES
  # ═══════════════════════════════════════════════════════════════════════════

  field_intelligence:
    sales_team:
      collection_methods:
        - "Deal debrief submissions"
        - "Competitive encounter reports"
        - "Win/loss interview program"
        - "CRM competitive fields"

      information_gathered:
        - "Competitor presence in deals"
        - "Pricing intelligence"
        - "Positioning/messaging observed"
        - "Customer feedback on competitors"

    customer_success:
      collection_methods:
        - "Customer feedback forms"
        - "QBR competitive mentions"
        - "Support ticket analysis"

      information_gathered:
        - "Competitive switch requests"
        - "Feature comparison questions"
        - "Competitor usage by customers"

    conferences_events:
      collection_methods:
        - "Booth visit reports"
        - "Session attendance notes"
        - "Networking intelligence"

      information_gathered:
        - "Competitor presentations"
        - "Product demos observed"
        - "Messaging and positioning"
        - "Customer conversations"

  # ═══════════════════════════════════════════════════════════════════════════
  # SOURCE RELIABILITY RATINGS
  # ═══════════════════════════════════════════════════════════════════════════

  source_reliability:
    tier_1_primary:
      examples:
        - "Official company announcements"
        - "SEC filings"
        - "Verified press releases"
      reliability: "High"
      verification: "Can use directly"

    tier_2_secondary:
      examples:
        - "Reputable news sources"
        - "Analyst reports"
        - "Industry publications"
      reliability: "Medium-High"
      verification: "Verify major claims"

    tier_3_tertiary:
      examples:
        - "Social media posts"
        - "Forum discussions"
        - "Anonymous reviews"
      reliability: "Medium"
      verification: "Corroborate before using"

    tier_4_unverified:
      examples:
        - "Rumors"
        - "Single-source claims"
        - "Speculation"
      reliability: "Low"
      verification: "Must verify independently"
