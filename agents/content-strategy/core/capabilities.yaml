            - dimension: "SEO Health"
              indicators:
                - "Ranking stability"
                - "Indexation status"
                - "Technical issues"

        - feature: "Health Scoring"
          levels:
            - level: "Healthy"
              score: "80-100"
              action: "Monitor"

            - level: "Needs Attention"
              score: "60-79"
              action: "Schedule optimization"

            - level: "At Risk"
              score: "40-59"
              action: "Prioritize refresh"

            - level: "Critical"
              score: "20-39"
              action: "Immediate action required"

            - level: "Retire Candidate"
              score: "0-19"
