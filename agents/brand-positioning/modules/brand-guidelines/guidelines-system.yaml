  # VERBAL IDENTITY GUIDELINES
  # ═══════════════════════════════════════════════════════════════════════════

  verbal_identity:

    naming_guidelines:
      brand_name:
        spelling: "Exact spelling"
        capitalization: "How to capitalize"
        usage: "When to use full name vs. short"

      product_naming:
        convention: "Naming pattern"
        approval_process: "How names are approved"
        trademark: "Trademark requirements"

      descriptor_usage:
        format: "How to describe brand/products"
        approved_descriptors: "List of approved terms"

    tagline_guidelines:
      primary_tagline:
        tagline: "The tagline"
        usage: "When and where to use"
        placement: "Position relative to logo"
        translation: "Localization guidance"

    boilerplate:
      short_version: "25-word description"
      medium_version: "50-word description"
