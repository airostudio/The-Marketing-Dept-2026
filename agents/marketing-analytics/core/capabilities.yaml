capabilities:
  version: "1.0.0"
  last_updated: "2026-01-21"

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 1: CROSS-CHANNEL ATTRIBUTION
  # ═══════════════════════════════════════════════════════════════════════════

  attribution:
    category_id: "ATTRIBUTION"

    models:
      - model: "Last-Touch Attribution"
        description: "Credit to final touchpoint"
        use_case: "Direct response campaigns"

      - model: "First-Touch Attribution"
        description: "Credit to first touchpoint"
        use_case: "Awareness campaigns"

      - model: "Linear Attribution"
        description: "Equal credit to all touchpoints"
        use_case: "Balanced view"

      - model: "Time-Decay Attribution"
        description: "More credit to recent touchpoints"
        use_case: "Sales-focused analysis"

      - model: "Position-Based Attribution"
        description: "40% first, 40% last, 20% middle"
        use_case: "Full-funnel campaigns"

      - model: "Data-Driven Attribution"
        description: "ML-based credit allocation"
        use_case: "Advanced optimization"

      - model: "Incrementality Testing"
        description: "True lift measurement"
        use_case: "Budget allocation"

    features:
      - "Cross-device attribution"
      - "Cross-channel tracking"
      - "Offline conversion integration"
      - "Model comparison analysis"
      - "Attribution window configuration"
      - "Custom model builder"

