# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT - THREAT DETECTION MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "threat-detection"
  name: "Competitive Threat Monitoring Engine"
  version: "1.0.0"
  category: "intelligence"

  # ═══════════════════════════════════════════════════════════════════════════
  # THREAT MONITORING SYSTEM
  # ═══════════════════════════════════════════════════════════════════════════

  threat_monitoring:

    real_time_monitoring:
      news_alerts:
        sources:
          - "Google Alerts"
          - "News aggregators"
          - "Industry publications"
          - "Press release wires"
          - "Social media"

        keywords:
          competitor_names: "All tracked competitors"
          industry_terms: "Key industry keywords"
          executives: "Key competitor executives"
          products: "Competitor product names"

        alert_triggers:
          - "Funding announcement"
          - "Acquisition news"
          - "Product launch"
          - "Leadership change"
          - "Partnership announcement"
          - "Customer win"
          - "Negative news"

      website_monitoring:
        tracked_pages:
          - "Homepage"
          - "Product pages"
          - "Pricing page"
          - "Blog/news"
          - "Careers page"

        change_detection:
          - "Content changes"
          - "New pages"
          - "Removed content"
          - "Price changes"
          - "Feature updates"

        frequency:
          critical_competitors: "Daily"
          standard_competitors: "Weekly"

      social_monitoring:
        platforms:
          - "LinkedIn"
          - "Twitter/X"
          - "Facebook"
          - "YouTube"
          - "Industry forums"

        tracked_signals:
          - "Official announcements"
          - "Executive posts"
          - "Campaign launches"
          - "Customer mentions"
          - "Sentiment trends"

    signal_detection:
      strategic_signals:
        expansion:
          indicators:
            - "New geographic office"
            - "Hiring in new region"
            - "Localized website/content"
            - "Local partnerships"
          assessment: "Geographic expansion threat"

        market_entry:
          indicators:
            - "New product for adjacent market"
            - "Acquisition in new space"
            - "New messaging targeting segment"
            - "Hiring for new capabilities"
          assessment: "New market threat"

        investment:
          indicators:
            - "Large funding round"
            - "Increased marketing spend"
            - "Aggressive hiring"
            - "New office openings"
          assessment: "Competitive intensity increase"

        product:
          indicators:
            - "Major feature launch"
            - "Platform expansion"
            - "New product line"
            - "Technology acquisition"
          assessment: "Product competitive threat"

      early_warning_signals:
        pre_launch_indicators:
          - "Job postings for new capabilities"
          - "Patent/trademark filings"
          - "Beta program announcements"
          - "Conference session topics"
          - "Executive interviews hinting"

        partnership_indicators:
          - "Integration announcements"
          - "Joint marketing activity"
          - "Co-selling arrangements"
          - "Technology partnerships"

        m_and_a_indicators:
          - "Advisor hiring"
          - "Leadership changes"
          - "Unusual quiet period"
          - "Industry consolidation patterns"

  # ═══════════════════════════════════════════════════════════════════════════
  # THREAT ASSESSMENT FRAMEWORK
  # ═══════════════════════════════════════════════════════════════════════════

  threat_assessment:

    threat_classification:
      direct_threats:
        definition: "Immediate competitive impact"
        examples:
          - "Competitor launches similar feature"
          - "Price cut announced"
          - "Major customer targeted"
          - "Negative comparison campaign"

      indirect_threats:
        definition: "Longer-term competitive impact"
        examples:
          - "Strategic partnership announced"
          - "New market entry"
          - "Talent acquisition"
          - "Platform investment"

      disruptive_threats:
        definition: "Game-changing competitive dynamics"
        examples:
          - "New business model"
          - "Technology breakthrough"
          - "Category redefinition"
          - "Unexpected new entrant"

    threat_scoring:
      methodology:
        impact:
          weight: 0.35
          levels:
            critical: "Threatens core business"
            high: "Significant competitive impact"
            medium: "Moderate competitive effect"
            low: "Limited impact"

        likelihood:
          weight: 0.25
          levels:
            certain: "Confirmed/announced"
            likely: "Strong indicators"
            possible: "Some signals"
            unlikely: "Weak signals"

        imminence:
          weight: 0.20
          levels:
            immediate: "Happening now"
            short_term: "Within 3 months"
            medium_term: "3-12 months"
            long_term: "12+ months"

        defensibility:
          weight: 0.20
          levels:
            low: "Limited defense options"
            medium: "Some defensive measures possible"
            high: "Strong defense capabilities"

      composite_score:
        formula: "Impact × Likelihood × Imminence × (1 - Defensibility)"
        scale: "0-100"

    threat_levels:
      red_alert:
        score_range: "80-100"
        characteristics:
          - "Immediate, confirmed threat"
          - "High business impact"
          - "Limited defensive options"
        response:
          - "Immediate notification to CMO"
          - "Emergency response team"
          - "Same-day action plan"
        monitoring: "Continuous"

      orange_alert:
        score_range: "60-79"
        characteristics:
          - "Near-term, likely threat"
          - "Significant impact potential"
          - "Defensive action needed"
        response:
          - "CMO notification within 24 hours"
          - "Develop response strategy"
          - "Accelerate defensive measures"
        monitoring: "Daily"

      yellow_alert:
        score_range: "40-59"
        characteristics:
          - "Medium-term potential threat"
          - "Moderate impact"
          - "Time to prepare"
        response:
          - "Weekly monitoring"
          - "Prepare contingency plans"
          - "Track closely"
        monitoring: "Weekly"

      green_monitor:
        score_range: "0-39"
        characteristics:
          - "Low immediate threat"
          - "Limited impact potential"
          - "Standard competitive activity"
        response:
          - "Standard monitoring"
          - "Document in regular reports"
        monitoring: "Standard cycle"

  # ═══════════════════════════════════════════════════════════════════════════
  # SPECIFIC THREAT TYPES
  # ═══════════════════════════════════════════════════════════════════════════

  threat_types:

    product_threats:
      feature_parity:
        signal: "Competitor launches similar feature"
        assessment_questions:
          - "How does it compare to ours?"
          - "What's their positioning?"
          - "Customer perception impact?"
        response_options:
          - "Messaging reinforcement"
          - "Feature enhancement"
          - "Differentiation emphasis"

      technology_leap:
        signal: "Competitor achieves technology breakthrough"
        assessment_questions:
          - "Is it genuine advancement?"
          - "Can we match/exceed?"
          - "Customer value impact?"
        response_options:
          - "R&D acceleration"
          - "Alternative approach"
          - "Messaging around strengths"

    pricing_threats:
      price_cut:
        signal: "Competitor reduces prices"
        assessment_questions:
          - "How significant is the change?"
          - "Sustainable or promotional?"
          - "Our value proposition impact?"
        response_options:
          - "Value reinforcement"
          - "Selective price matching"
          - "Bundle/package response"

      freemium_launch:
        signal: "Competitor introduces free tier"
        assessment_questions:
          - "What's included in free?"
          - "Conversion strategy?"
          - "Impact on our pipeline?"
        response_options:
          - "Trial enhancement"
          - "Value demonstration"
          - "Upsell emphasis"

    market_threats:
      new_entrant:
        signal: "New competitor enters market"
        assessment_questions:
          - "Who are they?"
          - "What's their angle?"
          - "Resources and backing?"
        response_options:
          - "Enhanced monitoring"
          - "Defensive positioning"
          - "Customer communication"

      acquisition:
        signal: "Competitor acquires capability"
        assessment_questions:
          - "What capability gained?"
          - "Integration timeline?"
          - "Competitive implications?"
        response_options:
          - "Capability assessment"
          - "Partnership exploration"
          - "Internal development"

    customer_threats:
      key_account_targeting:
        signal: "Competitor actively pursuing our key account"
        assessment_questions:
          - "Which account?"
          - "What's their pitch?"
          - "Contract status?"
        response_options:
          - "Account defense plan"
          - "Executive engagement"
          - "Value reinforcement"

      customer_churn:
        signal: "Customer switching to competitor"
        assessment_questions:
          - "Why are they leaving?"
          - "Exit interview insights?"
          - "Pattern detection?"
        response_options:
          - "Win-back attempt"
          - "Root cause analysis"
          - "Retention program enhancement"

    reputation_threats:
      negative_campaign:
        signal: "Competitor launches negative comparison"
        assessment_questions:
          - "What claims are made?"
          - "Accuracy assessment?"
          - "Reach and impact?"
        response_options:
          - "Response strategy"
          - "Counter-messaging"
          - "Customer communication"

      viral_negative:
        signal: "Negative content gains traction"
        assessment_questions:
          - "Source and credibility?"
          - "Spread assessment?"
          - "Customer awareness?"
        response_options:
          - "Crisis assessment"
          - "Response preparation"
          - "Stakeholder communication"

  # ═══════════════════════════════════════════════════════════════════════════
  # RESPONSE PLAYBOOKS
  # ═══════════════════════════════════════════════════════════════════════════

  response_playbooks:

    product_launch_response:
      trigger: "Competitor launches major product/feature"
      immediate_actions:
        - "Gather all available information"
        - "Assess feature comparison"
        - "Notify relevant stakeholders"
      analysis_phase:
        - "Detailed feature assessment"
        - "Customer impact evaluation"
        - "Sales team briefing"
      response_development:
        - "Positioning recommendation"
        - "Talking points for sales"
        - "Marketing response plan"

    pricing_change_response:
      trigger: "Competitor changes pricing"
      immediate_actions:
        - "Document all pricing changes"
        - "Calculate competitive impact"
        - "Alert sales and marketing"
      analysis_phase:
        - "Value comparison analysis"
        - "Customer sensitivity assessment"
        - "Win rate impact prediction"
      response_development:
        - "Pricing response recommendation"
        - "Value proposition updates"
        - "Sales enablement refresh"

    acquisition_response:
      trigger: "Competitor announces acquisition"
      immediate_actions:
        - "Assess acquired company"
        - "Identify capability gains"
        - "Notify leadership"
      analysis_phase:
        - "Integration timeline estimate"
        - "Competitive impact assessment"
        - "Customer impact evaluation"
      response_development:
        - "Strategic implications brief"
        - "Positioning adjustments"
        - "Customer communication plan"

    new_entrant_response:
      trigger: "New competitor enters market"
      immediate_actions:
        - "Create initial profile"
        - "Assess threat level"
        - "Begin monitoring"
      analysis_phase:
        - "Full competitive analysis"
        - "Target customer overlap"
        - "Positioning comparison"
      response_development:
        - "Monitoring plan"
        - "Defensive measures"
        - "Battlecard development"

  # ═══════════════════════════════════════════════════════════════════════════
  # ALERT MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  alert_management:

    alert_workflow:
      detection:
        - "Automated monitoring"
        - "Manual research"
        - "Field reports"
        - "Partner intelligence"

      validation:
        - "Source verification"
        - "Cross-reference check"
        - "Significance assessment"

      classification:
        - "Threat level assignment"
        - "Category tagging"
        - "Priority determination"

      notification:
        - "Route to appropriate recipients"
        - "Include context and assessment"
        - "Suggest response actions"

      tracking:
        - "Monitor developments"
        - "Update status"
        - "Document resolution"

    notification_matrix:
      red_alert:
        recipients:
          - "CMO Agent (immediate)"
          - "Affected department heads"
          - "Sales leadership"
        channels: "Direct message + email + dashboard"
        sla: "Within 1 hour"

      orange_alert:
        recipients:
          - "CMO Agent"
          - "Marketing leadership"
        channels: "Email + dashboard"
        sla: "Within 24 hours"

      yellow_alert:
        recipients:
          - "Marketing team"
        channels: "Dashboard + weekly summary"
        sla: "Weekly report"

    deduplication:
      rules:
        - "Suppress duplicate alerts within 24 hours"
        - "Aggregate related alerts"
        - "Update existing alerts with new information"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_cmo_agent:
      - "Critical threat alerts"
      - "Threat assessment summaries"
      - "Response recommendations"
      - "Weekly threat radar"

    to_sales_team:
      - "Deal-specific threat alerts"
      - "Competitive activity updates"
      - "Response talking points"

    to_product_team:
      - "Product threat analysis"
      - "Feature competitive updates"
      - "Technology threat assessment"

    to_brand_positioning_agent:
      - "Positioning threats"
      - "Messaging attack alerts"
      - "Competitive positioning shifts"

    dashboards:
      - "Real-time threat radar"
      - "Alert activity log"
      - "Threat trend analysis"
      - "Response tracking"
