# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT - COMPETITOR PROFILING MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "competitor-profiling"
  name: "Competitor Profiling Engine"
  version: "1.0.0"
  category: "intelligence"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPANY PROFILE STRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  company_profile:

    basic_information:
      company_identity:
        - "Company name and legal entity"
        - "Headquarters location"
        - "Founded date"
        - "Company type (public/private/subsidiary)"
        - "Stock ticker (if public)"

      scale_metrics:
        - "Employee count"
        - "Revenue (estimated or reported)"
        - "Customer count (estimated)"
        - "Geographic presence"
        - "Office locations"

      company_description:
        - "Mission statement"
        - "Vision"
        - "Tagline/positioning"
        - "Company story"

    leadership_team:
      executive_profiles:
        - name: "Full name"
          title: "Position"
          background: "Relevant experience"
          tenure: "Time in role"
          linkedin: "Profile URL"
          notable: "Key accomplishments"

      leadership_analysis:
        - "Leadership style signals"
        - "Strategic priorities indicators"
        - "Industry experience"
        - "Previous company affiliations"
        - "Speaking engagements/thought leadership"

      recent_changes:
        - "New hires"
        - "Departures"
        - "Promotions"
        - "Organization changes"

    company_history:
      milestones:
        - year: "Year"
          event: "Milestone description"
          significance: "Impact on company trajectory"

      evolution:
        - "Original business model"
        - "Key pivots"
        - "Expansion moves"
        - "Major launches"
        - "Significant acquisitions"

  # ═══════════════════════════════════════════════════════════════════════════
  # FINANCIAL PROFILE
  # ═══════════════════════════════════════════════════════════════════════════

  financial_profile:

    funding_history:
      rounds:
        - round_type: "Seed, Series A, B, etc."
          amount: "Funding amount"
          date: "Date raised"
          lead_investor: "Lead investor"
          valuation: "Post-money valuation (if known)"
          notable: "Key takeaways"

      total_raised: "Cumulative funding"
      last_round_date: "Most recent funding"
      investors: "Key investor list"
      runway_estimate: "Estimated runway"

    financial_performance:
      public_companies:
        - "Revenue (quarterly/annual)"
        - "Revenue growth rate"
        - "Gross margin"
        - "Operating margin"
        - "Net income"
        - "Cash position"
        - "Guidance"

      private_companies:
        - "Revenue estimates"
        - "Growth indicators"
        - "Hiring trends (proxy for growth)"
        - "Office expansion signals"
        - "Customer count trends"

    financial_health_assessment:
      indicators:
        positive:
          - "Strong growth"
          - "Recent funding"
          - "Expanding team"
          - "New office openings"
          - "Increased marketing spend"

        negative:
          - "Layoffs"
          - "Office closures"
          - "Leadership departures"
          - "Reduced marketing activity"
          - "Customer complaints about support"

      health_score:
        scale: "1-5"
        factors:
          - "Funding/revenue strength"
          - "Growth trajectory"
          - "Operational stability"
          - "Market position"

  # ═══════════════════════════════════════════════════════════════════════════
  # PRODUCT PORTFOLIO
  # ═══════════════════════════════════════════════════════════════════════════

  product_portfolio:

    product_catalog:
      per_product:
        - name: "Product name"
          description: "Product description"
          target_user: "Primary user persona"
          use_cases: "Key use cases"
          launch_date: "When launched"
          maturity: "Emerging/Growth/Mature/Declining"

    feature_analysis:
      feature_inventory:
        - feature_category: "Category name"
          features:
            - name: "Feature name"
              description: "What it does"
              our_parity: "Ahead/Parity/Behind/Not offered"
              importance: "Critical/Important/Nice-to-have"
              notes: "Additional context"

      feature_velocity:
        - "New features launched (last 12 months)"
        - "Feature frequency"
        - "Innovation areas"
        - "Roadmap signals"

    pricing_analysis:
      pricing_model:
        - "Pricing approach (per seat, usage, flat, etc.)"
        - "Pricing tiers"
        - "Entry price point"
        - "Enterprise pricing"
        - "Free tier/trial offering"

      pricing_comparison:
        tier_comparison:
          - tier: "Tier name"
            competitor_price: "Their price"
            our_price: "Our price"
            features_included: "Key features"
            comparison: "More/Less expensive"

      pricing_strategy:
        - "Pricing positioning (premium/value/budget)"
        - "Discount practices"
        - "Bundling strategies"
        - "Annual vs monthly incentives"

    technology_platform:
      architecture:
        - "Cloud/on-premise/hybrid"
        - "Technology stack"
        - "API availability"
        - "Integration ecosystem"

      technical_differentiators:
        - "Unique technical capabilities"
        - "Performance claims"
        - "Security certifications"
        - "Compliance certifications"

  # ═══════════════════════════════════════════════════════════════════════════
  # GO-TO-MARKET STRATEGY
  # ═══════════════════════════════════════════════════════════════════════════

  go_to_market:

    target_market:
      segments:
        - segment: "Segment name"
          size: "Company size (SMB/Mid-market/Enterprise)"
          industries: "Target industries"
          geographies: "Target regions"
          personas: "Key buyer personas"

      ideal_customer_profile:
        - "Company characteristics"
        - "Use case patterns"
        - "Buying behavior"
        - "Budget range"

    sales_motion:
      model:
        - "Sales-led vs product-led"
        - "Inside vs field sales"
        - "Direct vs channel"
        - "Self-serve component"

      sales_organization:
        - "Sales team size (estimated)"
        - "Sales leadership"
        - "Territory structure"
        - "Specialization (by segment, vertical, etc.)"

      sales_process:
        - "Typical deal cycle"
        - "Buying committee"
        - "Evaluation process"
        - "POC/trial approach"

    channel_strategy:
      channels:
        - "Direct sales"
        - "Partner/reseller"
        - "Technology partners"
        - "System integrators"
        - "Marketplaces"

      partnerships:
        - partner_type: "Type"
          partners: "Key partners"
          significance: "Impact on go-to-market"

    marketing_strategy:
      positioning:
        - "Core positioning statement"
        - "Key messages"
        - "Differentiation claims"
        - "Tagline/slogan"

      marketing_mix:
        - "Primary marketing channels"
        - "Content strategy"
        - "Event presence"
        - "Advertising approach"
        - "PR/analyst relations"

      brand_perception:
        - "Brand attributes"
        - "Market perception"
        - "Share of voice"
        - "Thought leadership areas"

  # ═══════════════════════════════════════════════════════════════════════════
  # SWOT ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  swot_analysis:

    strengths:
      categories:
        product:
          - "Feature advantages"
          - "Technology strengths"
          - "Integration ecosystem"

        market:
          - "Market position"
          - "Brand recognition"
          - "Customer base"

        organization:
          - "Team/talent"
          - "Leadership"
          - "Resources/funding"

        sales:
          - "Sales effectiveness"
          - "Channel strength"
          - "Customer relationships"

    weaknesses:
      categories:
        product:
          - "Feature gaps"
          - "Technical limitations"
          - "Scalability issues"

        market:
          - "Limited awareness"
          - "Geographic limitations"
          - "Segment weaknesses"

        organization:
          - "Resource constraints"
          - "Talent gaps"
          - "Operational challenges"

        sales:
          - "Sales limitations"
          - "Channel gaps"
          - "Customer satisfaction issues"

    opportunities:
      categories:
        - "Market expansion opportunities"
        - "Product development potential"
        - "Partnership possibilities"
        - "Acquisition targets"
        - "Adjacent market entry"

    threats:
      categories:
        - "Competitive threats"
        - "Market changes"
        - "Technology shifts"
        - "Regulatory risks"
        - "Economic factors"

    strategic_implications:
      - "How strengths can be countered"
      - "How to exploit weaknesses"
      - "Threats to our position"
      - "Opportunities they may pursue"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE POSITIONING
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_positioning:

    positioning_analysis:
      current_positioning:
        - "How they position themselves"
        - "Primary differentiators claimed"
        - "Target audience focus"
        - "Value proposition"

      perception_vs_reality:
        - "Claimed vs actual strengths"
        - "Perception gaps"
        - "Credibility of claims"

    head_to_head:
      comparison_dimensions:
        - dimension: "Product capabilities"
          their_position: "Assessment"
          our_position: "Assessment"
          advantage: "Them/Us/Tie"

        - dimension: "Pricing"
          their_position: "Assessment"
          our_position: "Assessment"
          advantage: "Them/Us/Tie"

        - dimension: "Support/service"
          their_position: "Assessment"
          our_position: "Assessment"
          advantage: "Them/Us/Tie"

        - dimension: "Brand/trust"
          their_position: "Assessment"
          our_position: "Assessment"
          advantage: "Them/Us/Tie"

    positioning_map:
      axes:
        x_axis: "Dimension 1 (e.g., Ease of use)"
        y_axis: "Dimension 2 (e.g., Feature depth)"
      position:
        competitor: "Quadrant/position"
        us: "Quadrant/position"
        others: "Other competitor positions"

  # ═══════════════════════════════════════════════════════════════════════════
  # PROFILE MAINTENANCE
  # ═══════════════════════════════════════════════════════════════════════════

  profile_maintenance:

    update_schedule:
      tier_1:
        frequency: "Weekly review, monthly deep update"
        sections: "All sections"
        trigger_updates: "Any significant event"

      tier_2:
        frequency: "Monthly review, quarterly deep update"
        sections: "All sections"
        trigger_updates: "Major events"

      tier_3:
        frequency: "Quarterly review"
        sections: "Key sections"
        trigger_updates: "Significant events"

    data_sources:
      primary:
        - "Competitor website"
        - "Product documentation"
        - "Pricing pages"
        - "Press releases"
        - "Social media"

      secondary:
        - "Industry reports"
        - "News coverage"
        - "Review sites"
        - "Job postings"
        - "Patent filings"

      field_intelligence:
        - "Win/loss feedback"
        - "Customer interviews"
        - "Conference attendance"
        - "Sales encounters"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_sales_team:
      - "Competitor profile summaries"
      - "Quick reference cards"
      - "Product comparison matrices"

    to_marketing_team:
      - "Positioning analysis"
      - "Messaging comparison"
      - "Marketing strategy insights"

    to_product_team:
      - "Feature comparison details"
      - "Product roadmap signals"
      - "Technical analysis"

    to_cmo_agent:
      - "Strategic competitor assessments"
      - "Competitive landscape overview"
      - "SWOT analysis summaries"
