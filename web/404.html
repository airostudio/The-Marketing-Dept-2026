<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Audema Marketing</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been moved.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-primary);
            padding: 2rem;
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .error-illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .error-links {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
        }

        .error-links h3 {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .error-links-list {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .error-links-list a {
            color: var(--color-text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .error-links-list a:hover {
            color: var(--color-primary);
        }

        .error-links-list svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <main class="error-page" id="main-content" role="main">
        <div class="error-illustration" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" stroke="#6366F1" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
                <circle cx="100" cy="100" r="70" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" opacity="0.2"/>
                <path d="M70 90C70 90 85 75 100 75C115 75 130 90 130 90" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
                <circle cx="75" cy="70" r="8" fill="#6366F1"/>
                <circle cx="125" cy="70" r="8" fill="#6366F1"/>
                <path d="M60 130C60 130 80 110 100 110C120 110 140 130 140 130" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for doesn't exist or has been moved to a new location.
        </p>
        <div class="error-actions">
            <a href="/dashboard.html" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                Go to Dashboard
            </a>
            <a href="/index.html" class="btn btn-outline">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                Home Page
            </a>
        </div>
        <nav class="error-links" aria-label="Quick links">
            <h3>Quick Links</h3>
            <div class="error-links-list">
                <a href="/seo/audits.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M9 15l2 2 4-4"/>
                    </svg>
                    SEO Audits
                </a>
                <a href="/seo/keywords.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    Keywords
                </a>
                <a href="/tools/meta-tags.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    Tools
                </a>
                <a href="/settings.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33"/>
                    </svg>
                    Settings
                </a>
            </div>
        </nav>
    </main>
</body>
</html>
