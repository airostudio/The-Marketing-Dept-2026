# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL MEDIA AGENT - CONTENT SCHEDULING MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "content-scheduling"
  name: "Intelligent Content Scheduling Engine"
  version: "1.0.0"
  category: "content_operations"

  # ═══════════════════════════════════════════════════════════════════════════
  # MULTI-PLATFORM CONTENT CALENDAR
  # ═══════════════════════════════════════════════════════════════════════════

  content_calendar:

    # ─────────────────────────────────────────────────────────────────────────
    # Calendar Management
    # ─────────────────────────────────────────────────────────────────────────

    calendar_features:
      views:
        - "Daily view"
        - "Weekly view"
        - "Monthly view"
        - "Platform-specific view"
        - "Campaign-based view"

      organization:
        content_categories:
          - "Promotional"
          - "Educational"
          - "Entertainment"
          - "User-generated"
          - "Behind-the-scenes"
          - "Thought leadership"
          - "Product announcements"
          - "Company culture"
          - "Industry news"
          - "Community engagement"

        tagging_system:
          - "Campaign tags"
          - "Product tags"
          - "Theme tags"
          - "Audience segment tags"
          - "Content pillar tags"

      content_mix:
        recommended_ratio:
          value_content: "60%"
          promotional_content: "20%"
          engagement_content: "20%"

        platform_specific:
          linkedin:
            professional_insights: "40%"
            company_updates: "25%"
            thought_leadership: "20%"
            engagement_posts: "15%"

          instagram:
            lifestyle_visual: "35%"
            product_showcase: "25%"
            user_generated: "20%"
            stories_reels: "20%"

          twitter:
            quick_updates: "30%"
            industry_commentary: "25%"
            engagement_conversations: "25%"
            promotional: "20%"

          tiktok:
            entertainment: "40%"
            trending_content: "30%"
            educational: "20%"
            product_showcase: "10%"

    # ─────────────────────────────────────────────────────────────────────────
    # Bulk Scheduling
    # ─────────────────────────────────────────────────────────────────────────

    bulk_scheduling:
      features:
        - "CSV/spreadsheet import"
        - "Batch upload media"
        - "Template-based scheduling"
        - "Recurring post templates"
        - "Campaign batch creation"

      import_format:
        required_fields:
          - "Platform"
          - "Date/Time"
          - "Content type"
          - "Copy"
        optional_fields:
          - "Media URLs"
          - "Hashtags"
          - "Location tag"
          - "Tags/mentions"
          - "First comment"
          - "Link"

      validation:
        - "Character count by platform"
        - "Media format/size validation"
        - "Link validation"
        - "Hashtag limit check"
        - "Schedule conflict detection"

    # ─────────────────────────────────────────────────────────────────────────
    # Recurring Content
    # ─────────────────────────────────────────────────────────────────────────

    recurring_posts:
      types:
        - type: "Evergreen rotation"
          description: "Rotate best-performing content"
          frequency: "Weekly/Monthly"
          automation: "Auto-select from library"

        - type: "Weekly series"
          description: "Regular themed posts"
          examples:
            - "Motivation Monday"
            - "Tip Tuesday"
            - "Throwback Thursday"
            - "Feature Friday"

        - type: "Monthly themes"
          description: "Month-long content focus"
          examples:
            - "Product spotlight"
            - "Customer stories"
            - "Team highlights"

      management:
        - "Create template posts"
        - "Set recurrence rules"
        - "Variable placeholders"
        - "Auto-refresh creative"

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIMAL TIMING ENGINE
  # ═══════════════════════════════════════════════════════════════════════════

  optimal_timing:

    # ─────────────────────────────────────────────────────────────────────────
    # AI-Powered Timing
    # ─────────────────────────────────────────────────────────────────────────

    timing_optimization:
      name: "Smart Timing Algorithm"

      data_inputs:
        historical_performance:
          - "Engagement rates by time"
          - "Reach by posting time"
          - "Click-through by time"
          - "Conversion rates by time"

        audience_activity:
          - "Follower online times"
          - "Active hours by platform"
          - "Time zone distribution"
          - "Day of week patterns"

        competitive_gaps:
          - "Competitor posting times"
          - "Low-competition windows"
          - "Share of voice by time"

      optimization_levels:
        platform_level:
          description: "Best times per platform"
          granularity: "30-minute windows"

        audience_level:
          description: "Best times per audience segment"
          requirements: "Audience segmentation enabled"

        content_type_level:
          description: "Best times per content format"
          types: ["Video", "Image", "Link", "Text"]

    # ─────────────────────────────────────────────────────────────────────────
    # Time Zone Management
    # ─────────────────────────────────────────────────────────────────────────

    timezone_handling:
      features:
        - "Multi-timezone scheduling"
        - "Audience timezone detection"
        - "Local time optimization"
        - "Global campaign coordination"

      strategies:
        single_region:
          approach: "Optimize for primary timezone"
          use_case: "Local/regional brands"

        multi_region:
          approach: "Multiple posts for different regions"
          use_case: "Global brands"

        follow_the_sun:
          approach: "Sequential posting across regions"
          use_case: "24/7 engagement"

    # ─────────────────────────────────────────────────────────────────────────
    # Platform-Specific Best Times
    # ─────────────────────────────────────────────────────────────────────────

    default_best_times:
      linkedin:
        b2b:
          best_days: ["Tuesday", "Wednesday", "Thursday"]
          best_hours: ["7-8 AM", "12 PM", "5-6 PM"]
          avoid: ["Weekends", "Friday afternoon"]

      instagram:
        general:
          best_days: ["Tuesday", "Wednesday", "Friday"]
          best_hours: ["11 AM", "1-2 PM", "7 PM"]
          note: "Stories: morning and evening"

      twitter:
        general:
          best_days: ["Weekdays"]
          best_hours: ["8-10 AM", "12 PM", "4-5 PM"]
          frequency: "3-5 tweets per day"

      tiktok:
        general:
          best_days: ["Tuesday", "Thursday", "Friday"]
          best_hours: ["7-9 AM", "12-3 PM", "7-9 PM"]
          note: "Evenings perform best"

      facebook:
        general:
          best_days: ["Wednesday", "Thursday", "Friday"]
          best_hours: ["1-4 PM", "12-1 PM"]
          frequency: "1-2 posts per day"

      youtube:
        general:
          best_days: ["Thursday", "Friday"]
          best_hours: ["2-4 PM", "12 PM"]
          note: "Post 2-3 hours before prime time"

  # ═══════════════════════════════════════════════════════════════════════════
  # MULTI-PLATFORM PUBLISHING
  # ═══════════════════════════════════════════════════════════════════════════

  publishing:

    # ─────────────────────────────────────────────────────────────────────────
    # Cross-Platform Posting
    # ─────────────────────────────────────────────────────────────────────────

    cross_platform:
      features:
        - "Single post to multiple platforms"
        - "Platform-specific customization"
        - "Automatic format adaptation"
        - "Preview by platform"

      customization_options:
        - "Platform-specific copy"
        - "Platform-specific media"
        - "Platform-specific hashtags"
        - "Platform-specific mentions"
        - "Platform-specific CTAs"

      format_adaptation:
        character_limits:
          twitter: 280
          linkedin: 3000
          instagram: 2200
          facebook: 63206
          tiktok: 2200

        image_optimization:
          auto_crop: true
          aspect_ratios:
            instagram_feed: "1:1 or 4:5"
            instagram_story: "9:16"
            linkedin: "1.91:1"
            twitter: "16:9"
            facebook: "1.91:1 or 1:1"

    # ─────────────────────────────────────────────────────────────────────────
    # Platform-Specific Features
    # ─────────────────────────────────────────────────────────────────────────

    platform_features:
      instagram:
        - "First comment scheduling"
        - "Story scheduling"
        - "Reel scheduling"
        - "Carousel creation"
        - "Location tagging"
        - "Product tagging"
        - "Collaborator tagging"

      linkedin:
        - "Company page posting"
        - "Newsletter scheduling"
        - "Document posts (carousels)"
        - "Poll creation"
        - "Article scheduling"
        - "Employee advocacy queue"

      twitter:
        - "Thread scheduling"
        - "Quote tweet scheduling"
        - "Poll creation"
        - "Spaces promotion"

      tiktok:
        - "Video scheduling"
        - "Draft management"
        - "Sound selection"
        - "Cover image selection"

      youtube:
        - "Video scheduling"
        - "Shorts scheduling"
        - "Community posts"
        - "Premiere scheduling"

    # ─────────────────────────────────────────────────────────────────────────
    # Queue Management
    # ─────────────────────────────────────────────────────────────────────────

    queue_management:
      queue_types:
        - type: "Time-based queue"
          description: "Posts scheduled at specific times"
          use_case: "Campaign content"

        - type: "Slot-based queue"
          description: "Posts fill predefined time slots"
          use_case: "Evergreen content"

        - type: "Priority queue"
          description: "Important content scheduled first"
          use_case: "Mixed urgency content"

      queue_actions:
        - "Add to queue"
        - "Reorder queue"
        - "Pause queue"
        - "Bulk reschedule"
        - "Clear queue"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT LIBRARY
  # ═══════════════════════════════════════════════════════════════════════════

  content_library:

    organization:
      structure:
        - "By campaign"
        - "By platform"
        - "By content type"
        - "By status (draft, scheduled, published)"
        - "By performance tier"

      asset_types:
        - "Images"
        - "Videos"
        - "GIFs"
        - "Copy templates"
        - "Hashtag sets"
        - "Link collections"

    features:
      search_filter:
        - "Keyword search"
        - "Date range filter"
        - "Platform filter"
        - "Performance filter"
        - "Tag filter"

      reuse_workflow:
        - "Clone past posts"
        - "Update and reschedule"
        - "Create variations"
        - "Track reuse performance"

  # ═══════════════════════════════════════════════════════════════════════════
  # APPROVAL WORKFLOWS
  # ═══════════════════════════════════════════════════════════════════════════

  approval_workflows:

    workflow_types:
      - type: "Single approval"
        steps: ["Submit", "Approve/Reject", "Schedule"]
        use_case: "Small teams"

      - type: "Multi-level approval"
        steps: ["Submit", "Manager review", "Legal review", "Final approval", "Schedule"]
        use_case: "Regulated industries"

      - type: "Conditional approval"
        logic: "Route based on content type/risk"
        examples:
          - "Promotional content → Marketing lead"
          - "Legal claims → Legal team"
          - "Crisis response → Executive"

    features:
      - "In-line commenting"
      - "Version comparison"
      - "Approval history"
      - "Deadline tracking"
      - "Escalation rules"
      - "Mobile approval"

    sla_management:
      review_deadlines:
        standard: "24 hours"
        urgent: "4 hours"
        crisis: "1 hour"
      escalation: "Auto-escalate if deadline missed"

  # ═══════════════════════════════════════════════════════════════════════════
  # A/B TIME TESTING
  # ═══════════════════════════════════════════════════════════════════════════

  ab_testing:

    time_testing:
      name: "Optimal Time Testing Framework"

      test_design:
        - "Same content at different times"
        - "Rotate posting times"
        - "Track engagement by time slot"

      metrics_tracked:
        - "Engagement rate"
        - "Reach"
        - "Clicks"
        - "Conversions"

      statistical_requirements:
        minimum_posts: 10
        minimum_per_time_slot: 3
        confidence_level: 0.90

      outcomes:
        - "Time slot performance ranking"
        - "Updated optimal time recommendations"
        - "Audience behavior insights"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & INTEGRATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    to_content_strategy_agent:
      - "Publishing calendar"
      - "Content gaps"
      - "Mix analysis"
      - "Timing insights"

    to_analytics:
      - "Posting frequency data"
      - "Time performance data"
      - "Platform distribution"

    to_engagement_module:
      - "Published content alerts"
      - "Expected engagement windows"

  integrations:
    platform_apis:
      - "Instagram Graph API"
      - "Facebook Pages API"
      - "LinkedIn Marketing API"
      - "Twitter API v2"
      - "TikTok Business API"
      - "YouTube Data API"

    content_tools:
      - "Canva"
      - "Adobe Creative Cloud"
      - "Google Drive"
      - "Dropbox"
      - "DAM systems"

    collaboration:
      - "Slack notifications"
      - "Microsoft Teams"
      - "Email alerts"
      - "Mobile push"
