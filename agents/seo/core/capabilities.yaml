# SEO AGENT - COMPLETE CAPABILITIES MATRIX
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════
#
# This comprehensive capabilities matrix defines every feature and function
# of the SEO Agent, organized by domain. Each capability includes detailed
# specifications for implementation and measurement.
#
# Benchmark: Exceeds SEMRUSH, Ahrefs, Moz, DIIB, Screaming Frog, Majestic, SpyFu
# ═══════════════════════════════════════════════════════════════════════════════

capabilities:
  version: "1.0.0"
  last_updated: "2026-01-04"

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 1: TECHNICAL SEO CAPABILITIES
  # ═══════════════════════════════════════════════════════════════════════════

  technical_seo:
    category_id: "TECH"
    description: "Complete technical SEO auditing, monitoring, and optimization"

    # ─────────────────────────────────────────────────────────────────────────
    # 1.1 SITE CRAWLING & ARCHITECTURE
    # ─────────────────────────────────────────────────────────────────────────

    site_crawling:
      id: "TECH-001"
      name: "Intelligent Site Crawler"
      description: "Enterprise-grade web crawler with JavaScript rendering"

      features:
        - feature: "Full Site Crawl"
          capabilities:
            - "Crawl up to 10 million URLs per site"
            - "JavaScript rendering for SPA/PWA sites"
            - "Custom crawl speed (respectful throttling)"
            - "Authentication support (basic, form, cookie)"
            - "Custom header injection"
            - "User-agent customization"
            - "Mobile-first crawling option"
            - "Scheduled recurring crawls"

        - feature: "Crawl Configuration"
          capabilities:
            - "Include/exclude URL patterns"
            - "Respect robots.txt (with override option)"
            - "Follow nofollow links option"
            - "Max depth control"
            - "URL parameter handling"
            - "Canonical URL following"
            - "Hreflang discovery"

        - feature: "Crawl Analysis"
          capabilities:
            - "Crawl budget analysis"
            - "Crawl frequency recommendations"
            - "Orphan page detection"
            - "Crawl depth analysis"
            - "URL discovery paths"
            - "Internal PageRank flow"

      outputs:
        - "Complete URL inventory with metadata"
        - "Site architecture visualization"
        - "Crawl efficiency report"
        - "Issue identification by category"

    site_architecture:
      id: "TECH-002"
      name: "Site Architecture Analyzer"
      description: "Analyze and optimize information architecture"

      features:
        - feature: "Structure Analysis"
          capabilities:
            - "URL structure evaluation"
            - "Folder depth analysis"
            - "Category/taxonomy mapping"
            - "Breadcrumb validation"
            - "Navigation path analysis"
            - "Click depth from homepage"
            - "Silo structure detection"

        - feature: "URL Optimization"
          capabilities:
            - "URL length analysis"
            - "Keyword in URL detection"
            - "URL parameter issues"
            - "Duplicate URL detection"
            - "URL canonicalization status"
            - "Trailing slash consistency"
            - "Case sensitivity issues"
            - "Special character detection"

        - feature: "Navigation Analysis"
          capabilities:
            - "Main navigation structure"
            - "Footer link analysis"
            - "Sidebar link patterns"
            - "Pagination implementation"
            - "Faceted navigation handling"
            - "Infinite scroll detection"

