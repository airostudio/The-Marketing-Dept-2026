      description: "Score content quality across multiple dimensions"

      features:
        - feature: "Quality Dimensions"
          dimensions:
            - dimension: "SEO Quality"
              factors:
                - "Keyword optimization"
                - "Meta tag quality"
                - "Heading structure"
                - "Internal linking"
                - "Content length"
                - "Readability"

            - dimension: "Content Quality"
              factors:
