# ═══════════════════════════════════════════════════════════════════════════════
# SEO AGENT WORKFLOWS
# The Marketing Department 2026 - SEO Agent
# ═══════════════════════════════════════════════════════════════════════════════

workflows:
  version: "1.0.0"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 1: COMPREHENSIVE SITE AUDIT
  # ═══════════════════════════════════════════════════════════════════════════

  comprehensive_audit:
    name: "Full SEO Site Audit"
    description: "Complete technical and on-page SEO audit"
    trigger:
      - "Monthly schedule"
      - "On-demand request"
      - "New domain onboarding"
    duration: "2-4 hours"

    steps:
      - step: 1
        name: "Initialize Audit"
        actions:
          - "Create audit session"
          - "Load previous audit data"
          - "Configure crawl settings"
        outputs:
          - "Audit session ID"
          - "Configuration confirmed"

      - step: 2
        name: "Full Site Crawl"
        actions:
          - "Execute site crawl"
          - "Render JavaScript pages"
          - "Collect all page data"
        outputs:
          - "Complete URL inventory"
          - "Page metadata"
          - "Technical metrics"
        parallel: true

      - step: 3
        name: "Technical Analysis"
        actions:
          - "Run 200+ technical checks"
          - "Analyze crawlability"
          - "Check indexation status"
          - "Assess page speed"
          - "Validate mobile optimization"
          - "Verify security configuration"
          - "Audit structured data"
        outputs:
          - "Technical issues list"
          - "Severity scoring"
          - "Category breakdown"

      - step: 4
        name: "On-Page Analysis"
        actions:
          - "Analyze content quality"
          - "Check meta optimization"
          - "Evaluate heading structure"
          - "Assess internal linking"
          - "Identify thin content"
          - "Detect duplicate content"
        outputs:
          - "On-page issues list"
          - "Content scores"
          - "Optimization opportunities"

      - step: 5
        name: "Backlink Profile Review"
        actions:
          - "Pull backlink data"
          - "Calculate quality metrics"
          - "Detect toxic links"
          - "Analyze anchor text"
        outputs:
          - "Backlink health summary"
          - "Toxic link list"
          - "Anchor text report"

      - step: 6
        name: "Competitor Benchmark"
        actions:
          - "Compare vs top competitors"
          - "Identify gaps"
          - "Calculate relative scores"
        outputs:
          - "Competitive positioning"
          - "Gap analysis"

      - step: 7
        name: "Generate Recommendations"
        actions:
          - "Prioritize all issues"
          - "Calculate impact scores"
          - "Estimate effort"
          - "Create action items"
        outputs:
          - "Prioritized action list"
          - "Quick wins identified"
          - "Strategic recommendations"

      - step: 8
        name: "Compile Report"
        actions:
          - "Generate comprehensive report"
          - "Create executive summary"
          - "Include visualizations"
        outputs:
          - "Full audit report (PDF)"
          - "Executive summary"
          - "Action item export"

      - step: 9
        name: "Distribute & Log"
        actions:
          - "Send report to stakeholders"
          - "Update CMO Agent"
          - "Log audit completion"
          - "Schedule follow-up"
        outputs:
          - "Distribution confirmed"
          - "Follow-up scheduled"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 2: NEW CONTENT OPTIMIZATION
  # ═══════════════════════════════════════════════════════════════════════════

  new_content_optimization:
    name: "New Content SEO Optimization"
    description: "Optimize new content before and after publication"
    trigger:
      - "New content published event"
      - "Content draft submitted for review"

    pre_publication:
      - step: 1
        name: "Receive Content Brief Request"
        trigger: "Content planned for keyword"
        actions:
          - "Generate SEO content brief"
          - "Include keyword targets"
          - "Provide competitive analysis"
          - "Define structure guidelines"
        output_to: "Copywriting Agent"

      - step: 2
        name: "Pre-Publish Review"
        trigger: "Draft content received"
        actions:
          - "Score content for SEO"
          - "Check keyword usage"
          - "Validate meta tags"
          - "Review heading structure"
          - "Check internal link opportunities"
          - "Verify schema requirements"
        outputs:
          - "SEO score"
          - "Improvement suggestions"
          - "Approval status"

    post_publication:
      - step: 3
        name: "Publication Detection"
        trigger: "New page crawled"
        actions:
          - "Verify page is live"
          - "Crawl and index page data"
          - "Validate SEO elements implemented"

      - step: 4
        name: "Indexation Request"
        actions:
          - "Add page to sitemap"
          - "Submit to Google via API"
          - "Request indexing"

      - step: 5
        name: "Tracking Setup"
        actions:
          - "Add target keywords to rank tracking"
          - "Set up alerts"
          - "Configure reporting"

      - step: 6
        name: "Internal Linking"
        actions:
          - "Identify link opportunities from existing content"
          - "Suggest internal links"
          - "Implement auto-approved links"

      - step: 7
        name: "Monitor & Report"
        actions:
          - "Track initial rankings (day 1, 7, 30)"
          - "Monitor traffic"
          - "Report performance"
        timeline: "30 days post-publish"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 3: RANKING DROP INVESTIGATION
  # ═══════════════════════════════════════════════════════════════════════════

  ranking_drop_investigation:
    name: "Ranking Drop Investigation & Recovery"
    description: "Investigate and respond to significant ranking drops"
    trigger:
      - "Alert: Significant ranking drop"
      - "Alert: Traffic anomaly"
    priority: "High"

    steps:
      - step: 1
        name: "Alert Received"
        actions:
          - "Log incident"
          - "Gather initial context"
          - "Notify CMO Agent"
        time_limit: "15 minutes"

      - step: 2
        name: "Scope Assessment"
        actions:
          - "Determine scope (single keyword, page, site-wide)"
          - "Identify affected pages/keywords"
          - "Check timeline of changes"
        outputs:
          - "Scope classification"
          - "Affected elements list"
          - "Timeline"

      - step: 3
        name: "Algorithm Check"
        actions:
          - "Check for Google algorithm updates"
          - "Analyze industry-wide volatility"
          - "Compare to competitor movement"
        outputs:
          - "Algorithm update status"
          - "Industry impact assessment"

      - step: 4
        name: "Technical Investigation"
        parallel: true
        actions:
          - "Check for technical issues"
          - "Verify page accessibility"
          - "Check robots.txt changes"
          - "Verify canonical tags"
          - "Check for manual actions (GSC)"
        outputs:
          - "Technical issues found"
          - "Manual action status"

      - step: 5
        name: "Content Investigation"
        parallel: true
        actions:
          - "Check for content changes"
          - "Analyze on-page optimization"
          - "Check for cannibalization"
          - "Compare to ranking page"
        outputs:
          - "Content changes detected"
          - "Optimization gaps"

      - step: 6
        name: "Backlink Investigation"
        parallel: true
        actions:
          - "Check for lost backlinks"
          - "Detect toxic link spikes"
          - "Compare link velocity"
        outputs:
          - "Backlink changes"
          - "Link issues"

      - step: 7
        name: "Root Cause Analysis"
        actions:
          - "Synthesize findings"
          - "Identify most likely cause"
          - "Assess confidence level"
        outputs:
          - "Root cause determination"
          - "Contributing factors"

      - step: 8
        name: "Recovery Plan"
        actions:
          - "Develop recovery strategy"
          - "Prioritize actions"
          - "Estimate timeline"
        outputs:
          - "Recovery action plan"
          - "Resource requirements"
        output_to: "CMO Agent for approval"

      - step: 9
        name: "Execute Recovery"
        trigger: "Approval received"
        actions:
          - "Implement recovery actions"
          - "Monitor progress"
          - "Adjust as needed"

      - step: 10
        name: "Post-Recovery Review"
        trigger: "Rankings stabilized"
        actions:
          - "Document lessons learned"
          - "Update prevention measures"
          - "Close incident"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 4: COMPETITOR MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  competitor_monitoring:
    name: "Continuous Competitor Monitoring"
    description: "Monitor competitor SEO activities and changes"
    trigger: "Continuous (scheduled)"

    daily_checks:
      - action: "Track competitor rankings"
        frequency: "Daily"
        output: "Ranking changes detected"

      - action: "Monitor new content"
        frequency: "Daily"
        output: "New content alerts"

    weekly_checks:
      - action: "Backlink acquisition tracking"
        frequency: "Weekly"
        output: "New competitor backlinks"

      - action: "Visibility comparison update"
        frequency: "Weekly"
        output: "Market share changes"

    monthly_analysis:
      - action: "Full competitor profile update"
        frequency: "Monthly"
        output: "Updated competitor profiles"

      - action: "Gap analysis refresh"
        frequency: "Monthly"
        output: "Updated gap reports"

    triggered_responses:
      - trigger: "Competitor gains top 3"
        response:
          - "Alert SEO team"
          - "Analyze ranking page"
          - "Identify differentiation opportunities"
          - "Update strategy if needed"

      - trigger: "Competitor publishes targeting our keywords"
        response:
          - "Analyze new content"
          - "Assess threat level"
          - "Recommend counter-strategy"

      - trigger: "Competitor gains high-quality backlink"
        response:
          - "Identify link source"
          - "Assess if replicable"
          - "Add to prospect list if appropriate"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 5: CONTENT REFRESH CYCLE
  # ═══════════════════════════════════════════════════════════════════════════

  content_refresh:
    name: "Content Freshness & Refresh Cycle"
    description: "Identify and refresh aging content"
    trigger:
      - "Weekly scheduled scan"
      - "Performance decay detected"

    steps:
      - step: 1
        name: "Freshness Scan"
        actions:
          - "Calculate freshness scores"
          - "Identify decaying content"
          - "Check competitor freshness"
        outputs:
          - "Refresh candidate list"

      - step: 2
        name: "Prioritization"
        actions:
          - "Score by traffic value"
          - "Assess competitive pressure"
          - "Estimate refresh effort"
          - "Prioritize list"
        outputs:
          - "Prioritized refresh queue"

      - step: 3
        name: "Generate Refresh Briefs"
        actions:
          - "Analyze current content"
          - "Identify what needs updating"
          - "Check current top rankers"
          - "Generate optimization brief"
        outputs:
          - "Refresh briefs"
        output_to: "Content Strategist Agent"

      - step: 4
        name: "Track Refresh Implementation"
        actions:
          - "Monitor content updates"
          - "Validate changes"
          - "Confirm optimization"

      - step: 5
        name: "Post-Refresh Monitoring"
        actions:
          - "Track ranking changes"
          - "Monitor traffic recovery"
          - "Report results"
        timeline: "30-90 days"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 6: LINK BUILDING COORDINATION
  # ═══════════════════════════════════════════════════════════════════════════

  link_building:
    name: "Link Building Coordination"
    description: "Coordinate link building efforts with Partnerships Agent"
    trigger:
      - "Monthly link building cycle"
      - "New linkable content published"

    steps:
      - step: 1
        name: "Opportunity Analysis"
        actions:
          - "Run competitor backlink gap"
          - "Identify link opportunities"
          - "Find unlinked mentions"
          - "Discover broken link opportunities"
        outputs:
          - "Prospect list"
          - "Opportunity scores"

      - step: 2
        name: "Target Prioritization"
        actions:
          - "Score prospects by value"
          - "Assess feasibility"
          - "Create priority list"
        outputs:
          - "Prioritized target list"
        output_to: "Partnerships Agent"

      - step: 3
        name: "Asset Identification"
        actions:
          - "Identify linkable assets"
          - "Recommend new asset creation"
          - "Match assets to prospects"
        outputs:
          - "Asset-prospect matching"
        output_to: "Content Strategist Agent"

      - step: 4
        name: "Monitor Acquisition"
        actions:
          - "Track new links acquired"
          - "Verify link quality"
          - "Log acquisition metrics"

      - step: 5
        name: "Report Results"
        actions:
          - "Compile link building report"
          - "Calculate ROI"
          - "Recommend adjustments"
        outputs:
          - "Link building report"
        output_to: "CMO Agent"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 7: LOCAL SEO MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  local_seo_management:
    name: "Local SEO Management Cycle"
    description: "Ongoing local SEO optimization and monitoring"
    trigger: "Continuous"

    daily:
      - action: "Monitor new reviews"
        response: "Queue for response"

      - action: "Track local rankings"
        response: "Log changes"

    weekly:
      - action: "Respond to pending reviews"
        sla: "48 hours max"

      - action: "Post GBP updates"
        frequency: "1-2 per week"

      - action: "Check citation accuracy"
        response: "Flag discrepancies"

    monthly:
      - action: "Full local audit"
        includes:
          - "GBP optimization check"
          - "Citation audit"
          - "Local ranking report"
          - "Review analysis"
        outputs: "Local SEO report"

      - action: "Competitor local analysis"
        outputs: "Local competitive intel"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 8: REPORTING CYCLE
  # ═══════════════════════════════════════════════════════════════════════════

  reporting_cycle:
    name: "Automated Reporting Cycle"
    description: "Generate and distribute scheduled reports"

    daily:
      - report: "Daily Snapshot"
        time: "07:00 UTC"
        recipients: ["SEO Team"]
        format: "Email digest"

    weekly:
      - report: "Weekly Performance Report"
        time: "Monday 08:00 UTC"
        recipients: ["CMO Agent", "SEO Team"]
        format: "PDF + Dashboard"

    monthly:
      - report: "Monthly Strategic Report"
        time: "1st of month 08:00 UTC"
        recipients: ["CMO Agent", "Head of Growth Agent"]
        format: "PDF + Presentation"

      - report: "Technical Audit Summary"
        time: "15th of month"
        recipients: ["Engineering Team"]
        format: "Technical PDF"

    quarterly:
      - report: "Quarterly Business Review"
        time: "First week of quarter"
        recipients: ["Executive Team"]
        format: "Executive Presentation"
