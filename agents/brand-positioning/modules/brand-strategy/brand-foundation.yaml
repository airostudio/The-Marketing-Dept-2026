# ═══════════════════════════════════════════════════════════════════════════════
# BRAND & POSITIONING AGENT - BRAND STRATEGY MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "brand-strategy"
  name: "Brand Strategy & Foundation Engine"
  version: "1.0.0"
  category: "strategy"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND FOUNDATION
  # ═══════════════════════════════════════════════════════════════════════════

  brand_foundation:

    brand_purpose:
      definition: "Why the brand exists beyond making money"
      framework:
        components:
          - "Core belief"
          - "Impact aspiration"
          - "Stakeholder benefit"
        development_process:
          - "Leadership vision workshop"
          - "Employee input gathering"
          - "Customer research"
          - "Purpose statement drafting"
          - "Validation and refinement"
      outputs:
        - "Purpose statement"
        - "Supporting narrative"

    brand_vision:
      definition: "Aspirational future state"
      framework:
        timeframe: "5-10 years"
        components:
          - "Market position aspiration"
          - "Customer impact vision"
          - "Industry influence"
        characteristics:
          - "Inspiring"
          - "Clear"
          - "Ambitious but achievable"
          - "Memorable"

    brand_mission:
      definition: "What the brand does and for whom"
      framework:
        components:
          - "What we do"
          - "Who we serve"
          - "How we're different"
          - "Value we create"
        format: "Single statement, 25-50 words"

    brand_values:
      definition: "Core beliefs that guide behavior"
      framework:
        count: "3-5 values"
        requirements:
          - "Authentic to culture"
          - "Differentiating"
          - "Actionable"
          - "Consistent"
        development:
          - "Cultural assessment"
          - "Stakeholder input"
          - "Competitive analysis"
          - "Value prioritization"
        activation:
          - "Behavioral guidelines per value"
          - "Decision-making criteria"
          - "Recognition programs"

    brand_promise:
      definition: "Commitment to customers"
      framework:
        components:
          - "Functional benefit"
          - "Emotional benefit"
          - "Proof of delivery"
        requirements:
          - "Deliverable"
          - "Differentiated"
          - "Valuable"
          - "Credible"

    brand_personality:
      definition: "Human characteristics of the brand"
      framework:
        archetypes:
          - "The Sage (wisdom, expertise)"
          - "The Hero (achievement, mastery)"
          - "The Caregiver (nurturing, service)"
          - "The Creator (innovation, vision)"
          - "The Explorer (discovery, freedom)"
          - "The Ruler (control, success)"
          - "The Magician (transformation)"
          - "The Lover (intimacy, pleasure)"
          - "The Jester (fun, enjoyment)"
          - "The Regular (belonging)"
          - "The Innocent (simplicity, trust)"
          - "The Outlaw (disruption, liberation)"
        traits:
          count: "5-7 traits"
          format: "Adjectives with definitions"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND POSITIONING
  # ═══════════════════════════════════════════════════════════════════════════

  positioning:

    positioning_framework:
      components:
        target_audience:
          definition: "Who the brand serves"
          elements:
            - "Demographics"
            - "Psychographics"
            - "Needs and pain points"
            - "Goals and aspirations"

        competitive_frame:
          definition: "Category/alternatives"
          elements:
            - "Direct competitors"
            - "Indirect competitors"
            - "Category definition"

        points_of_difference:
          definition: "Unique value"
          requirements:
            - "Relevant to target"
            - "Deliverable"
            - "Differentiated"
            - "Sustainable"
          types:
            - "Functional PODs"
            - "Emotional PODs"
            - "Experiential PODs"

        points_of_parity:
          definition: "Category table stakes"
          types:
            - "Category POPs"
            - "Competitive POPs"

        reasons_to_believe:
          definition: "Proof of claims"
          types:
            - "Product attributes"
            - "Customer testimonials"
            - "Data/research"
            - "Awards/recognition"
            - "Heritage/experience"

    positioning_statement:
      format: |
        For [target audience]
        who [need/want/problem]
        [brand] is the [category]
        that [key benefit/POD]
        because [reason to believe].

      variations:
        internal: "Full detailed version"
        external: "Customer-facing version"
        competitive: "Comparison-focused version"

    positioning_map:
      dimensions:
        primary: "Most important attribute to target"
        secondary: "Second most important attribute"
      outputs:
        - "Visual positioning map"
        - "Competitive positions"
        - "White space identification"
        - "Strategic implications"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND ARCHITECTURE
  # ═══════════════════════════════════════════════════════════════════════════

  brand_architecture:

    architecture_models:
      branded_house:
        description: "Master brand dominant"
        characteristics:
          - "Single brand identity"
          - "Sub-brands as descriptors"
          - "Unified positioning"
        when_to_use:
          - "Strong master brand"
          - "Related offerings"
          - "Efficiency priority"
        example: "Google (Google Maps, Google Drive)"

      house_of_brands:
        description: "Individual brand identities"
        characteristics:
          - "Distinct brand identities"
          - "Separate positioning"
          - "Parent brand hidden or subtle"
        when_to_use:
          - "Diverse portfolios"
          - "Different target audiences"
          - "Risk isolation needed"
        example: "P&G (Tide, Pampers, Gillette)"

      endorsed_brands:
        description: "Sub-brands with master endorsement"
        characteristics:
          - "Sub-brand leads"
          - "Master brand endorses"
          - "Some equity transfer"
        when_to_use:
          - "Leverage master brand credibility"
          - "Allow sub-brand identity"
          - "Balance unity and flexibility"
        example: "Marriott (Courtyard by Marriott)"

      hybrid:
        description: "Mixed approach"
        characteristics:
          - "Different strategies for different brands"
          - "Flexible application"
          - "Complex management"
        when_to_use:
          - "Diverse portfolio needs"
          - "Acquisition integration"
          - "Market-specific requirements"

    architecture_guidelines:
      naming_conventions:
        master_brand: "Rules for master brand use"
        sub_brands: "Rules for sub-brand naming"
        products: "Product naming guidelines"
        descriptors: "Descriptor usage"

      visual_hierarchy:
        logo_relationships: "How logos relate"
        color_system: "Color allocation"
        typography_system: "Font allocation"

      messaging_hierarchy:
        brand_level_messages: "What's said at brand level"
        sub_brand_messages: "Sub-brand specific messaging"
        product_messages: "Product-level messaging"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    strategy_documents:
      - "Brand Strategy Summary"
      - "Brand Foundation Document"
      - "Positioning Strategy"
      - "Brand Architecture Guidelines"

    to_other_modules:
      - "Foundation inputs for messaging"
      - "Positioning for competitive analysis"
      - "Architecture for guidelines"
