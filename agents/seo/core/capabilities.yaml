            - "First Input Delay (FID)"
            - "Interaction to Next Paint (INP)"
            - "Cumulative Layout Shift (CLS)"
            - "First Contentful Paint (FCP)"
            - "Time to First Byte (TTFB)"
            - "Field data (CrUX) integration"
            - "Lab data (Lighthouse) testing"
            - "Page-by-page analysis"
            - "Template-level aggregation"

        - feature: "Speed Analysis"
          capabilities:
            - "Full page load time"
            - "DOM content loaded"
            - "Time to interactive"
            - "Total blocking time"
            - "Speed index"
            - "Resource waterfall analysis"
            - "Third-party script impact"
            - "Critical rendering path"

        - feature: "Optimization Opportunities"
          capabilities:
