# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL MEDIA AGENT - INFLUENCER MANAGEMENT MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "influencer-management"
  name: "Influencer Partnership Management Engine"
  version: "1.0.0"
  category: "influencer_operations"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFLUENCER DISCOVERY
  # ═══════════════════════════════════════════════════════════════════════════

  influencer_discovery:

    # ─────────────────────────────────────────────────────────────────────────
    # Search & Discovery
    # ─────────────────────────────────────────────────────────────────────────

    discovery_methods:
      keyword_search:
        - "Industry keywords"
        - "Product-related terms"
        - "Niche hashtags"
        - "Competitor mentions"

      audience_based:
        - "Lookalike to existing customers"
        - "Similar to successful partners"
        - "Target demographic match"

      performance_based:
        - "High engagement creators"
        - "Fast-growing accounts"
        - "Viral content creators"

      relationship_based:
        - "Brand mentions"
        - "Existing followers"
        - "Customer advocates"
        - "Industry connections"

    # ─────────────────────────────────────────────────────────────────────────
    # Filtering & Segmentation
    # ─────────────────────────────────────────────────────────────────────────

    filtering_criteria:
      quantitative:
        follower_count:
          nano: "1K-10K"
          micro: "10K-50K"
          mid_tier: "50K-500K"
          macro: "500K-1M"
          mega: "1M+"

        engagement_rate:
          minimum_threshold: "2%"
          excellent: ">5%"
          good: "3-5%"
          average: "1-3%"
          poor: "<1%"

        growth_rate:
          preference: "Positive growth"
          minimum: "Stable (>-5%)"

      qualitative:
        - "Content quality"
        - "Brand alignment"
        - "Authenticity"
        - "Professionalism"
        - "Values alignment"
        - "Previous brand work"

      audience_quality:
        - "Demographic match"
        - "Geographic relevance"
        - "Interest alignment"
        - "Authenticity score"
        - "Bot percentage"

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer Scoring
    # ─────────────────────────────────────────────────────────────────────────

    scoring_model:
      name: "Influencer Fit Score (IFS)"
      scale: "0-100"

      components:
        reach_potential:
          weight: 0.20
          factors:
            - "Follower count"
            - "Average reach"
            - "Impression potential"

        engagement_quality:
          weight: 0.25
          factors:
            - "Engagement rate"
            - "Comment quality"
            - "Audience interaction"

        audience_fit:
          weight: 0.25
          factors:
            - "Demographic match"
            - "Interest alignment"
            - "Geographic fit"

        brand_alignment:
          weight: 0.20
          factors:
            - "Content style match"
            - "Values alignment"
            - "Aesthetic fit"

        authenticity:
          weight: 0.10
          factors:
            - "Follower authenticity"
            - "Engagement authenticity"
            - "Content originality"

      tiers:
        - tier: "Perfect Fit"
          score: "90-100"
          action: "Priority outreach"

        - tier: "Strong Fit"
          score: "75-89"
          action: "Active consideration"

        - tier: "Moderate Fit"
          score: "60-74"
          action: "Pool for specific campaigns"

        - tier: "Low Fit"
          score: "<60"
          action: "Not recommended"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFLUENCER VETTING
  # ═══════════════════════════════════════════════════════════════════════════

  vetting:

    # ─────────────────────────────────────────────────────────────────────────
    # Authenticity Analysis
    # ─────────────────────────────────────────────────────────────────────────

    authenticity_checks:
      follower_analysis:
        - "Fake follower detection"
        - "Bot percentage"
        - "Follower growth patterns"
        - "Suspicious spikes"

      engagement_analysis:
        - "Engagement authenticity"
        - "Comment quality"
        - "Engagement timing patterns"
        - "Like-to-comment ratio"

      content_analysis:
        - "Original vs curated content"
        - "Consistency of voice"
        - "Quality consistency"

    # ─────────────────────────────────────────────────────────────────────────
    # Brand Safety
    # ─────────────────────────────────────────────────────────────────────────

    brand_safety:
      content_review:
        - "Historical content audit"
        - "Controversial topics"
        - "Competitor relationships"
        - "Political content"
        - "Sensitive topics"

      reputation_check:
        - "Press/media mentions"
        - "Online reputation"
        - "Past controversies"
        - "Legal issues"

      risk_categories:
        low_risk: "Clean history, aligned values"
        medium_risk: "Minor concerns, manageable"
        high_risk: "Significant concerns, caution"
        avoid: "Major red flags"

    # ─────────────────────────────────────────────────────────────────────────
    # Audience Analysis
    # ─────────────────────────────────────────────────────────────────────────

    audience_analysis:
      demographics:
        - "Age distribution"
        - "Gender split"
        - "Location breakdown"
        - "Language"

      psychographics:
        - "Interests"
        - "Behaviors"
        - "Affinities"

      quality_indicators:
        - "Audience authenticity %"
        - "Notable followers"
        - "Reachable audience %"
        - "Credibility score"

  # ═══════════════════════════════════════════════════════════════════════════
  # RELATIONSHIP MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  relationship_management:

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer CRM
    # ─────────────────────────────────────────────────────────────────────────

    crm_features:
      profile_management:
        - "Contact information"
        - "Social profiles"
        - "Media kit"
        - "Rate card"
        - "Content examples"
        - "Notes and history"

      relationship_tracking:
        - "Relationship status"
        - "Communication history"
        - "Past collaborations"
        - "Performance history"
        - "Payment history"

      pipeline_management:
        stages:
          - "Discovered"
          - "Contacted"
          - "In discussion"
          - "Negotiating"
          - "Contracted"
          - "Active"
          - "Completed"
          - "Nurturing"

    # ─────────────────────────────────────────────────────────────────────────
    # Outreach & Communication
    # ─────────────────────────────────────────────────────────────────────────

    outreach:
      templates:
        - "Initial outreach"
        - "Follow-up"
        - "Campaign brief"
        - "Negotiation"
        - "Contract"
        - "Thank you/wrap-up"

      personalization:
        - "Reference specific content"
        - "Explain brand alignment"
        - "Personalized value proposition"
        - "Custom collaboration ideas"

      communication_tracking:
        - "Message history"
        - "Response tracking"
        - "Follow-up reminders"
        - "Status updates"

    # ─────────────────────────────────────────────────────────────────────────
    # Long-term Partnerships
    # ─────────────────────────────────────────────────────────────────────────

    partnership_programs:
      ambassador_program:
        structure:
          - "Long-term commitment (6-12 months)"
          - "Exclusivity terms"
          - "Regular content requirements"
          - "Brand representation"

        benefits:
          - "Consistent compensation"
          - "Exclusive products/access"
          - "Deeper brand relationship"
          - "Co-creation opportunities"

      affiliate_program:
        structure:
          - "Commission-based compensation"
          - "Unique tracking links"
          - "Performance incentives"

        management:
          - "Commission tracking"
          - "Payment processing"
          - "Performance reporting"

  # ═══════════════════════════════════════════════════════════════════════════
  # CAMPAIGN MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  campaign_management:

    # ─────────────────────────────────────────────────────────────────────────
    # Campaign Planning
    # ─────────────────────────────────────────────────────────────────────────

    campaign_planning:
      campaign_types:
        - type: "Product Launch"
          influencer_strategy: "Coordinated reveals, reviews"
          typical_mix: "Macro + micro influencers"

        - type: "Brand Awareness"
          influencer_strategy: "Reach-focused content"
          typical_mix: "Mid-tier to macro"

        - type: "Conversion/Sales"
          influencer_strategy: "Promo codes, affiliate links"
          typical_mix: "Micro to mid-tier"

        - type: "Content Generation"
          influencer_strategy: "UGC creation"
          typical_mix: "Nano to micro"

        - type: "Event Promotion"
          influencer_strategy: "Live coverage, attendance"
          typical_mix: "Based on event scale"

      brief_creation:
        components:
          - "Campaign objectives"
          - "Key messages"
          - "Content requirements"
          - "Brand guidelines"
          - "Do's and don'ts"
          - "Deliverables"
          - "Timeline"
          - "Hashtags/mentions"
          - "Disclosure requirements"

    # ─────────────────────────────────────────────────────────────────────────
    # Content Approval
    # ─────────────────────────────────────────────────────────────────────────

    content_approval:
      workflow:
        - "Content submission"
        - "Initial review"
        - "Feedback/revisions"
        - "Final approval"
        - "Scheduling/publishing"

      review_criteria:
        - "Brand guideline compliance"
        - "Message accuracy"
        - "Disclosure compliance"
        - "Quality standards"
        - "Legal compliance"

      approval_levels:
        - level: "Auto-approve"
          criteria: "Trusted partner, minor content"

        - level: "Standard review"
          criteria: "Most campaign content"
          reviewer: "Marketing team"

        - level: "Extended review"
          criteria: "Claims, sensitive content"
          reviewer: "Marketing + Legal"

    # ─────────────────────────────────────────────────────────────────────────
    # Campaign Execution
    # ─────────────────────────────────────────────────────────────────────────

    execution:
      content_tracking:
        - "Submission status"
        - "Approval status"
        - "Publishing status"
        - "Performance tracking"

      deliverable_management:
        - "Deliverable checklist"
        - "Deadline tracking"
        - "Revision tracking"
        - "Final asset collection"

      timeline_management:
        - "Key milestone tracking"
        - "Deadline alerts"
        - "Progress dashboards"
        - "Delay management"

  # ═══════════════════════════════════════════════════════════════════════════
  # PERFORMANCE TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  performance_tracking:

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer Metrics
    # ─────────────────────────────────────────────────────────────────────────

    metrics_tracked:
      content_metrics:
        - "Impressions"
        - "Reach"
        - "Engagement rate"
        - "Video views"
        - "Comments"
        - "Saves/bookmarks"
        - "Shares"

      conversion_metrics:
        - "Link clicks"
        - "Promo code usage"
        - "Conversions"
        - "Revenue"
        - "New followers gained"

      roi_metrics:
        - "Cost per impression (CPM)"
        - "Cost per engagement (CPE)"
        - "Cost per click (CPC)"
        - "Cost per acquisition (CPA)"
        - "Return on investment (ROI)"

    # ─────────────────────────────────────────────────────────────────────────
    # Campaign ROI Analysis
    # ─────────────────────────────────────────────────────────────────────────

    roi_analysis:
      calculation:
        earned_media_value:
          definition: "Value of organic reach generated"
          calculation: "Impressions * CPM benchmark"

        direct_roi:
          definition: "Revenue from tracked conversions"
          calculation: "Revenue / Investment"

        total_roi:
          definition: "Combined value generated"
          calculation: "(EMV + Revenue) / Investment"

      benchmarking:
        - "Campaign vs benchmarks"
        - "Influencer vs average"
        - "Platform comparison"
        - "Historical comparison"

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer Performance Rating
    # ─────────────────────────────────────────────────────────────────────────

    performance_rating:
      rating_system:
        factors:
          - "Deliverable quality"
          - "Deadline adherence"
          - "Communication"
          - "Performance vs expected"
          - "Professionalism"

        scale: "1-5 stars"

        ratings:
          5_star: "Exceptional - priority for future"
          4_star: "Great - recommend"
          3_star: "Good - consider again"
          2_star: "Below expectations"
          1_star: "Poor - do not repeat"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPENSATION & CONTRACTS
  # ═══════════════════════════════════════════════════════════════════════════

  compensation:

    # ─────────────────────────────────────────────────────────────────────────
    # Pricing Models
    # ─────────────────────────────────────────────────────────────────────────

    pricing_models:
      flat_fee:
        description: "Fixed payment per deliverable"
        use_cases: ["One-off campaigns", "Product seeding"]
        negotiation_factors: ["Follower count", "Engagement rate", "Deliverables"]

      performance_based:
        description: "Payment tied to results"
        metrics: ["Clicks", "Conversions", "Sales"]
        structure: "Base + bonus or pure commission"

      product_exchange:
        description: "Free products/services"
        use_cases: ["Nano influencers", "Seeding programs"]
        value_consideration: "Product value + exclusivity"

      hybrid:
        description: "Combination of models"
        example: "Base fee + performance bonus"

    rate_estimation:
      factors:
        - "Follower count"
        - "Engagement rate"
        - "Platform"
        - "Content type"
        - "Usage rights"
        - "Exclusivity"

      benchmarks:
        instagram_post:
          nano: "$50-250"
          micro: "$250-1,000"
          mid_tier: "$1,000-5,000"
          macro: "$5,000-25,000"
          mega: "$25,000+"

        tiktok_video:
          nano: "$25-125"
          micro: "$125-500"
          mid_tier: "$500-2,500"
          macro: "$2,500-10,000"
          mega: "$10,000+"

    # ─────────────────────────────────────────────────────────────────────────
    # Contract Management
    # ─────────────────────────────────────────────────────────────────────────

    contracts:
      contract_elements:
        - "Scope of work"
        - "Deliverables"
        - "Timeline"
        - "Compensation"
        - "Payment terms"
        - "Usage rights"
        - "Exclusivity"
        - "Disclosure requirements"
        - "Approval process"
        - "Cancellation terms"
        - "Confidentiality"

      contract_management:
        - "Template library"
        - "Contract generation"
        - "E-signature"
        - "Expiration tracking"
        - "Renewal reminders"

    # ─────────────────────────────────────────────────────────────────────────
    # Payment Management
    # ─────────────────────────────────────────────────────────────────────────

    payments:
      payment_tracking:
        - "Invoice management"
        - "Payment status"
        - "Payment history"
        - "Budget tracking"

      payment_methods:
        - "Bank transfer"
        - "PayPal"
        - "Platform payments"
        - "Agency payments"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPLIANCE & LEGAL
  # ═══════════════════════════════════════════════════════════════════════════

  compliance:

    disclosure_requirements:
      regulations:
        - "FTC Guidelines (US)"
        - "ASA Guidelines (UK)"
        - "Platform-specific rules"
        - "Regional requirements"

      required_disclosures:
        - "#ad or #sponsored"
        - "Paid partnership tag"
        - "Clear and conspicuous"

      monitoring:
        - "Disclosure verification"
        - "Compliance alerts"
        - "Correction requests"

    content_rights:
      usage_rights:
        - "Social media use"
        - "Paid advertising use"
        - "Website use"
        - "Print use"
        - "Duration limits"
        - "Geographic limits"

      rights_tracking:
        - "Rights documentation"
        - "Expiration tracking"
        - "Usage monitoring"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & INTEGRATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    to_content_strategy:
      - "Influencer content"
      - "UGC library"
      - "Content insights"

    to_analytics_agent:
      - "Campaign performance"
      - "Attribution data"
      - "ROI data"

    to_brand_agent:
      - "Partnership reports"
      - "Brand safety monitoring"
      - "Representation quality"

    to_cmo_agent:
      - "Program overview"
      - "Budget utilization"
      - "ROI summary"

  integrations:
    influencer_platforms:
      - "AspireIQ"
      - "CreatorIQ"
      - "Upfluence"
      - "Traackr"
      - "GRIN"

    social_platforms:
      - "Instagram Creator Studio"
      - "TikTok Creator Marketplace"
      - "YouTube BrandConnect"

    payment_systems:
      - "PayPal"
      - "Stripe"
      - "Platform payment systems"
