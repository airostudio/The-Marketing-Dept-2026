# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT - BATTLECARD SYSTEM MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "battlecard-system"
  name: "Competitive Battlecard Engine"
  version: "1.0.0"
  category: "sales-enablement"

  # ═══════════════════════════════════════════════════════════════════════════
  # BATTLECARD STRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  battlecard_structure:

    standard_battlecard:
      sections:
        competitor_overview:
          title: "At a Glance"
          content:
            - "Company summary (2-3 sentences)"
            - "Key facts (founded, HQ, size, funding)"
            - "Target market"
            - "Core positioning"
          format: "Brief, scannable"

        quick_comparison:
          title: "Quick Comparison"
          content:
            - "Side-by-side overview"
            - "Key differentiators"
            - "Pricing summary"
            - "Target customer"
          format: "Comparison table"

        strengths_weaknesses:
          title: "Know Your Competitor"
          content:
            strengths:
              - "Where they're strong"
              - "What customers like"
              - "Competitive advantages"
            weaknesses:
              - "Where they struggle"
              - "Customer complaints"
              - "Product gaps"
          format: "Bulleted lists"

        win_themes:
          title: "How We Win"
          content:
            - "Primary win theme"
            - "Supporting win themes"
            - "Proof points for each"
            - "Customer evidence"
          format: "Numbered themes with bullets"

        landmines:
          title: "Landmine Questions"
          content:
            - "Questions to ask prospect"
            - "Topics to raise"
            - "Comparisons to draw"
            - "Expected responses"
          format: "Q&A format"

        objection_handling:
          title: "Handle Their Pitch"
          content:
            - objection: "What they'll say"
              response: "How to respond"
              proof: "Evidence to cite"
          format: "Objection-response pairs"

        feature_comparison:
          title: "Feature Comparison"
          content:
            - "Key feature categories"
            - "Head-to-head comparison"
            - "Our advantages highlighted"
          format: "Comparison matrix"

        pricing_comparison:
          title: "Pricing Intelligence"
          content:
            - "Their pricing model"
            - "Price points by tier"
            - "Common discounting"
            - "How we compare"
          format: "Price table with notes"

        resources:
          title: "Additional Resources"
          content:
            - "Detailed comparison docs"
            - "Case studies against them"
            - "Demo scripts"
            - "Customer references"
          format: "Link list"

    battlecard_types:
      sales_battlecard:
        focus: "Deal support"
        audience: "Sales reps"
        length: "2-3 pages"
        emphasis:
          - "Win themes"
          - "Objection handling"
          - "Landmines"
          - "Quick reference"

      technical_battlecard:
        focus: "Technical comparison"
        audience: "Sales engineers, technical buyers"
        length: "4-6 pages"
        emphasis:
          - "Feature deep-dive"
          - "Architecture comparison"
          - "Integration comparison"
          - "Technical proof points"

      executive_battlecard:
        focus: "Strategic comparison"
        audience: "Enterprise sales, executives"
        length: "1-2 pages"
        emphasis:
          - "Business value"
          - "Strategic positioning"
          - "Risk comparison"
          - "Customer proof"

      quick_reference_card:
        focus: "At-a-glance"
        audience: "All sales"
        length: "1 page"
        emphasis:
          - "Key differentiators"
          - "Top 3 win themes"
          - "Top objection responses"
          - "Key proof points"

  # ═══════════════════════════════════════════════════════════════════════════
  # WIN THEMES
  # ═══════════════════════════════════════════════════════════════════════════

  win_themes:

    theme_development:
      framework:
        theme_name: "Clear, memorable theme name"
        theme_statement: "1-2 sentence positioning"
        supporting_points: "3-5 specific proof points"
        evidence: "Quantifiable proof or customer quotes"
        when_to_use: "Situation where theme applies"

      theme_categories:
        product:
          - "Feature superiority"
          - "Technology advantage"
          - "Innovation leadership"
          - "Integration breadth"

        customer:
          - "Customer satisfaction"
          - "Success stories"
          - "Industry leadership"
          - "Support quality"

        company:
          - "Financial stability"
          - "Vision/roadmap"
          - "Leadership team"
          - "Partnership ecosystem"

        value:
          - "Total cost of ownership"
          - "Time to value"
          - "ROI evidence"
          - "Risk reduction"

    theme_prioritization:
      by_segment:
        enterprise:
          priority_themes:
            - "Enterprise-grade security"
            - "Scalability proof"
            - "Customer success"
            - "Strategic partnership"

        mid_market:
          priority_themes:
            - "Ease of deployment"
            - "ROI speed"
            - "Support quality"
            - "Feature value"

        smb:
          priority_themes:
            - "Price/value"
            - "Simplicity"
            - "Quick start"
            - "Self-service"

      by_buyer_persona:
        technical_buyer:
          - "Technical capabilities"
          - "Integration options"
          - "Security/compliance"
          - "Architecture"

        business_buyer:
          - "Business outcomes"
          - "ROI evidence"
          - "Customer references"
          - "Strategic value"

        executive_buyer:
          - "Strategic alignment"
          - "Company stability"
          - "Vision fit"
          - "Risk mitigation"

  # ═══════════════════════════════════════════════════════════════════════════
  # OBJECTION HANDLING
  # ═══════════════════════════════════════════════════════════════════════════

  objection_handling:

    objection_library:
      structure:
        objection:
          statement: "What the prospect/competitor says"
          context: "When this comes up"
          severity: "Critical/Common/Occasional"

        response:
          acknowledge: "Validate the concern"
          reframe: "Shift the perspective"
          respond: "Direct response with proof"
          evidence: "Specific proof point"
          redirect: "Pivot to our strength"

    common_objection_categories:
      price_objections:
        - objection: "Competitor X is cheaper"
          response:
            acknowledge: "Price is important, and it's fair to compare"
            reframe: "But total cost of ownership matters more than initial price"
            respond: "When you factor in [implementation, training, support, add-ons], we often come out ahead"
            evidence: "Customer Y found TCO was 20% lower with us over 3 years"
            redirect: "Let's look at total value delivered"

        - objection: "We don't have budget for this"
          response:
            acknowledge: "Budget constraints are real"
            reframe: "But the cost of not solving this problem is also real"
            respond: "Our customers typically see ROI in X months"
            evidence: "Customer Z saw Y% improvement in efficiency"
            redirect: "Let's model the ROI for your situation"

      feature_objections:
        - objection: "Competitor has feature X that you don't"
          response:
            acknowledge: "That's a fair observation"
            reframe: "But feature presence isn't the same as feature value"
            respond: "Here's how our approach delivers the same outcome differently/better"
            evidence: "Our customers have found..."
            redirect: "What business problem are you trying to solve?"

        - objection: "You don't integrate with system Y"
          response:
            acknowledge: "Integration is important"
            reframe: "We prioritize integrations based on customer need"
            respond: "Here are our options: [workaround, roadmap, API]"
            evidence: "Customer X solved this by..."
            redirect: "What's the integration priority for you?"

      company_objections:
        - objection: "Competitor is larger/more established"
          response:
            acknowledge: "Company size is a consideration"
            reframe: "But what matters is focus and commitment to your success"
            respond: "Our [growth, stability, focus] means [benefit]"
            evidence: "We have X customers, Y years in business, Z funding"
            redirect: "What specific concerns does company size address?"

    objection_by_competitor:
      format:
        competitor_name: "Competitor X"
        common_objections:
          - objection: "Specific objection they raise"
            frequency: "How often"
            best_response: "Recommended response"
            proof_point: "Evidence to cite"

  # ═══════════════════════════════════════════════════════════════════════════
  # LANDMINE QUESTIONS
  # ═══════════════════════════════════════════════════════════════════════════

  landmine_questions:

    question_strategy:
      purpose: "Expose competitor weaknesses through prospect questions"
      principles:
        - "Frame questions around customer needs"
        - "Make questions natural, not adversarial"
        - "Have proof ready if they ask why"
        - "Know likely competitor responses"

    question_categories:
      product_landmines:
        - question: "How do they handle [specific use case]?"
          targets: "Known product gap"
          expected_outcome: "Exposes limitation"
          follow_up: "Here's how we handle that..."

        - question: "Can you show me [specific feature] in action?"
          targets: "Feature they lack or do poorly"
          expected_outcome: "Highlights gap"
          follow_up: "Let me show you our approach..."

      support_landmines:
        - question: "What's their typical response time for issues?"
          targets: "Known support weakness"
          expected_outcome: "Reveals support gaps"
          follow_up: "Our SLAs are..."

        - question: "Who would be your dedicated resource?"
          targets: "Support model weakness"
          expected_outcome: "Exposes support structure"
          follow_up: "With us, you'd have..."

      pricing_landmines:
        - question: "What's included vs. add-on pricing?"
          targets: "Pricing complexity/hidden costs"
          expected_outcome: "Reveals hidden costs"
          follow_up: "Our pricing includes..."

        - question: "How are overages handled?"
          targets: "Usage-based pricing complexity"
          expected_outcome: "Shows potential cost surprises"
          follow_up: "We handle this by..."

      technology_landmines:
        - question: "How often do they update the platform?"
          targets: "Slow development cycles"
          expected_outcome: "Reveals pace of innovation"
          follow_up: "We release..."

        - question: "What's their approach to [emerging technology]?"
          targets: "Technology gaps"
          expected_outcome: "Shows innovation lag"
          follow_up: "Our roadmap includes..."

    landmine_by_competitor:
      format:
        competitor_name: "Competitor X"
        top_landmines:
          - question: "Question to ask"
            why_it_works: "Known weakness"
            our_advantage: "How we're better"

  # ═══════════════════════════════════════════════════════════════════════════
  # WIN/LOSS ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  win_loss_analysis:

    data_collection:
      win_interviews:
        timing: "Within 2 weeks of close"
        participants: "Key decision makers"
        questions:
          - "What were your key criteria?"
          - "Who else did you evaluate?"
          - "What made us stand out?"
          - "Any concerns you had about us?"
          - "What could we have done better?"

      loss_interviews:
        timing: "Within 4 weeks of loss"
        participants: "Key decision makers (when possible)"
        questions:
          - "What were your key criteria?"
          - "Why did you choose [competitor]?"
          - "What could we have done differently?"
          - "Any concerns about the winner?"
          - "Would you consider us again?"

    analysis_framework:
      quantitative:
        - "Win rate by competitor"
        - "Win rate by segment"
        - "Win rate by deal size"
        - "Win rate trends"

      qualitative:
        - "Common win themes"
        - "Common loss reasons"
        - "Competitive perception"
        - "Positioning effectiveness"

    insights_application:
      battlecard_updates:
        - "Validate existing win themes"
        - "Identify new win themes"
        - "Update objection handling"
        - "Refine landmine questions"

      product_feedback:
        - "Feature gap impact on wins/losses"
        - "Pricing competitiveness"
        - "Support/service feedback"

      sales_enablement:
        - "Training needs"
        - "Process improvements"
        - "Competitive preparation"

  # ═══════════════════════════════════════════════════════════════════════════
  # BATTLECARD MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  battlecard_management:

    creation_process:
      steps:
        - step: 1
          name: "Research & Analysis"
          actions:
            - "Gather competitor intelligence"
            - "Review win/loss data"
            - "Interview sales team"
            - "Analyze product comparison"

        - step: 2
          name: "Content Development"
          actions:
            - "Draft key sections"
            - "Develop win themes"
            - "Create objection responses"
            - "Identify landmines"

        - step: 3
          name: "Review & Validation"
          actions:
            - "Sales team review"
            - "Product marketing review"
            - "Accuracy verification"
            - "Incorporate feedback"

        - step: 4
          name: "Publication"
          actions:
            - "Format and design"
            - "Publish to enablement platform"
            - "Announce availability"
            - "Track adoption"

    update_process:
      triggers:
        immediate:
          - "Major product launch"
          - "Pricing change"
          - "Significant news"

        scheduled:
          - "Monthly content refresh"
          - "Quarterly full review"

      update_workflow:
        - "Identify changes needed"
        - "Update content"
        - "Review changes"
        - "Publish update"
        - "Notify sales team"
        - "Archive previous version"

    quality_assurance:
      review_checklist:
        accuracy:
          - "Information is current"
          - "Claims are verified"
          - "Comparisons are fair"

        usability:
          - "Easy to scan"
          - "Key info prominent"
          - "Actionable content"

        completeness:
          - "All sections populated"
          - "Proof points included"
          - "Links working"

      feedback_loop:
        - "Sales team ratings"
        - "Usage analytics"
        - "Win/loss correlation"
        - "Improvement suggestions"

  # ═══════════════════════════════════════════════════════════════════════════
  # DISTRIBUTION & ADOPTION
  # ═══════════════════════════════════════════════════════════════════════════

  distribution:

    access_management:
      platforms:
        - "Sales enablement platform"
        - "CRM integration"
        - "Mobile access"
        - "Offline capability"

      permissions:
        full_access:
          - "Sales team"
          - "Sales leadership"
          - "Product marketing"

        view_only:
          - "Marketing team"
          - "Customer success"
          - "Product team"

    adoption_tracking:
      metrics:
        - "Battlecard views"
        - "Download rates"
        - "Time on page"
        - "Search frequency"
        - "Deal association"

      improvement_actions:
        low_adoption:
          - "Training/awareness"
          - "Integration improvements"
          - "Content feedback"

        high_adoption:
          - "Validate effectiveness"
          - "Best practice sharing"
          - "Content expansion"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_sales_team:
      - "Complete battlecards"
      - "Quick reference cards"
      - "Win/loss insights"
      - "Objection handling guides"

    to_sales_enablement:
      - "Training content"
      - "Certification materials"
      - "Deal coaching resources"

    to_cmo_agent:
      - "Competitive win rate analysis"
      - "Positioning effectiveness"
      - "Battlecard performance metrics"

    to_product_marketing:
      - "Competitive feature analysis"
      - "Positioning recommendations"
      - "Message testing feedback"
