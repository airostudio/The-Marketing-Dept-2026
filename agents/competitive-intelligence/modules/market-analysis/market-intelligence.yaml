# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT - MARKET ANALYSIS MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "market-analysis"
  name: "Market Intelligence Engine"
  version: "1.0.0"
  category: "intelligence"

  # ═══════════════════════════════════════════════════════════════════════════
  # MARKET SIZING
  # ═══════════════════════════════════════════════════════════════════════════

  market_sizing:

    tam_analysis:
      definition: "Total Addressable Market"
      methodology:
        top_down:
          - "Industry report data"
          - "Market research estimates"
          - "Analyst projections"

        bottom_up:
          - "Customer count by segment"
          - "Average contract value"
          - "Penetration assumptions"

      components:
        - "Total potential customers"
        - "Average deal size by segment"
        - "Geographic breakdown"
        - "Growth rate projections"

    sam_analysis:
      definition: "Serviceable Addressable Market"
      factors:
        - "Geographic limitations"
        - "Segment fit"
        - "Use case applicability"
        - "Technical requirements"
      calculation: "TAM × Serviceable percentage"

    som_analysis:
      definition: "Serviceable Obtainable Market"
      factors:
        - "Competitive intensity"
        - "Go-to-market capacity"
        - "Brand awareness"
        - "Sales effectiveness"
      calculation: "SAM × Realistic capture rate"

    market_segmentation:
      by_company_size:
        enterprise:
          definition: ">1000 employees"
          characteristics: "Complex needs, longer sales cycles"
          market_size: "$X billion"

        mid_market:
          definition: "100-999 employees"
          characteristics: "Growing sophistication"
          market_size: "$X billion"

        smb:
          definition: "<100 employees"
          characteristics: "Price-sensitive, quick decisions"
          market_size: "$X billion"

      by_industry:
        - segment: "Technology"
          market_size: "$X"
          growth_rate: "X%"
          penetration: "X%"

        - segment: "Financial Services"
          market_size: "$X"
          growth_rate: "X%"
          penetration: "X%"

        # Additional segments...

      by_geography:
        - region: "North America"
          market_size: "$X"
          growth_rate: "X%"

        - region: "Europe"
          market_size: "$X"
          growth_rate: "X%"

        # Additional regions...

  # ═══════════════════════════════════════════════════════════════════════════
  # MARKET DYNAMICS
  # ═══════════════════════════════════════════════════════════════════════════

  market_dynamics:

    growth_drivers:
      technology_drivers:
        - driver: "Digital transformation"
          impact: "High"
          timeline: "Ongoing"
          implications: "Increased demand for solutions"

        - driver: "AI/ML adoption"
          impact: "High"
          timeline: "Accelerating"
          implications: "New feature expectations"

      business_drivers:
        - driver: "Remote work normalization"
          impact: "Medium-High"
          timeline: "Established"
          implications: "Collaboration tool integration"

        - driver: "Data-driven decision making"
          impact: "High"
          timeline: "Growing"
          implications: "Analytics requirements"

      regulatory_drivers:
        - driver: "Privacy regulations"
          impact: "Medium"
          timeline: "Ongoing"
          implications: "Compliance features required"

    market_barriers:
      entry_barriers:
        - "Technology development costs"
        - "Customer acquisition costs"
        - "Brand establishment"
        - "Ecosystem integration requirements"

      growth_barriers:
        - "Market education needs"
        - "Budget constraints"
        - "Change management resistance"
        - "Integration complexity"

    market_maturity:
      assessment:
        stage: "Growth/Mature/Emerging"
        characteristics:
          - "Buyer sophistication level"
          - "Competitive intensity"
          - "Product differentiation"
          - "Pricing stability"

      lifecycle_position:
        introduction:
          indicators: ["Limited awareness", "Few competitors", "High prices"]

        growth:
          indicators: ["Rapid adoption", "New entrants", "Feature expansion"]

        maturity:
          indicators: ["Slowing growth", "Consolidation", "Price competition"]

        decline:
          indicators: ["Declining demand", "Market exit", "Commoditization"]

  # ═══════════════════════════════════════════════════════════════════════════
  # TREND ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  trend_analysis:

    technology_trends:
      monitoring:
        - category: "AI and Machine Learning"
          current_state: "Accelerating adoption"
          trajectory: "Continued growth"
          implications: "Feature expectations, competitive differentiation"

        - category: "Cloud and SaaS"
          current_state: "Mainstream"
          trajectory: "Standard expectation"
          implications: "Delivery model requirements"

        - category: "Automation"
          current_state: "Growing demand"
          trajectory: "Key differentiator"
          implications: "Product roadmap priority"

    buyer_behavior_trends:
      trends:
        - trend: "Self-service buying preference"
          evidence: "Increased product-led growth success"
          impact: "Go-to-market model considerations"

        - trend: "Vendor consolidation"
          evidence: "Platform preference over point solutions"
          impact: "Partnership and integration strategy"

        - trend: "Value-based purchasing"
          evidence: "ROI requirements in buying process"
          impact: "Sales enablement needs"

    industry_trends:
      monitoring:
        - "Consolidation and M&A activity"
        - "New market entrants"
        - "Business model innovations"
        - "Pricing model shifts"
        - "Go-to-market evolution"

    trend_assessment:
      framework:
        relevance:
          high: "Directly impacts our market/customers"
          medium: "Indirectly relevant"
          low: "Peripheral impact"

        urgency:
          immediate: "Action needed now"
          near_term: "6-12 month horizon"
          long_term: "1-3 year horizon"

        certainty:
          established: "Clear trajectory"
          emerging: "Direction becoming clear"
          nascent: "Early signals, uncertain"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE LANDSCAPE
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_landscape:

    market_share_analysis:
      tracking:
        - "Estimated market share by competitor"
        - "Share trends over time"
        - "Segment-specific share"
        - "Geographic share"

      data_sources:
        - "Industry analyst reports"
        - "Win/loss data"
        - "Customer research"
        - "Public financial data"

    competitive_intensity:
      assessment:
        rivalry:
          level: "High/Medium/Low"
          factors:
            - "Number of competitors"
            - "Market growth rate"
            - "Product differentiation"
            - "Switching costs"

        new_entrants:
          threat_level: "High/Medium/Low"
          recent_entrants: "List of new competitors"
          barriers: "Entry barrier assessment"

        substitutes:
          threat_level: "High/Medium/Low"
          alternatives: "Alternative solutions"
          risk: "Substitution risk assessment"

    competitive_segments:
      mapping:
        - segment: "Enterprise-focused"
          competitors: ["Competitor A", "Competitor B"]
          characteristics: "High-touch, complex implementations"

        - segment: "SMB-focused"
          competitors: ["Competitor C", "Competitor D"]
          characteristics: "Self-serve, quick deployment"

        - segment: "Vertical specialists"
          competitors: ["Competitor E", "Competitor F"]
          characteristics: "Industry-specific solutions"

    positioning_map:
      dimensions:
        common_axes:
          - "Price vs. Feature depth"
          - "Ease of use vs. Sophistication"
          - "Point solution vs. Platform"
          - "SMB focus vs. Enterprise focus"

      competitor_positions:
        format:
          competitor: "Name"
          position: "Quadrant/location"
          trajectory: "Moving direction"

  # ═══════════════════════════════════════════════════════════════════════════
  # INDUSTRY INTELLIGENCE
  # ═══════════════════════════════════════════════════════════════════════════

  industry_intelligence:

    analyst_coverage:
      tracking:
        - "Key industry analysts"
        - "Analyst firm coverage"
        - "Report calendar"
        - "Rating changes"

      engagement:
        - "Analyst briefing schedule"
        - "Report participation"
        - "Wave/quadrant tracking"

    industry_events:
      monitoring:
        - event_type: "Major conferences"
          tracking: "Attendance, presentations, announcements"

        - event_type: "Trade shows"
          tracking: "Booth presence, demos, messaging"

        - event_type: "Webinars/virtual events"
          tracking: "Topics, attendance, positioning"

      conference_intelligence:
        - "Competitor presence"
        - "Messaging and positioning"
        - "Product announcements"
        - "Partnership revelations"
        - "Customer references"

    news_monitoring:
      categories:
        - "M&A activity"
        - "Funding announcements"
        - "Leadership changes"
        - "Product launches"
        - "Partnership announcements"
        - "Customer wins"
        - "Industry developments"

      sources:
        - "Industry publications"
        - "Business news"
        - "Tech news"
        - "Press releases"
        - "Social media"

  # ═══════════════════════════════════════════════════════════════════════════
  # OPPORTUNITY ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  opportunity_analysis:

    whitespace_identification:
      market_gaps:
        - "Underserved segments"
        - "Unaddressed use cases"
        - "Geographic opportunities"
        - "Price point gaps"

      competitive_gaps:
        - "Feature whitespace"
        - "Service gaps"
        - "Integration opportunities"
        - "Experience improvements"

    opportunity_scoring:
      criteria:
        market_attractiveness:
          weight: 0.30
          factors: ["Size", "Growth", "Profitability"]

        competitive_position:
          weight: 0.25
          factors: ["Our strengths", "Competitor weakness", "Differentiation potential"]

        feasibility:
          weight: 0.25
          factors: ["Resource requirements", "Time to market", "Execution risk"]

        strategic_fit:
          weight: 0.20
          factors: ["Mission alignment", "Capability fit", "Synergies"]

    adjacency_analysis:
      adjacent_markets:
        - market: "Adjacent market name"
          relationship: "How it connects to current market"
          opportunity: "Expansion potential"
          entry_approach: "How to enter"

      expansion_assessment:
        - "Market size of adjacency"
        - "Competitive dynamics"
        - "Our right to win"
        - "Investment required"

  # ═══════════════════════════════════════════════════════════════════════════
  # REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  reporting:

    standard_reports:
      monthly_market_update:
        contents:
          - "Key market developments"
          - "Competitive activity summary"
          - "Trend updates"
          - "Notable news"
        audience: "Marketing leadership"

      quarterly_landscape_review:
        contents:
          - "Market size and growth update"
          - "Competitive positioning analysis"
          - "Trend assessment"
          - "Opportunity evaluation"
          - "Strategic implications"
        audience: "CMO, executive team"

      annual_market_assessment:
        contents:
          - "Comprehensive market analysis"
          - "Year-in-review"
          - "Forward-looking projections"
          - "Strategic recommendations"
        audience: "Executive team, board"

    dashboards:
      market_overview:
        - "Market size and growth"
        - "Competitive share"
        - "Trend radar"
        - "News feed"

      competitive_landscape:
        - "Competitor activity timeline"
        - "Positioning map"
        - "Share of voice"
        - "Feature comparison"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_cmo_agent:
      - "Market size and growth data"
      - "Competitive landscape assessments"
      - "Trend analysis"
      - "Opportunity recommendations"

    to_brand_positioning_agent:
      - "Market positioning context"
      - "Competitive positioning maps"
      - "Differentiation opportunities"

    to_product_team:
      - "Market requirements insights"
      - "Feature gap analysis"
      - "Competitive feature intelligence"

    to_strategy_team:
      - "Market entry assessments"
      - "Adjacency analysis"
      - "M&A landscape intelligence"
