# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITOR SEO INTELLIGENCE MODULE
# The Marketing Department 2026 - SEO Agent
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "competitor-seo-intel"
  name: "Competitor SEO Intelligence Engine"
  version: "1.0.0"
  category: "competitor_intelligence"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITOR IDENTIFICATION & TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  competitor_management:

    identification_methods:
      - method: "SERP Competitors"
        description: "Domains ranking for your target keywords"
        process:
          - "Analyze top 20 results for all tracked keywords"
          - "Score domains by frequency of appearance"
          - "Identify consistent competitors"

      - method: "Market Competitors"
        description: "Known business competitors"
        source: "Manual input, CRM, sales intelligence"

      - method: "Emerging Competitors"
        description: "New domains gaining visibility"
        detection:
          - "New domains appearing in SERPs"
          - "Rapid ranking gains"
          - "New content targeting your keywords"

    competitor_tiers:
      - tier: "Primary Competitors"
        description: "Direct business competitors, always tracked"
        tracking_depth: "comprehensive"
        update_frequency: "daily"
        limit: "5-10 domains"

      - tier: "Secondary Competitors"
        description: "Partial overlap, relevant for specific keywords"
        tracking_depth: "standard"
        update_frequency: "weekly"
        limit: "10-20 domains"

      - tier: "Emerging/Watchlist"
        description: "New or potential competitors"
        tracking_depth: "light"
        update_frequency: "monthly"
        limit: "unlimited"

    competitor_profiles:
      basic_info:
        - "Domain name"
        - "Company name"
        - "Industry/vertical"
        - "Geographic focus"
        - "Business model"

      seo_metrics:
        - "Domain Authority/Rating"
        - "Organic traffic estimate"
        - "Organic keyword count"
        - "Backlink count"
        - "Referring domains"
        - "Content pages count"

  # ═══════════════════════════════════════════════════════════════════════════
  # KEYWORD COMPETITIVE ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  keyword_analysis:

    keyword_overlap:
      metrics:
        - metric: "Common Keywords"
          description: "Keywords both you and competitor rank for"

        - metric: "Your Unique Keywords"
          description: "Keywords you rank for, competitor doesn't"

        - metric: "Competitor Unique Keywords"
          description: "Keywords competitor ranks for, you don't"

        - metric: "Overlap Percentage"
          description: "Common / Total unique keywords"

    keyword_gap_analysis:
      gap_types:
        - type: "Pure Gap"
          definition: "Competitor ranks, you don't"
          opportunity: "New keyword targets"

        - type: "Position Gap"
          definition: "Competitor ranks higher than you"
          opportunity: "Improvement targets"

        - type: "Feature Gap"
          definition: "Competitor owns SERP features you don't"
          opportunity: "Feature optimization"

      gap_prioritization:
        factors:
          - "Search volume"
          - "Position difference"
          - "Business relevance"
          - "Ranking difficulty"
          - "Quick win potential"

    competitor_keyword_tracking:
      tracked_data:
        - "Competitor rankings for your keywords"
        - "Competitor new keyword acquisitions"
        - "Competitor lost keywords"
        - "Competitor keyword velocity"
        - "Competitor ranking URLs"

      alerts:
        - "Competitor overtakes your position"
        - "Competitor gains featured snippet"
        - "Competitor enters top 10 for important keyword"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT COMPETITIVE ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  content_analysis:

    content_inventory:
      competitor_content:
        - "Total indexed pages"
        - "Content by type (blog, product, landing)"
        - "Publishing frequency"
        - "Content depth (word count)"
        - "Content topics covered"
        - "Top performing content"

    content_gap_analysis:
      dimensions:
        - dimension: "Topic Gaps"
          description: "Topics competitors cover, you don't"
          analysis: "Topic modeling comparison"

        - dimension: "Format Gaps"
          description: "Content formats competitors use"
          examples: ["Videos", "Infographics", "Podcasts", "Tools"]

        - dimension: "Depth Gaps"
          description: "Content depth comparison"
          measurement: "Word count, comprehensiveness"

        - dimension: "Freshness Gaps"
          description: "Content update frequency"
          measurement: "Last modified dates"

    top_content_analysis:
      per_competitor:
        - "Top 10 pages by traffic"
        - "Top 10 pages by backlinks"
        - "Top 10 pages by keyword rankings"
        - "Recently published top performers"
        - "Evergreen content"

      analysis_depth:
        - "Title and heading structure"
        - "Content length"
        - "Keywords targeted"
        - "SERP features captured"
        - "Backlinks earned"
        - "Social shares"

    content_strategy_insights:
      - "Content themes/pillars"
      - "Publishing cadence"
      - "Target audience focus"
      - "Content promotion patterns"
      - "Linkable asset types"

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKLINK COMPETITIVE ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  backlink_analysis:

    profile_comparison:
      metrics:
        - "Total backlinks"
        - "Referring domains"
        - "Domain authority/rating"
        - "Follow/nofollow ratio"
        - "Link quality distribution"
        - "Anchor text profile"

    link_gap:
      analysis_types:
        - type: "Referring Domain Gap"
          description: "Domains linking to competitors but not you"
          output: "Prospect list for outreach"

        - type: "Link Intersect"
          description: "Domains linking to multiple competitors"
          significance: "Higher link likelihood"

        - type: "Quality Gap"
          description: "High-quality links competitors have"
          output: "Premium link targets"

    competitor_link_velocity:
      tracking:
        - "New links per month"
        - "New referring domains per month"
        - "Link acquisition trends"
        - "Link building tactics identified"

    link_building_insights:
      - "Content types earning links"
      - "Successful outreach patterns"
      - "Partnership relationships"
      - "PR and media coverage"
      - "Guest posting footprint"

  # ═══════════════════════════════════════════════════════════════════════════
  # TECHNICAL SEO COMPARISON
  # ═══════════════════════════════════════════════════════════════════════════

  technical_comparison:

    metrics:
      performance:
        - "Page speed scores"
        - "Core Web Vitals"
        - "Mobile usability"

      structure:
        - "Site architecture depth"
        - "Internal linking patterns"
        - "URL structure"

      implementation:
        - "Schema markup usage"
        - "Mobile-first implementation"
        - "International SEO setup"

    benchmarking:
      - "Technical SEO score comparison"
      - "Performance benchmarks"
      - "Best practice adoption"

  # ═══════════════════════════════════════════════════════════════════════════
  # VISIBILITY & MARKET SHARE
  # ═══════════════════════════════════════════════════════════════════════════

  market_analysis:

    visibility_comparison:
      metrics:
        - "Organic visibility score"
        - "Visibility by keyword category"
        - "Visibility trends"
        - "Share of voice"

    market_share:
      calculation: "Your visibility / Total market visibility"
      tracking:
        - "Overall market share"
        - "Market share by segment"
        - "Market share trends"

    competitive_positioning:
      matrices:
        - matrix: "Visibility vs Authority"
          axes: ["Organic visibility", "Domain authority"]

        - matrix: "Content vs Links"
          axes: ["Content volume", "Backlink strength"]

        - matrix: "Traffic vs Growth"
          axes: ["Current traffic", "Traffic growth rate"]

  # ═══════════════════════════════════════════════════════════════════════════
  # CHANGE MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  monitoring:

    tracked_changes:
      content_changes:
        - "New content published"
        - "Content updates"
        - "Content removed"
        - "URL structure changes"

      technical_changes:
        - "Site structure changes"
        - "New features/functionality"
        - "Performance changes"

      strategy_changes:
        - "New keyword targets"
        - "Focus area shifts"
        - "New market entry"

    alerts:
      - alert: "New Competitor Content"
        trigger: "Competitor publishes targeting your keywords"
        priority: "medium"

      - alert: "Competitor Ranking Gain"
        trigger: "Competitor moves into top 5"
        priority: "high"

      - alert: "Competitor Traffic Spike"
        trigger: "Significant traffic increase detected"
        priority: "medium"

      - alert: "Competitor Link Acquisition"
        trigger: "Competitor gets high-quality backlink"
        priority: "low"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    reports:
      - report: "Competitive Landscape Overview"
        frequency: "Monthly"
        contents:
          - "Market share analysis"
          - "Competitor profiles summary"
          - "Key competitive metrics"
          - "Strategic recommendations"

      - report: "Competitor Deep Dive"
        frequency: "Quarterly"
        per_competitor: true
        contents:
          - "Full profile analysis"
          - "Content strategy breakdown"
          - "Backlink analysis"
          - "Opportunities and threats"

      - report: "Competitive Alerts Digest"
        frequency: "Weekly"
        contents:
          - "Competitor movements"
          - "New content alerts"
          - "Ranking changes"
          - "Link acquisitions"

    dashboards:
      - dashboard: "Competitive Overview"
        widgets:
          - "Market share pie chart"
          - "Visibility comparison"
          - "Ranking distribution"
          - "Recent movements"

      - dashboard: "Head-to-Head"
        widgets:
          - "Metric comparison table"
          - "Keyword overlap visualization"
          - "Content gap summary"
          - "Link gap summary"

    integrations:
      - agent: "Competitive Intelligence Agent"
        data_shared:
          - "SEO competitive metrics"
          - "Content intelligence"
          - "Market positioning"

      - agent: "Content Strategist Agent"
        data_shared:
          - "Content gap analysis"
          - "Top performing competitor content"
          - "Topic opportunities"

      - agent: "CMO Agent"
        data_shared:
          - "Strategic insights"
          - "Market position"
          - "Competitive threats"
