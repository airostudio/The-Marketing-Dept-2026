# ═══════════════════════════════════════════════════════════════════════════════
# PAID MEDIA AGENT - CREATIVE INTELLIGENCE MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "creative-intelligence"
  name: "AI-Powered Creative Intelligence Engine"
  version: "1.0.0"
  category: "creative_optimization"

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATIVE LIBRARY MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  creative_library:

    # ─────────────────────────────────────────────────────────────────────────
    # Asset Management
    # ─────────────────────────────────────────────────────────────────────────

    asset_management:
      name: "Centralized Creative Asset Repository"

      asset_types:
        images:
          formats: ["JPG", "PNG", "GIF", "WebP"]
          specifications:
            google_display:
              - { name: "Landscape", width: 1200, height: 628 }
              - { name: "Square", width: 1200, height: 1200 }
              - { name: "Portrait", width: 900, height: 1600 }
            meta:
              - { name: "Feed Square", width: 1080, height: 1080 }
              - { name: "Feed Landscape", width: 1200, height: 628 }
              - { name: "Story/Reels", width: 1080, height: 1920 }
            linkedin:
              - { name: "Sponsored Content", width: 1200, height: 627 }
              - { name: "Carousel", width: 1080, height: 1080 }

        videos:
          formats: ["MP4", "MOV", "GIF"]
          specifications:
            meta_feed:
              aspect_ratios: ["1:1", "4:5", "16:9"]
              max_length: "240 seconds"
              recommended_length: "15-30 seconds"
            meta_stories:
              aspect_ratio: "9:16"
              max_length: "120 seconds"
              recommended_length: "6-15 seconds"
            youtube:
              aspect_ratio: "16:9"
              max_length: "varies by format"
              recommended_length: "15-60 seconds"
            tiktok:
              aspect_ratio: "9:16"
              max_length: "180 seconds"
              recommended_length: "21-34 seconds"

        copy:
          types:
            - "Headlines (short, medium, long)"
            - "Descriptions"
            - "Primary text"
            - "CTAs"
            - "Hashtags"

      organization:
        hierarchy:
          - "Campaign/Initiative"
          - "Creative Concept"
          - "Asset Type"
          - "Platform/Format"
          - "Version"

        tagging:
          mandatory:
            - "Campaign"
            - "Platform"
            - "Asset type"
            - "Creation date"
          optional:
            - "Theme"
            - "Message type"
            - "Target audience"
            - "Season/Event"
            - "Product/Service"

        versioning:
          - "Track all versions"
          - "Link variations"
          - "Record changes"
          - "Maintain audit trail"

    # ─────────────────────────────────────────────────────────────────────────
    # Brand Compliance
    # ─────────────────────────────────────────────────────────────────────────

    brand_compliance:
      name: "Automated Brand Compliance Checker"

      checks:
        visual:
          - "Logo placement and size"
          - "Color palette adherence"
          - "Typography compliance"
          - "Image style consistency"
          - "Safe zone compliance"

        copy:
          - "Tone of voice"
          - "Approved terminology"
          - "Prohibited words"
          - "Legal disclaimers"
          - "Trademark usage"

        regulatory:
          - "Industry-specific requirements"
          - "Platform policy compliance"
          - "Regional requirements"
          - "Disclaimer inclusion"

      approval_workflow:
        levels:
          - level: "Auto-Approved"
            criteria: "Passes all automated checks, minor variation"

          - level: "Quick Review"
            criteria: "New creative, standard format"
            approvers: ["Marketing Manager"]

          - level: "Full Review"
            criteria: "New concept, claims, sensitive content"
            approvers: ["Marketing Manager", "Legal"]

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATIVE TESTING ENGINE
  # ═══════════════════════════════════════════════════════════════════════════

  creative_testing:

    # ─────────────────────────────────────────────────────────────────────────
    # Testing Framework
    # ─────────────────────────────────────────────────────────────────────────

    testing_framework:
      name: "Systematic Creative Testing Engine"

      test_types:
        - type: "Message Testing"
          elements: ["Headlines", "Value propositions", "CTAs", "Offers"]
          priority: "High"
          sample_requirements: { impressions: 10000, conversions: 50 }

        - type: "Visual Testing"
          elements: ["Images", "Videos", "Colors", "Layouts"]
          priority: "High"
          sample_requirements: { impressions: 15000, conversions: 75 }

        - type: "Format Testing"
          elements: ["Ad formats", "Placements", "Aspect ratios"]
          priority: "Medium"
          sample_requirements: { impressions: 20000, conversions: 100 }

        - type: "Audience x Creative"
          elements: ["Creative-audience combinations"]
          priority: "Medium"
          sample_requirements: { impressions: 10000, conversions: 50 }

      testing_methodology:
        statistical_approach: "Bayesian A/B testing"
        confidence_threshold: 0.95
        minimum_runtime: "7 days"

        traffic_allocation:
          exploration: 0.20
          exploitation: 0.80

        multi_armed_bandit:
          enabled: true
          algorithm: "Thompson Sampling"
          warmup_period: "3 days"

    # ─────────────────────────────────────────────────────────────────────────
    # Testing Roadmap
    # ─────────────────────────────────────────────────────────────────────────

    testing_roadmap:
      name: "Strategic Testing Calendar"

      quarterly_themes:
        q1:
          - "New year messaging"
          - "Resolution/goals themes"
          - "Fresh start visuals"

        q2:
          - "Spring refresh"
          - "Mid-year push"
          - "Summer preparation"

        q3:
          - "Back to business"
          - "Planning season"
          - "Holiday prep"

        q4:
          - "Holiday messaging"
          - "Year-end urgency"
          - "Gift themes"

      continuous_tests:
        - "Headline variations"
        - "CTA button text"
        - "Social proof elements"
        - "Urgency messaging"
        - "Benefit statements"

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATIVE OPTIMIZATION
  # ═══════════════════════════════════════════════════════════════════════════

  creative_optimization:

    # ─────────────────────────────────────────────────────────────────────────
    # Performance Analysis
    # ─────────────────────────────────────────────────────────────────────────

    performance_analysis:
      name: "Creative Performance Intelligence"

      metrics_tracked:
        engagement:
          - "Click-through rate (CTR)"
          - "Engagement rate"
          - "Video view rate"
          - "Video completion rate"
          - "Share rate"

        conversion:
          - "Conversion rate"
          - "Cost per conversion"
          - "ROAS"
          - "Revenue per impression"

        quality:
          - "Quality Score (Google)"
          - "Relevance Score (Meta)"
          - "Ad Strength (Google)"
          - "Expected CTR"
          - "Landing page experience"

      analysis_dimensions:
        - "By creative element"
        - "By audience segment"
        - "By platform"
        - "By placement"
        - "By time of day"
        - "By device"

    # ─────────────────────────────────────────────────────────────────────────
    # Fatigue Detection
    # ─────────────────────────────────────────────────────────────────────────

    fatigue_detection:
      name: "Creative Fatigue Monitor"

      fatigue_indicators:
        - indicator: "CTR decline"
          threshold: ">20% drop over 7 days"
          weight: 0.30

        - indicator: "Frequency increase"
          threshold: "Frequency > 3 (display) or > 5 (search)"
          weight: 0.25

        - indicator: "CPM increase"
          threshold: ">25% increase over 14 days"
          weight: 0.20

        - indicator: "Conversion rate decline"
          threshold: ">15% drop over 7 days"
          weight: 0.25

      fatigue_scoring:
        scale: "0-100"
        thresholds:
          healthy: { min: 0, max: 30, action: "Monitor" }
          warning: { min: 31, max: 60, action: "Plan refresh" }
          fatigued: { min: 61, max: 80, action: "Refresh soon" }
          critical: { min: 81, max: 100, action: "Refresh immediately" }

      refresh_triggers:
        automatic:
          - "Fatigue score > 70"
          - "CTR below 50% of benchmark"
          - "Frequency > 5"
        recommended:
          - "Same creative running > 30 days"
          - "Performance plateau"
          - "Seasonal relevance expired"

    # ─────────────────────────────────────────────────────────────────────────
    # Dynamic Creative Optimization
    # ─────────────────────────────────────────────────────────────────────────

    dynamic_creative:
      name: "DCO Engine"

      platforms:
        google_responsive:
          assets:
            headlines: { min: 3, max: 15, recommended: 10 }
            descriptions: { min: 2, max: 4, recommended: 4 }
            images: { min: 1, max: 20, recommended: 10 }
            videos: { min: 0, max: 5 }
            logos: { min: 1, max: 5 }
          optimization: "AI-driven combination testing"

        meta_dynamic:
          assets:
            images_videos: { min: 2, max: 10 }
            primary_text: { min: 1, max: 5 }
            headlines: { min: 1, max: 5 }
            descriptions: { min: 1, max: 5 }
          optimization: "Machine learning optimization"

      personalization_signals:
        - "Audience segment"
        - "Device type"
        - "Location"
        - "Time of day"
        - "Previous interactions"
        - "Weather (where available)"

      asset_performance_reporting:
        - "Individual asset metrics"
        - "Combination performance"
        - "Top/bottom performers"
        - "Replacement recommendations"

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATIVE INSIGHTS
  # ═══════════════════════════════════════════════════════════════════════════

  creative_insights:

    # ─────────────────────────────────────────────────────────────────────────
    # Element Analysis
    # ─────────────────────────────────────────────────────────────────────────

    element_analysis:
      name: "Creative Element Performance Analysis"

      analyzed_elements:
        visual:
          - "Color dominance"
          - "Image type (product, lifestyle, abstract)"
          - "Face presence"
          - "Text overlay"
          - "Logo placement"
          - "Visual complexity"

        copy:
          - "Headline length"
          - "Emotional sentiment"
          - "Question vs statement"
          - "Number usage"
          - "Power words"
          - "CTA type"

        video:
          - "Hook timing"
          - "Scene count"
          - "Text-to-video ratio"
          - "Music presence"
          - "Speaker presence"
          - "Mobile optimization"

      pattern_identification:
        - "Top performing element combinations"
        - "Audience-specific preferences"
        - "Platform-specific patterns"
        - "Seasonal trends"

    # ─────────────────────────────────────────────────────────────────────────
    # Competitive Creative Analysis
    # ─────────────────────────────────────────────────────────────────────────

    competitive_analysis:
      name: "Competitive Creative Intelligence"

      tracked_elements:
        - "Ad formats used"
        - "Messaging themes"
        - "Visual styles"
        - "Offer types"
        - "CTA approaches"
        - "Frequency patterns"

      analysis_outputs:
        - "Competitor creative library"
        - "Trend identification"
        - "Whitespace opportunities"
        - "Best practice benchmarks"

      sources:
        - "Meta Ad Library"
        - "Google Ads Transparency Center"
        - "LinkedIn Ad Library"
        - "TikTok Creative Center"
        - "Third-party tools"

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATIVE RECOMMENDATIONS ENGINE
  # ═══════════════════════════════════════════════════════════════════════════

  recommendations:

    recommendation_types:
      - type: "Performance-based"
        logic: "Recommend elements from top performers"
        confidence: "High"

      - type: "Gap-based"
        logic: "Recommend untested elements"
        confidence: "Medium"

      - type: "Trend-based"
        logic: "Recommend based on industry trends"
        confidence: "Medium"

      - type: "Competitive"
        logic: "Recommend based on competitor success"
        confidence: "Medium"

    recommendation_delivery:
      frequency: "Weekly creative insights report"
      channels: ["Dashboard", "Email", "Slack"]

      contents:
        - "Top performing creatives"
        - "Underperforming creatives"
        - "Fatigue alerts"
        - "Test recommendations"
        - "Refresh recommendations"
        - "New creative opportunities"

  # ═══════════════════════════════════════════════════════════════════════════
  # AD FORMAT OPTIMIZATION
  # ═══════════════════════════════════════════════════════════════════════════

  format_optimization:

    format_performance_tracking:
      google:
        - "Responsive Search Ads"
        - "Responsive Display Ads"
        - "Performance Max"
        - "YouTube ads (all formats)"
        - "Discovery ads"

      meta:
        - "Single image"
        - "Carousel"
        - "Video"
        - "Collection"
        - "Stories"
        - "Reels"

      linkedin:
        - "Single image"
        - "Carousel"
        - "Video"
        - "Document ads"
        - "Conversation ads"

      tiktok:
        - "In-feed video"
        - "TopView"
        - "Spark Ads"
        - "Branded effects"

    format_recommendations:
      objective_mapping:
        awareness:
          recommended: ["Video", "Stories", "Display"]

        consideration:
          recommended: ["Carousel", "Video", "Collection"]

        conversion:
          recommended: ["Single image", "Dynamic", "Shopping"]

      audience_mapping:
        younger_audiences:
          recommended: ["Video", "Reels", "Stories", "TikTok"]

        professional_audiences:
          recommended: ["Document ads", "Carousel", "Video"]

        shopping_intent:
          recommended: ["Collection", "Shopping", "Carousel"]

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & INTEGRATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    to_campaign_management:
      - "Creative recommendations"
      - "Fatigue alerts"
      - "Format recommendations"
      - "Refresh requirements"

    to_content_strategy_agent:
      - "Top performing themes"
      - "Messaging insights"
      - "Content format preferences"
      - "Audience creative preferences"

    to_brand_agent:
      - "Brand compliance reports"
      - "Creative consistency analysis"
      - "Market creative trends"

    to_analytics_agent:
      - "Creative performance data"
      - "A/B test results"
      - "Attribution by creative"

  integrations:
    creative_tools:
      - "Canva"
      - "Adobe Creative Cloud"
      - "Figma"

    asset_management:
      - "Digital Asset Management (DAM) systems"
      - "Brand management platforms"

    analysis_tools:
      - "Creative analytics platforms"
      - "AI image analysis APIs"
      - "Sentiment analysis"
