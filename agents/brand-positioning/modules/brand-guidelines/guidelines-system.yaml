    compliance_checklist:
      visual:
        - "Logo usage correct"
        - "Colors within palette"
        - "Typography correct"
        - "Imagery aligned"

      verbal:
        - "Messaging on-brand"
        - "Voice appropriate"
        - "Terminology correct"
        - "Claims approved"

    violation_handling:
      minor: "Feedback and correction"
      moderate: "Required revision"
      major: "Escalation and remediation"

