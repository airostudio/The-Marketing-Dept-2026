<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audema - Login / Sign Up</title>
  <meta http-equiv="refresh" content="0;url=/index.html?openAuth=login">
  <script>window.location.replace('/index.html?openAuth=login');</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #070711; color: rgba(255,255,255,0.6);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .redirect-note { text-align: center; }
    .redirect-icon {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #ec4899);
    }
    .redirect-note p { font-size: 14px; }
    .redirect-note a { color: #a78bfa; }
  </style>
</head>
<body>
  <!--
    This page always redirects to the live sign-in modal on index.html
    (AuthModal, in js/auth-modal.js). It exists only as a stable bookmark
    target — the markup below is a no-JS fallback, not a real login form.
  -->
  <div class="redirect-note">
    <div class="redirect-icon"></div>
    <p>Redirecting to sign in&hellip; <a href="/index.html?openAuth=login">Click here if you are not redirected.</a></p>
  </div>
</body>
</html>
