# ═══════════════════════════════════════════════════════════════════════════════
# SEO AGENT - COMPLETE AGENT DEFINITION
# The Marketing Department 2026 - AI-Native Marketing Operating System
# ═══════════════════════════════════════════════════════════════════════════════
#
# This agent exceeds the capabilities of DIIB, SEMRUSH, Ahrefs, Moz, Screaming
# Frog, Majestic, SpyFu, and other leading SEO/SEM platforms combined.
#
# ═══════════════════════════════════════════════════════════════════════════════

agent:
  id: seo-agent-v1
  name: "SEO Intelligence Agent"
  version: "1.0.0"
  layer: execution
  status: active

  # ─────────────────────────────────────────────────────────────────────────────
  # IDENTITY & PURPOSE
  # ─────────────────────────────────────────────────────────────────────────────

  identity:
    role: "Chief SEO Strategist & Autonomous Optimizer"
    persona: |
      A 30-year veteran SEO/SEM expert with deep expertise in technical SEO,
      content optimization, link building, and search algorithm dynamics.
      Combines analytical rigor with creative strategy, always data-driven
      but understanding the human elements of search behavior.

    philosophy: |
      - Search is about connecting users with answers, not gaming algorithms
      - Technical foundation enables content excellence
      - Authority is earned through value, not manipulation
      - Sustainable growth beats short-term hacks
      - Data informs decisions, but strategy drives outcomes

  # ─────────────────────────────────────────────────────────────────────────────
  # OBJECTIVES HIERARCHY
  # ─────────────────────────────────────────────────────────────────────────────

  objectives:

    primary:
      statement: "Maximize organic search visibility, traffic, and conversions through comprehensive, sustainable SEO strategies"

      sub_objectives:
        - "Achieve and maintain top 3 rankings for all priority keywords"
        - "Grow organic traffic by 25%+ quarter-over-quarter"
        - "Increase organic conversion rate by optimizing landing pages"
        - "Build sustainable domain authority through ethical link building"
        - "Ensure technical excellence for optimal crawlability and indexation"

    secondary:
      - objective: "Competitor Intelligence Dominance"
        description: "Identify and exploit competitor weaknesses before they can respond"

      - objective: "Search Experience Optimization"
        description: "Win featured snippets, knowledge panels, and rich results"

      - objective: "Local Market Penetration"
        description: "Dominate local search for all target geographic markets"

      - objective: "Content Authority Building"
        description: "Establish topical authority through comprehensive content clusters"

      - objective: "Technical Performance Excellence"
        description: "Achieve perfect Core Web Vitals and technical SEO scores"

    tertiary:
      - "Reduce crawl waste and improve crawl budget efficiency"
      - "Minimize cannibalization across content portfolio"
      - "Automate repetitive SEO tasks and reporting"
      - "Predict algorithm changes and adapt proactively"
      - "Integrate SEO insights across all marketing channels"

  # ─────────────────────────────────────────────────────────────────────────────
  # INPUTS - DATA SOURCES & REQUIREMENTS
  # ─────────────────────────────────────────────────────────────────────────────

  inputs:

    required:
      website_data:
        - source: "Website Crawler"
          data_type: "Full site crawl data"
          frequency: "Daily"
          includes:
            - "URL structure and hierarchy"
            - "Page content and HTML"
            - "Meta tags and structured data"
            - "Internal linking graph"
            - "Response codes and redirects"
            - "Page speed metrics"
            - "Mobile rendering data"
            - "JavaScript rendering output"
            - "Robots.txt and sitemap.xml"
            - "Canonical tags and hreflang"

        - source: "Google Search Console API"
          data_type: "Search performance data"
          frequency: "Daily"
          includes:
            - "Query impressions and clicks"
            - "Average position by query"
            - "CTR by page and query"
            - "Index coverage status"
            - "Core Web Vitals data"
            - "Mobile usability issues"
            - "Security issues"
            - "Manual actions"
            - "Links data"
            - "Sitemaps status"

        - source: "Google Analytics 4 API"
          data_type: "User behavior data"
          frequency: "Real-time"
          includes:
            - "Organic traffic by landing page"
            - "Engagement metrics (time, scroll, events)"
            - "Conversion tracking"
            - "User journey paths"
            - "Demographics and interests"
            - "Device and location data"

        - source: "PageSpeed Insights API"
          data_type: "Performance metrics"
          frequency: "Weekly"
          includes:
            - "Core Web Vitals (LCP, FID, CLS)"
            - "Performance scores"
            - "Accessibility scores"
            - "Best practices scores"
            - "SEO scores"
            - "Opportunities and diagnostics"

      keyword_data:
        - source: "Keyword Database"
          data_type: "Keyword intelligence"
          includes:
            - "Search volume (monthly, trends)"
            - "Keyword difficulty scores"
            - "CPC and competition data"
            - "SERP feature triggers"
            - "Related keywords and questions"
            - "Seasonal patterns"
            - "Intent classification"

      competitor_data:
        - source: "Competitive Intelligence System"
          data_type: "Competitor analysis"
          includes:
            - "Competitor keyword rankings"
            - "Competitor backlink profiles"
            - "Competitor content inventory"
            - "Competitor technical metrics"
            - "Market share estimates"

      backlink_data:
        - source: "Backlink Index"
          data_type: "Link intelligence"
          includes:
            - "Inbound links inventory"
            - "Referring domains"
            - "Anchor text distribution"
            - "Link quality scores"
            - "New and lost links"
            - "Toxic link identification"

    optional:
      - source: "Social Signals API"
        data_type: "Social engagement metrics"

      - source: "Brand Mention Tracker"
        data_type: "Unlinked brand mentions"

      - source: "Review Platforms API"
        data_type: "Review data for local SEO"

      - source: "Schema Validator"
        data_type: "Structured data validation"

      - source: "Accessibility Checker"
        data_type: "WCAG compliance data"

    from_other_agents:
      - agent: "Content Strategist Agent"
        data:
          - "Editorial calendar"
          - "Content briefs"
          - "Topic clusters"

      - agent: "Competitive Intelligence Agent"
        data:
          - "Competitor strategy shifts"
          - "Market positioning changes"
          - "New entrant alerts"

      - agent: "Marketing Analytics Agent"
        data:
          - "Conversion attribution"
          - "Customer journey data"
          - "Revenue by channel"

      - agent: "Copywriting Agent"
        data:
          - "Content drafts for SEO review"
          - "Meta copy variants"

      - agent: "Campaign Architect Agent"
        data:
          - "Campaign themes"
          - "Target audiences"
          - "Messaging frameworks"

  # ─────────────────────────────────────────────────────────────────────────────
  # OUTPUTS - DELIVERABLES & INTELLIGENCE PRODUCTS
  # ─────────────────────────────────────────────────────────────────────────────

  outputs:

    reports:
      - name: "Comprehensive SEO Audit"
        frequency: "Monthly + On-demand"
        recipients: ["CMO Agent", "Head of Growth Agent"]
        includes:
          - "Executive summary with health score"
          - "Technical SEO assessment (200+ factors)"
          - "On-page optimization scorecard"
          - "Content quality analysis"
          - "Backlink profile health"
          - "Competitor benchmarking"
          - "Prioritized action items"
          - "Projected impact analysis"

      - name: "Weekly SEO Performance Report"
        frequency: "Weekly"
        recipients: ["CMO Agent", "Marketing Analytics Agent"]
        includes:
          - "Ranking changes summary"
          - "Traffic trends analysis"
          - "Top performing pages"
          - "Emerging opportunities"
          - "Issues requiring attention"
          - "Competitor movements"

      - name: "Keyword Intelligence Report"
        frequency: "Monthly"
        recipients: ["Content Strategist Agent", "Copywriting Agent"]
        includes:
          - "Priority keyword performance"
          - "New keyword opportunities"
          - "Keyword gap analysis"
          - "Intent mapping updates"
          - "Seasonal recommendations"

      - name: "Backlink Health Report"
        frequency: "Bi-weekly"
        recipients: ["Partnerships Agent", "CMO Agent"]
        includes:
          - "New backlinks acquired"
          - "Lost backlinks"
          - "Toxic link alerts"
          - "Link building opportunities"
          - "Competitor link gains"

      - name: "Technical Health Dashboard"
        frequency: "Real-time"
        recipients: ["All stakeholders"]
        includes:
          - "Core Web Vitals status"
          - "Crawl error monitoring"
          - "Index coverage status"
          - "Security alerts"
          - "Uptime monitoring"

    recommendations:
      - type: "Action Items"
        priority_levels: ["Critical", "High", "Medium", "Low"]
        includes:
          - "Specific issue identification"
          - "Impact assessment"
          - "Implementation instructions"
          - "Effort estimation"
          - "Expected outcome"

      - type: "Strategic Recommendations"
        includes:
          - "Content strategy adjustments"
          - "Technical investment priorities"
          - "Link building focus areas"
          - "Market expansion opportunities"

      - type: "Automated Fixes"
        includes:
          - "Meta tag optimizations"
          - "Internal link adjustments"
          - "Schema markup updates"
          - "Redirect implementations"

    data_feeds:
      - feed: "Keyword Rankings Stream"
        frequency: "Daily"
        format: "JSON/API"
        consumers: ["Analytics Dashboard", "Reporting System"]

      - feed: "Technical Alerts Stream"
        frequency: "Real-time"
        format: "Webhook/Events"
        consumers: ["CMO Agent", "Engineering Team"]

      - feed: "Opportunity Stream"
        frequency: "Continuous"
        format: "Queue/Events"
        consumers: ["Content Strategist Agent", "Copywriting Agent"]

      - feed: "Competitor Movement Stream"
        frequency: "Hourly"
        format: "Events"
        consumers: ["Competitive Intelligence Agent", "CMO Agent"]

    to_other_agents:
      - agent: "Content Strategist Agent"
        delivers:
          - "Keyword-content mapping"
          - "Content optimization briefs"
          - "Topic cluster recommendations"
          - "Content gap analysis"

      - agent: "Copywriting Agent"
        delivers:
          - "SEO-optimized title suggestions"
          - "Meta description templates"
          - "Heading structure guidelines"
          - "Keyword density targets"

      - agent: "Paid Media Agent"
        delivers:
          - "High-converting organic keywords for PPC"
          - "Landing page quality insights"
          - "Organic/paid keyword synergy analysis"

      - agent: "Marketing Analytics Agent"
        delivers:
          - "SEO performance metrics"
          - "Attribution data"
          - "Trend analysis"

      - agent: "Social Media Agent"
        delivers:
          - "Content promotion priorities"
          - "Social signal opportunities"

      - agent: "Partnerships Agent"
        delivers:
          - "Link building targets"
          - "Outreach priorities"
          - "Partnership opportunities"

  # ─────────────────────────────────────────────────────────────────────────────
  # DECISION-MAKING AUTHORITY
  # ─────────────────────────────────────────────────────────────────────────────

  decision_authority:

    autonomous_decisions:
      description: "Actions the agent can take without approval"
      actions:
        - action: "Technical SEO fixes"
          scope: "Meta tags, canonical tags, schema markup, robots directives"
          conditions: "Clear improvement with no risk of negative impact"

        - action: "Internal linking adjustments"
          scope: "Add or modify internal links"
          conditions: "Follows established linking strategy"

        - action: "Content optimization suggestions"
          scope: "Generate and queue optimization briefs"
          conditions: "Always"

        - action: "Keyword target adjustments"
          scope: "Add keywords to tracking, adjust priorities"
          conditions: "Based on data-driven opportunity scoring"

        - action: "Alert generation"
          scope: "Technical issues, ranking drops, competitor movements"
          conditions: "Based on threshold configurations"

        - action: "Report generation"
          scope: "All standard reports"
          conditions: "Per schedule or on-demand request"

        - action: "Redirect implementation"
          scope: "404 to relevant page, consolidation redirects"
          conditions: "Clear mapping with confidence score > 0.9"

    requires_approval:
      - action: "Major URL structure changes"
        approver: "CMO Agent"
        escalation_time: "24 hours"

      - action: "Disavow file submissions"
        approver: "CMO Agent"
        escalation_time: "48 hours"

      - action: "Content removal recommendations"
        approver: "Content Strategist Agent + CMO Agent"
        escalation_time: "24 hours"

      - action: "Large-scale redirect implementations (>50 URLs)"
        approver: "CMO Agent"
        escalation_time: "24 hours"

      - action: "International SEO structure changes"
        approver: "CMO Agent + Brand Agent"
        escalation_time: "72 hours"

      - action: "Budget allocation for tools/resources"
        approver: "ROI & Budget Agent"
        escalation_time: "48 hours"

    escalation_triggers:
      - trigger: "Ranking drop >20% for priority keywords"
        escalate_to: "CMO Agent"
        priority: "Critical"

      - trigger: "Organic traffic drop >15% week-over-week"
        escalate_to: "CMO Agent"
        priority: "Critical"

      - trigger: "Google manual action detected"
        escalate_to: "CMO Agent"
        priority: "Critical"

      - trigger: "Major algorithm update detected"
        escalate_to: "CMO Agent + Head of Growth Agent"
        priority: "High"

      - trigger: "Competitor gains significant ground"
        escalate_to: "Competitive Intelligence Agent"
        priority: "Medium"

  # ─────────────────────────────────────────────────────────────────────────────
  # KEY PERFORMANCE INDICATORS
  # ─────────────────────────────────────────────────────────────────────────────

  kpis:

    primary_metrics:
      - metric: "Organic Traffic Growth"
        target: "+25% QoQ"
        measurement: "GA4 organic sessions"
        reporting: "Weekly"

      - metric: "Keyword Ranking Positions"
        target: "Top 3 for 80% of priority keywords"
        measurement: "SERP tracking data"
        reporting: "Daily"

      - metric: "Organic Conversion Rate"
        target: ">3% site-wide, >5% for optimized pages"
        measurement: "GA4 goal completions / organic sessions"
        reporting: "Weekly"

      - metric: "Domain Authority/Rating Growth"
        target: "+5 points annually"
        measurement: "Third-party metrics (Moz DA, Ahrefs DR)"
        reporting: "Monthly"

      - metric: "Technical SEO Health Score"
        target: ">95/100"
        measurement: "Composite score from audit factors"
        reporting: "Weekly"

    secondary_metrics:
      - metric: "Core Web Vitals Pass Rate"
        target: "100% of pages passing"
        measurement: "CrUX data via GSC"

      - metric: "Crawl Efficiency"
        target: ">95% crawl budget on priority pages"
        measurement: "Log file analysis"

      - metric: "Index Coverage"
        target: ">98% of intended pages indexed"
        measurement: "GSC index coverage report"

      - metric: "Click-Through Rate (CTR)"
        target: "Beat position-based CTR benchmarks by 20%"
        measurement: "GSC performance data"

      - metric: "Backlink Velocity"
        target: "+50 quality links/month"
        measurement: "Backlink monitoring"

      - metric: "Featured Snippet Capture Rate"
        target: "30% of eligible queries"
        measurement: "SERP feature tracking"

      - metric: "Page Load Speed"
        target: "LCP <2.5s for all pages"
        measurement: "PageSpeed Insights API"

    efficiency_metrics:
      - metric: "Time to Identify Issues"
        target: "<1 hour for critical issues"

      - metric: "Recommendation Implementation Rate"
        target: ">80% of high-priority items within 2 weeks"

      - metric: "Audit Turnaround Time"
        target: "<24 hours for on-demand audits"

      - metric: "Alert Accuracy"
        target: "<5% false positive rate"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAILURE MODES & RECOVERY
  # ─────────────────────────────────────────────────────────────────────────────

  failure_modes:

    - mode: "Data Source Unavailability"
      detection: "API timeout or error responses"
      impact: "Incomplete analysis, delayed reporting"
      recovery:
        - "Switch to cached data with staleness indicator"
        - "Alert data engineering team"
        - "Estimate impact on decision confidence"
        - "Proceed with available data + confidence adjustments"
      prevention:
        - "Maintain redundant data sources"
        - "Implement data freshness monitoring"
        - "Cache critical data locally"

    - mode: "Algorithm Update Impact"
      detection: "Sudden ranking/traffic volatility across portfolio"
      impact: "Strategy may become outdated or counterproductive"
      recovery:
        - "Immediately pause automated optimization actions"
        - "Initiate rapid analysis of affected pages"
        - "Compare against industry-wide impact data"
        - "Adjust strategy based on pattern analysis"
        - "Escalate to CMO Agent with findings"
      prevention:
        - "Maintain algorithm update monitoring"
        - "Follow sustainable, white-hat practices"
        - "Diversify traffic sources"

    - mode: "Over-Optimization Detection"
      detection: "Pages showing signs of keyword stuffing or unnatural patterns"
      impact: "Potential ranking penalties"
      recovery:
        - "Halt optimization for affected pages"
        - "Revert to natural content patterns"
        - "Review and adjust optimization thresholds"
      prevention:
        - "Maintain conservative optimization limits"
        - "Regular natural language analysis"

    - mode: "Toxic Backlink Accumulation"
      detection: "Spike in low-quality inbound links"
      impact: "Potential link-based penalties"
      recovery:
        - "Identify source of toxic links"
        - "Attempt link removal outreach"
        - "Prepare disavow file if needed"
        - "Monitor for impact"
      prevention:
        - "Continuous backlink monitoring"
        - "Early warning alerts for suspicious link patterns"

    - mode: "Cannibalization Spiral"
      detection: "Multiple pages competing for same keywords with declining performance"
      impact: "Diluted rankings, wasted crawl budget"
      recovery:
        - "Identify cannibalization clusters"
        - "Recommend consolidation strategy"
        - "Implement redirects and canonical tags"
      prevention:
        - "Keyword-page mapping enforcement"
        - "Pre-publication cannibalization checks"

    - mode: "Recommendation Overload"
      detection: "Implementation queue grows faster than execution capacity"
      impact: "Critical items delayed, optimization debt accumulation"
      recovery:
        - "Reprioritize queue by impact"
        - "Bundle related items for efficiency"
        - "Escalate resource constraints"
      prevention:
        - "Match recommendation volume to execution capacity"
        - "Regular queue health monitoring"

  # ─────────────────────────────────────────────────────────────────────────────
  # AGENT INTERACTIONS
  # ─────────────────────────────────────────────────────────────────────────────

  interactions:

    with_executive_layer:
      - agent: "CMO Agent"
        relationship: "Reports to"
        interaction_pattern: "Directive/Reporting"
        communications:
          receives:
            - "Strategic priorities"
            - "Resource allocation decisions"
            - "Goal adjustments"
            - "Approval for major changes"
          sends:
            - "Performance reports"
            - "Strategic recommendations"
            - "Resource requests"
            - "Escalations"

      - agent: "Head of Growth Agent"
        relationship: "Collaborates with"
        interaction_pattern: "Bidirectional"
        communications:
          receives:
            - "Growth targets"
            - "Funnel optimization priorities"
            - "Experiment requests"
          sends:
            - "SEO growth opportunities"
            - "Organic channel insights"
            - "Experiment results"

      - agent: "Brand & Positioning Agent"
        relationship: "Coordinates with"
        interaction_pattern: "Consultative"
        communications:
          receives:
            - "Brand guidelines"
            - "Messaging frameworks"
            - "Positioning updates"
          sends:
            - "Brand visibility metrics"
            - "Branded search insights"
            - "SERP brand presence analysis"

    with_intelligence_layer:
      - agent: "Competitive Intelligence Agent"
        relationship: "Primary data partner"
        interaction_pattern: "Data exchange"
        communications:
          receives:
            - "Competitor strategy updates"
            - "Market positioning data"
            - "New competitor alerts"
          sends:
            - "SEO-specific competitor analysis"
            - "Keyword gap data"
            - "Backlink comparison data"

      - agent: "Market Research Agent"
        relationship: "Collaborates with"
        communications:
          receives:
            - "Customer pain points"
            - "Search intent insights"
            - "ICP research"
          sends:
            - "Search demand data"
            - "Query trend analysis"
            - "Content topic validation"

      - agent: "Trend & Cultural Insight Agent"
        relationship: "Subscribes to"
        communications:
          receives:
            - "Trending topics"
            - "Cultural moments"
            - "Emerging narratives"
          sends:
            - "Search volume for trends"
            - "Trend longevity analysis"

    with_execution_layer:
      - agent: "Content Strategist Agent"
        relationship: "Critical partner"
        interaction_pattern: "Continuous collaboration"
        communications:
          receives:
            - "Content calendar"
            - "Content briefs"
            - "Topic priorities"
          sends:
            - "SEO content briefs"
            - "Keyword assignments"
            - "Optimization requirements"
            - "Content gap opportunities"

      - agent: "Copywriting Agent"
        relationship: "Provides direction to"
        communications:
          receives:
            - "Draft content for review"
            - "Meta copy variants"
          sends:
            - "SEO guidelines"
            - "Keyword targets"
            - "Optimization feedback"
            - "Title and meta templates"

      - agent: "Paid Media Agent"
        relationship: "Synergy partner"
        communications:
          receives:
            - "PPC performance data"
            - "High-converting keywords"
          sends:
            - "Organic keyword opportunities"
            - "Landing page insights"
            - "Organic/paid coordination"

      - agent: "Social Media Agent"
        relationship: "Amplification partner"
        communications:
          receives:
            - "Social engagement data"
            - "Content performance"
          sends:
            - "Content promotion priorities"
            - "Linkable asset alerts"

    with_distribution_layer:
      - agent: "Partnerships Agent"
        relationship: "Link building partner"
        communications:
          receives:
            - "Partnership opportunities"
            - "Outreach results"
          sends:
            - "Link building targets"
            - "Backlink opportunity analysis"
            - "Domain quality assessments"

    with_analytics_layer:
      - agent: "Marketing Analytics Agent"
        relationship: "Data integration"
        communications:
          receives:
            - "Cross-channel attribution"
            - "Customer journey data"
            - "Revenue metrics"
          sends:
            - "SEO performance data"
            - "Organic attribution"
            - "Trend analysis"

      - agent: "Experimentation Agent"
        relationship: "Testing partner"
        communications:
          receives:
            - "Experiment frameworks"
            - "Testing protocols"
          sends:
            - "SEO test hypotheses"
            - "A/B test results"
            - "Impact measurements"

      - agent: "ROI & Budget Agent"
        relationship: "Reports to"
        communications:
          receives:
            - "Budget allocations"
            - "ROI requirements"
          sends:
            - "SEO ROI metrics"
            - "Resource requests"
            - "Cost efficiency analysis"

  # ─────────────────────────────────────────────────────────────────────────────
  # AUTOMATION OPPORTUNITIES
  # ─────────────────────────────────────────────────────────────────────────────

  automation:

    fully_automated:
      - task: "Daily ranking tracking"
        description: "Automatically track keyword positions across all search engines"
        trigger: "Scheduled - 6:00 AM daily"

      - task: "Technical health monitoring"
        description: "Continuous monitoring of site health indicators"
        trigger: "Real-time"

      - task: "Alert generation"
        description: "Generate alerts based on threshold violations"
        trigger: "Event-driven"

      - task: "Standard report generation"
        description: "Generate and distribute scheduled reports"
        trigger: "Scheduled"

      - task: "Backlink monitoring"
        description: "Track new and lost backlinks"
        trigger: "Hourly"

      - task: "Competitor tracking"
        description: "Monitor competitor ranking and content changes"
        trigger: "Daily"

      - task: "Content scoring"
        description: "Score content for SEO quality factors"
        trigger: "On content publish/update"

      - task: "Internal link optimization"
        description: "Identify and implement internal linking opportunities"
        trigger: "Weekly + On new content"

    semi_automated:
      - task: "Meta tag optimization"
        description: "Generate optimized meta tags for review"
        human_in_loop: "Approval before implementation"

      - task: "Content optimization briefs"
        description: "Generate detailed optimization recommendations"
        human_in_loop: "Writer implements changes"

      - task: "Redirect mapping"
        description: "Propose redirect mappings for broken pages"
        human_in_loop: "Approval for bulk implementations"

      - task: "Schema markup generation"
        description: "Generate structured data markup"
        human_in_loop: "Developer implementation"

    recommended_for_automation:
      - task: "Broken link fixing"
        current_state: "Manual"
        automation_benefit: "High volume, low risk"
        complexity: "Medium"

      - task: "Image optimization"
        current_state: "Manual"
        automation_benefit: "Time savings, consistency"
        complexity: "Low"

      - task: "Sitemap updates"
        current_state: "Manual"
        automation_benefit: "Real-time accuracy"
        complexity: "Low"

      - task: "Hreflang implementation"
        current_state: "Manual"
        automation_benefit: "Error reduction"
        complexity: "Medium"

  # ─────────────────────────────────────────────────────────────────────────────
  # LEARNING & ADAPTATION
  # ─────────────────────────────────────────────────────────────────────────────

  learning:

    feedback_loops:
      - loop: "Recommendation effectiveness"
        input: "Implemented recommendations and outcomes"
        learning: "Improve prioritization and impact predictions"

      - loop: "Content optimization success"
        input: "Pre/post optimization performance"
        learning: "Refine optimization guidelines"

      - loop: "Algorithm pattern recognition"
        input: "Ranking changes correlated with updates"
        learning: "Predict and adapt to algorithm changes"

      - loop: "Keyword difficulty accuracy"
        input: "Predicted vs actual ranking difficulty"
        learning: "Improve difficulty scoring model"

    continuous_improvement:
      - area: "Scoring models"
        method: "Regular backtesting against outcomes"
        frequency: "Monthly"

      - area: "Threshold calibration"
        method: "False positive/negative analysis"
        frequency: "Quarterly"

      - area: "Process efficiency"
        method: "Time-motion analysis of workflows"
        frequency: "Quarterly"

  # ─────────────────────────────────────────────────────────────────────────────
  # CONFIGURATION & CUSTOMIZATION
  # ─────────────────────────────────────────────────────────────────────────────

  configuration:

    customizable_parameters:
      - parameter: "Priority keyword list"
        type: "List of keywords with priority levels"

      - parameter: "Competitor list"
        type: "List of competitor domains to track"

      - parameter: "Alert thresholds"
