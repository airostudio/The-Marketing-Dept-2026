# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL SEO MANAGEMENT MODULE
# The Marketing Department 2026 - SEO Agent
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "local-seo-manager"
  name: "Local SEO Intelligence & Management Engine"
  version: "1.0.0"
  category: "local_seo"

  # ═══════════════════════════════════════════════════════════════════════════
  # GOOGLE BUSINESS PROFILE MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  google_business_profile:

    profile_optimization:
      core_elements:
        - element: "Business Name"
          guidelines:
            - "Use official business name"
            - "Avoid keyword stuffing"
            - "Consistent with website and citations"

        - element: "Categories"
          guidelines:
            - "Select most relevant primary category"
            - "Add appropriate secondary categories (up to 9)"
            - "Review category options quarterly"

        - element: "Business Description"
          requirements:
            - "750 character limit"
            - "Include keywords naturally"
            - "Describe services/products"
            - "Include call-to-action"
            - "No promotional language"

        - element: "Address"
          requirements:
            - "Exact match with website/citations"
            - "Include suite/unit if applicable"
            - "Verify accuracy"

        - element: "Phone Number"
          requirements:
            - "Local phone number preferred"
            - "Consistent across all listings"
            - "Trackable if needed"

        - element: "Website URL"
          requirements:
            - "Direct to relevant landing page"
            - "Location page for multi-location"

        - element: "Hours"
          requirements:
            - "Accurate and current"
            - "Special hours for holidays"
            - "Match website hours"

        - element: "Attributes"
          types:
            - "From the business (editable)"
            - "Highlights (accessibility, amenities)"
            - "Service options"
            - "Health & safety"

      media_optimization:
        photos:
          types:
            - type: "Logo"
              specs: "720x720px minimum, square"
            - type: "Cover Photo"
              specs: "1080x608px, 16:9 ratio"
            - type: "Business Photos"
              categories: ["Exterior", "Interior", "Products", "Team", "At work"]
              quantity: "Minimum 10, add regularly"

          best_practices:
            - "High quality, professional images"
            - "Geo-tagged when possible"
            - "Regular uploads (weekly/monthly)"
            - "Seasonal updates"

        videos:
          specs:
            - "30 seconds max"
            - "720p minimum"
            - "Under 75MB"
          types:
            - "Business tour"
            - "Product/service demo"
            - "Team introduction"

      content_features:
        posts:
          types:
            - type: "What's New"
              use: "General updates, news"
              lifespan: "7 days visibility"

            - type: "Events"
              use: "Upcoming events"
              includes: "Date, time, details"

            - type: "Offers"
              use: "Promotions, discounts"
              includes: "Terms, coupon code"

            - type: "Products"
              use: "Featured products"
              includes: "Price, link"

          best_practices:
            - "Post 1-2 times per week"
            - "Include photos/videos"
            - "Add call-to-action"
            - "Track performance"

        qa_management:
          - "Monitor questions regularly"
          - "Respond within 24 hours"
          - "Seed common Q&A"
          - "Flag inappropriate content"

        products_services:
          - "Add all products/services"
          - "Include prices when applicable"
          - "Use categories"
          - "Add descriptions"

    performance_tracking:
      metrics:
        - "Search views"
        - "Maps views"
        - "Website clicks"
        - "Direction requests"
        - "Phone calls"
        - "Photo views"
        - "Discovery vs Direct searches"
        - "Search queries"

      benchmarks:
        - "Month-over-month trends"
        - "Year-over-year comparison"
        - "Industry benchmarks"
        - "Competitor comparison"

  # ═══════════════════════════════════════════════════════════════════════════
  # LOCAL RANK TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  local_rankings:

    tracking_methods:
      - method: "Grid-Based Tracking"
        description: "Track rankings across geographic grid"
        grid_size: "Customizable (1-50 mile radius)"
        points: "9-25 points typical"
        visualization: "Heatmap"

      - method: "Point-Based Tracking"
        description: "Track from specific locations"
        locations: "Custom GPS coordinates"
        use_case: "Specific service areas"

      - method: "City/ZIP Tracking"
        description: "Track by location name"
        locations: "City, ZIP, neighborhood"
        use_case: "Broad area coverage"

    tracked_positions:
      local_pack:
        - "Position 1-3 (visible pack)"
        - "Position 4+ (expanded results)"
        - "Not ranking"

      local_finder:
        - "Extended local results"
        - "Position in full list"

      organic_local:
        - "Standard organic with local intent"

    ranking_factors_monitored:
      prominence:
        - "Review count"
        - "Review rating"
        - "Citation count"
        - "Backlinks to location pages"

      relevance:
        - "Category accuracy"
        - "Keyword optimization"
        - "Content relevance"

      distance:
        - "Proximity to searcher"
        - "Service area settings"

  # ═══════════════════════════════════════════════════════════════════════════
  # CITATION MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  citations:

    citation_audit:
      discovery:
        - "Major data aggregators"
        - "Industry directories"
        - "Local directories"
        - "Social platforms"
        - "Review sites"

      accuracy_check:
        nap_fields:
          - field: "Name"
            matching: "Exact match required"
          - field: "Address"
            matching: "Format variations acceptable"
          - field: "Phone"
            matching: "Exact match required"
          - field: "Website"
            matching: "Protocol variations acceptable"

      issues_detected:
        - "Incorrect NAP"
        - "Outdated information"
        - "Duplicate listings"
        - "Missing listings"
        - "Unclaimed profiles"

    citation_building:
      priority_sources:
        tier_1:
          - "Google Business Profile"
          - "Apple Maps"
          - "Bing Places"
          - "Facebook"
          - "Yelp"

        tier_2:
          - "Data aggregators (Foursquare, Factual, Infogroup, Localeze)"
          - "Industry-specific directories"
          - "Chamber of Commerce"

        tier_3:
          - "Local directories"
          - "Niche directories"
          - "Blog mentions"

      submission_tracking:
        - "Submission date"
        - "Approval status"
        - "Listing URL"
        - "Last verified date"

    consistency_score:
      calculation: "Accurate citations / Total citations * 100"
      target: "> 95%"
      monitoring: "Monthly audit"

  # ═══════════════════════════════════════════════════════════════════════════
  # REVIEW MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  reviews:

    review_monitoring:
      platforms:
        - "Google"
        - "Yelp"
        - "Facebook"
        - "Industry-specific sites"
        - "BBB"
        - "Trustpilot"

      tracked_metrics:
        - "Total review count"
        - "Average rating"
        - "Review velocity"
        - "Sentiment analysis"
        - "Response rate"
        - "Response time"

    review_analysis:
      sentiment_analysis:
        - "Positive themes"
        - "Negative themes"
        - "Common mentions"
        - "Service/product feedback"
        - "Staff mentions"

      competitive_comparison:
        - "Rating vs competitors"
        - "Review count vs competitors"
        - "Response rate comparison"
        - "Sentiment comparison"

    review_response:
      best_practices:
        positive_reviews:
          - "Thank the reviewer"
          - "Personalize response"
          - "Mention specifics"
          - "Reinforce positive points"

        negative_reviews:
          - "Respond promptly (24-48 hours)"
          - "Apologize and empathize"
          - "Take conversation offline"
          - "Offer resolution"
          - "Follow up"

      response_templates:
        - "Thank you template"
        - "Apology template"
        - "Issue resolution template"
        - "Follow-up template"

    review_generation:
      strategies:
        - "Post-service email requests"
        - "SMS review requests"
        - "In-store signage"
        - "Receipt prompts"
        - "Loyalty program integration"

      compliance:
        - "No incentivized reviews"
        - "Platform terms compliance"
        - "FTC guidelines adherence"

  # ═══════════════════════════════════════════════════════════════════════════
  # LOCAL CONTENT OPTIMIZATION
  # ═══════════════════════════════════════════════════════════════════════════

  local_content:

    location_pages:
      structure:
        - "Unique content per location"
        - "NAP prominently displayed"
        - "Embedded Google Map"
        - "Schema markup (LocalBusiness)"
        - "Service area information"
        - "Hours of operation"
        - "Photos of location"
        - "Staff information"
        - "Reviews/testimonials"
        - "Directions and parking"

      seo_elements:
        - "Location in title tag"
        - "Location in H1"
        - "Location in URL"
        - "Location in meta description"
        - "Local landmarks/areas mentioned"

    service_area_pages:
      for: "Businesses serving multiple areas"
      structure:
        - "Unique content per area"
        - "Area-specific information"
        - "Service details for area"
        - "Customer testimonials from area"

    local_blog_content:
      topics:
        - "Local events"
        - "Community involvement"
        - "Local news relevant to business"
        - "Local guides and tips"
        - "Case studies from local clients"

  # ═══════════════════════════════════════════════════════════════════════════
  # MULTI-LOCATION MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  multi_location:

    organization:
      hierarchy:
        - "Brand level"
        - "Region level"
        - "Location level"

      management_features:
        - "Bulk updates"
        - "Template management"
        - "Role-based access"
        - "Approval workflows"

    consistency:
      brand_elements:
        - "Logo usage"
        - "Description templates"
        - "Category consistency"
        - "Photo standards"

      local_elements:
        - "Unique descriptions"
        - "Local photos"
        - "Location-specific hours"
        - "Staff information"

    performance_comparison:
      metrics:
        - "Per-location visibility"
        - "Per-location reviews"
        - "Per-location rankings"
        - "Per-location engagement"

      benchmarking:
        - "Top performing locations"
        - "Underperforming locations"
        - "Best practices sharing"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    reports:
      - report: "Local SEO Health Report"
        frequency: "Monthly"
        contents:
          - "GBP performance summary"
          - "Local ranking overview"
          - "Citation health"
          - "Review summary"
          - "Recommendations"

      - report: "Review Performance Report"
        frequency: "Weekly"
        contents:
          - "New reviews"
          - "Rating trends"
          - "Response metrics"
          - "Sentiment analysis"

      - report: "Multi-Location Scorecard"
        frequency: "Monthly"
        for: "Multi-location businesses"
        contents:
          - "Per-location metrics"
          - "Comparative analysis"
          - "Best performers"
          - "Action items"

    dashboards:
      - dashboard: "Local SEO Overview"
        widgets:
          - "GBP insights summary"
          - "Local pack rankings map"
          - "Review metrics"
          - "Citation health score"

      - dashboard: "Review Command Center"
        widgets:
          - "Recent reviews"
          - "Pending responses"
          - "Rating trends"
          - "Sentiment breakdown"

    alerts:
      - "New review received"
      - "Negative review (1-2 stars)"
      - "GBP listing suspended"
      - "Citation inconsistency detected"
      - "Competitor outranks in local pack"
      - "Ranking position drop"
