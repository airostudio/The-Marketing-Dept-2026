# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT STRATEGY AGENT - CONTENT TYPE BENCHMARKS
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════
#
# Performance benchmarks and requirements by content type.
#
# ═══════════════════════════════════════════════════════════════════════════════

content_type_benchmarks:
  version: "1.0.0"
  last_updated: "2026-01-21"

  # ═══════════════════════════════════════════════════════════════════════════
  # BLOG CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  blog_post:
    name: "Blog Post"
    description: "Standard blog articles covering topics in depth"

    specifications:
      word_count:
        minimum: 1200
        target: 1800
        maximum: 3000

      structure:
        h1: 1
        h2_minimum: 3
        h2_maximum: 8
        h3_optional: true

      media:
        featured_image: "required"
        inline_images: "recommended (1 per 500 words)"
        video: "optional"

    performance_benchmarks:
      traffic:
        good: 500
        excellent: 2000
        exceptional: 10000
        unit: "monthly_sessions"

      engagement:
        time_on_page:
          good: "2:00"
          excellent: "4:00"
          format: "mm:ss"
        bounce_rate:
          good: 65
          excellent: 50
          unit: "percent"
        scroll_depth_50:
          good: 60
          excellent: 80
          unit: "percent"

      seo:
        rankings_top_10:
          good: 30
          excellent: 60
          unit: "percent_of_targets"

      conversion:
        rate:
          good: 1.0
          excellent: 2.5
          unit: "percent"

    production:
      typical_effort: "medium"
      estimated_hours: 6
      review_rounds: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # PILLAR CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  pillar_page:
    name: "Pillar Page"
    description: "Comprehensive hub content covering topic extensively"

    specifications:
      word_count:
        minimum: 4000
        target: 6000
        maximum: 12000

      structure:
        h1: 1
        h2_minimum: 8
        h2_maximum: 15
        h3_recommended: true
        table_of_contents: "required"

      media:
        featured_image: "required"
        inline_images: "required (1 per 400 words)"
        infographic: "recommended"
        video: "recommended"
        interactive_elements: "optional"

    performance_benchmarks:
      traffic:
        good: 2000
        excellent: 8000
        exceptional: 30000
        unit: "monthly_sessions"

      engagement:
        time_on_page:
          good: "5:00"
          excellent: "8:00"
        bounce_rate:
          good: 50
          excellent: 35
        scroll_depth_50:
          good: 50
          excellent: 70

      seo:
        rankings_top_10:
          good: 50
          excellent: 80

      conversion:
        rate:
          good: 2.0
          excellent: 4.0

    production:
      typical_effort: "high"
      estimated_hours: 25
      review_rounds: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # CASE STUDY
  # ═══════════════════════════════════════════════════════════════════════════

  case_study:
    name: "Case Study"
    description: "Customer success story with measurable outcomes"

    specifications:
      word_count:
        minimum: 1000
        target: 1500
        maximum: 2500

      structure:
        sections:
          - "Overview/Summary"
          - "Challenge"
          - "Solution"
          - "Results"
          - "Testimonial"
        h2_minimum: 4

      media:
        featured_image: "required"
        customer_logo: "required"
        data_visualizations: "required"
        video_testimonial: "recommended"

    performance_benchmarks:
      traffic:
        good: 200
        excellent: 800
        unit: "monthly_sessions"

      engagement:
        time_on_page:
          good: "3:00"
          excellent: "5:00"
        bounce_rate:
          good: 55
          excellent: 40

      conversion:
        rate:
          good: 3.0
          excellent: 6.0
        influenced_pipeline:
          tracking: true

    production:
      typical_effort: "medium-high"
      estimated_hours: 12
      requires: ["customer_interview", "data_collection"]

  # ═══════════════════════════════════════════════════════════════════════════
  # LANDING PAGE
  # ═══════════════════════════════════════════════════════════════════════════

  landing_page:
    name: "Landing Page"
    description: "Conversion-focused page with specific CTA"

    specifications:
      word_count:
        minimum: 300
        target: 600
        maximum: 1500

      structure:
        hero_section: "required"
        value_proposition: "required"
        social_proof: "required"
        cta_count: "2-4"

      media:
        hero_image_video: "required"
        supporting_visuals: "required"
        form: "typically_required"

    performance_benchmarks:
      traffic:
        context: "Varies by campaign"

      engagement:
        time_on_page:
          good: "1:30"
          excellent: "2:30"
        bounce_rate:
          good: 45
          excellent: 30

      conversion:
        rate:
          good: 5.0
          excellent: 12.0
          exceptional: 20.0

    production:
      typical_effort: "medium"
      estimated_hours: 8
      requires: ["design_collaboration", "a_b_testing"]

  # ═══════════════════════════════════════════════════════════════════════════
  # GUIDE/EBOOK
  # ═══════════════════════════════════════════════════════════════════════════

  guide_ebook:
    name: "Guide/eBook"
    description: "Downloadable in-depth resource"

    specifications:
      word_count:
        minimum: 3000
        target: 6000
        maximum: 15000

      structure:
        chapters: "5-10"
        table_of_contents: "required"
        executive_summary: "recommended"

      media:
        cover_design: "required"
        chapter_graphics: "required"
        data_visualizations: "recommended"

      format:
        primary: "PDF"
        optional: ["Web version", "Interactive"]

    performance_benchmarks:
      downloads:
        good: 100
        excellent: 500
        exceptional: 2000
        unit: "monthly_downloads"

      conversion:
        download_rate:
          good: 5.0
          excellent: 15.0
        lead_quality:
          tracking: true

    production:
      typical_effort: "high"
      estimated_hours: 40
      requires: ["design", "multiple_sme"]

  # ═══════════════════════════════════════════════════════════════════════════
  # HOW-TO CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  how_to:
    name: "How-To Guide"
    description: "Step-by-step instructional content"

    specifications:
      word_count:
        minimum: 800
        target: 1500
        maximum: 3000

      structure:
        numbered_steps: "required"
        prerequisites: "recommended"
        troubleshooting: "recommended"

      media:
        screenshots: "required_if_applicable"
        video_walkthrough: "recommended"

    performance_benchmarks:
      traffic:
        good: 800
        excellent: 3000
        unit: "monthly_sessions"

      engagement:
        time_on_page:
          good: "3:00"
          excellent: "5:00"
        completion_rate:
          tracking: true

      seo:
        featured_snippet_capture:
          target: 40
          unit: "percent"

    production:
      typical_effort: "medium"
      estimated_hours: 8

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPARISON CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  comparison:
    name: "Comparison Content"
    description: "Product or solution comparisons"

    specifications:
      word_count:
        minimum: 1500
        target: 2500
        maximum: 4000

      structure:
        comparison_table: "required"
        pros_cons: "required"
        recommendation: "recommended"

      media:
        comparison_table_graphic: "required"
        product_images: "required"

    performance_benchmarks:
      traffic:
        good: 500
        excellent: 2000

      engagement:
        time_on_page:
          good: "4:00"
          excellent: "6:00"

      conversion:
        rate:
          good: 3.0
          excellent: 6.0
          context: "High intent content"

    production:
      typical_effort: "medium-high"
      estimated_hours: 12
      requires: ["research", "fair_comparison"]

  # ═══════════════════════════════════════════════════════════════════════════
  # VIDEO CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  video:
    name: "Video Content"
    description: "Video-first content pieces"

    specifications:
      duration:
        short: "1-3 minutes"
        standard: "5-10 minutes"
        long_form: "15-30 minutes"

      requirements:
        script: "required"
        captions: "required"
        thumbnail: "required"

    performance_benchmarks:
      views:
        good: 500
        excellent: 5000
        exceptional: 50000
        unit: "total_views"

      engagement:
        average_view_duration:
          good: 40
          excellent: 60
          unit: "percent"
        like_ratio:
          good: 90
          excellent: 95

    production:
      typical_effort: "high"
      estimated_hours: 20
      requires: ["script", "recording", "editing"]

  # ═══════════════════════════════════════════════════════════════════════════
  # SOCIAL CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  social_post:
    name: "Social Media Post"
    description: "Platform-specific social content"

    specifications:
      linkedin:
        text_max: 3000
        ideal: "1200-1500"
        hashtags: "3-5"

      twitter:
        text_max: 280
        thread_max: 10

      instagram:
        caption_max: 2200
        hashtags: "20-30"

    performance_benchmarks:
      engagement_rate:
        linkedin:
          good: 2.0
          excellent: 5.0
        twitter:
          good: 1.0
          excellent: 3.0
        instagram:
          good: 3.0
          excellent: 6.0
        unit: "percent"

    production:
      typical_effort: "low"
      estimated_hours: 0.5
      batch_production: "recommended"
