# ═══════════════════════════════════════════════════════════════════════════════
# COMPETITIVE INTELLIGENCE AGENT WORKFLOWS
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

workflows:
  version: "1.0.0"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 1: CONTINUOUS MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  continuous_monitoring:
    name: "Competitive Monitoring Workflow"
    description: "Ongoing surveillance of competitive landscape"
    trigger: "Continuous"

    real_time_monitoring:
      frequency: "Continuous"
      actions:
        - "Monitor news feeds for competitor mentions"
        - "Track social media activity"
        - "Alert on significant developments"
      outputs:
        - "Real-time alerts"
      automated: true

    daily_monitoring:
      time: "06:00"
      actions:
        - "Review overnight news and alerts"
        - "Check competitor website changes"
        - "Review social media activity"
        - "Process job posting updates"
        - "Generate daily intelligence brief"
      outputs:
        - "Daily intelligence brief"
      automated: true

    weekly_review:
      time: "Monday 09:00"
      actions:
        - "Compile week's intelligence"
        - "Assess competitive activity patterns"
        - "Update threat assessments"
        - "Review monitoring coverage"
        - "Generate weekly summary"
      outputs:
        - "Weekly competitive summary"

    monthly_assessment:
      time: "First Monday of month"
      actions:
        - "Comprehensive competitive review"
        - "Update competitor profiles"
        - "Refresh battlecards"
        - "Analyze trends"
        - "Generate monthly report"
      outputs:
        - "Monthly competitive landscape report"
        - "Updated battlecards"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 2: THREAT RESPONSE
  # ═══════════════════════════════════════════════════════════════════════════

  threat_response:
    name: "Competitive Threat Response Protocol"
    description: "Rapid response to competitive threats"
    trigger:
      - "Critical threat detected"
      - "Competitor major announcement"
      - "Significant market development"
    priority: "Critical"

    steps:
      - step: 1
        name: "Alert & Triage"
        time_limit: "30 minutes"
        actions:
          - "Confirm threat validity"
          - "Assess initial severity"
          - "Classify threat type"
          - "Notify relevant stakeholders"
        outputs:
          - "Initial alert with classification"

      - step: 2
        name: "Rapid Assessment"
        time_limit: "2 hours"
        actions:
          - "Gather comprehensive information"
          - "Analyze competitive implications"
          - "Assess impact on our position"
          - "Score threat level"
        outputs:
          - "Threat assessment brief"

      - step: 3
        name: "Response Development"
        time_limit: "24 hours"
        actions:
          - "Develop response options"
          - "Draft stakeholder communications"
          - "Prepare sales team briefing"
          - "Create talking points"
        outputs:
          - "Response recommendation"
          - "Sales enablement materials"
        collaboration: "CMO Agent, Brand Agent, affected teams"

      - step: 4
        name: "Response Execution"
        actions:
          - "Distribute sales communications"
          - "Update battlecards if needed"
          - "Brief customer-facing teams"
          - "Implement defensive measures"
        outputs:
          - "Response deployed"

      - step: 5
        name: "Monitoring & Adjustment"
        actions:
          - "Track response effectiveness"
          - "Monitor competitor follow-up"
          - "Adjust tactics as needed"
          - "Document learnings"
        outputs:
          - "Response effectiveness report"

    escalation:
      critical: "CMO Agent immediately"
      high: "CMO Agent within 24 hours"
      medium: "Weekly summary"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 3: COMPETITOR PROFILE UPDATE
  # ═══════════════════════════════════════════════════════════════════════════

  competitor_profile_update:
    name: "Competitor Profile Refresh"
    description: "Systematic update of competitor profiles"
    trigger:
      - "Scheduled refresh"
      - "Significant competitor event"
      - "Profile age threshold"

    steps:
      - step: 1
        name: "Information Gathering"
        actions:
          - "Review all monitoring data since last update"
          - "Check for company changes"
          - "Review product updates"
          - "Gather pricing intelligence"
          - "Collect win/loss feedback"
        outputs:
          - "Research compilation"

      - step: 2
        name: "Profile Update"
        actions:
          - "Update company information"
          - "Refresh product/feature analysis"
          - "Update pricing information"
          - "Revise SWOT analysis"
          - "Update competitive positioning"
        outputs:
          - "Updated competitor profile"

      - step: 3
        name: "Validation"
        actions:
          - "Cross-reference sources"
          - "Verify key facts"
          - "Review with subject matter experts"
          - "Flag low-confidence items"
        outputs:
          - "Validated profile"

      - step: 4
        name: "Distribution"
        actions:
          - "Publish updated profile"
          - "Notify stakeholders of changes"
          - "Archive previous version"
        outputs:
          - "Profile published"

    schedule:
      tier_1_competitors: "Monthly"
      tier_2_competitors: "Quarterly"
      tier_3_competitors: "Semi-annually"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 4: BATTLECARD DEVELOPMENT
  # ═══════════════════════════════════════════════════════════════════════════

  battlecard_development:
    name: "Battlecard Creation & Update"
    description: "Develop and maintain sales battlecards"
    trigger:
      - "New competitor identified"
      - "Scheduled battlecard refresh"
      - "Major competitive change"

    steps:
      - step: 1
        name: "Research & Analysis"
        actions:
          - "Review competitor profile"
          - "Analyze win/loss data"
          - "Interview sales team"
          - "Gather product comparison data"
        outputs:
          - "Research synthesis"

      - step: 2
        name: "Win Theme Development"
        actions:
          - "Identify key differentiators"
          - "Develop win theme statements"
          - "Gather proof points"
          - "Validate with customer evidence"
        outputs:
          - "Win themes document"

      - step: 3
        name: "Content Creation"
        actions:
          - "Draft all battlecard sections"
          - "Create objection responses"
          - "Develop landmine questions"
          - "Build comparison tables"
        outputs:
          - "Draft battlecard"

      - step: 4
        name: "Review & Refinement"
        actions:
          - "Sales team review"
          - "Product marketing review"
          - "Accuracy verification"
          - "Incorporate feedback"
        outputs:
          - "Refined battlecard"

      - step: 5
        name: "Publication & Enablement"
        actions:
          - "Format for distribution"
          - "Publish to enablement platform"
          - "Announce to sales team"
          - "Conduct enablement session"
        outputs:
          - "Published battlecard"
          - "Training completed"

    maintenance:
      review_frequency: "Monthly content check"
      full_refresh: "Quarterly"
      trigger_updates: "Within 48 hours of major change"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 5: WIN/LOSS ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  win_loss_analysis:
    name: "Win/Loss Analysis Program"
    description: "Systematic analysis of competitive wins and losses"
    trigger: "Continuous (deal-based)"

    deal_level:
      - step: 1
        name: "Deal Identification"
        actions:
          - "Identify closed competitive deals"
          - "Prioritize for analysis"
          - "Schedule interviews"
        criteria:
          - "Strategic deals"
          - "Large deal size"
          - "Key competitors"
          - "Surprising outcomes"

      - step: 2
        name: "Interview Execution"
        timing: "Within 2-4 weeks of close"
        actions:
          - "Conduct buyer interviews"
          - "Interview sales team"
          - "Document findings"
        outputs:
          - "Interview notes"

      - step: 3
        name: "Analysis"
        actions:
          - "Analyze key themes"
          - "Identify patterns"
          - "Extract competitive insights"
          - "Develop recommendations"
        outputs:
          - "Deal analysis summary"

    aggregate_level:
      frequency: "Quarterly"
      actions:
        - "Aggregate all deal analyses"
        - "Calculate win rates by competitor"
        - "Identify patterns and trends"
        - "Develop strategic recommendations"
      outputs:
        - "Quarterly win/loss report"
        - "Competitive recommendations"

    insights_application:
      - "Update battlecards"
      - "Refine win themes"
      - "Inform product feedback"
      - "Enhance sales training"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 6: MARKET LANDSCAPE REVIEW
  # ═══════════════════════════════════════════════════════════════════════════

  market_landscape_review:
    name: "Quarterly Market Landscape Review"
    description: "Comprehensive market and competitive assessment"
    trigger: "Quarterly (first week of quarter)"

    steps:
      - step: 1
        name: "Data Compilation"
        actions:
          - "Gather all quarter's intelligence"
          - "Compile market data"
          - "Aggregate competitive activity"
          - "Review analyst reports"
        outputs:
          - "Quarter data package"

      - step: 2
        name: "Market Analysis"
        actions:
          - "Assess market size and growth"
          - "Analyze market trends"
          - "Evaluate segment dynamics"
          - "Review industry developments"
        outputs:
          - "Market analysis section"

      - step: 3
        name: "Competitive Assessment"
        actions:
          - "Review all competitor activity"
          - "Update positioning maps"
          - "Assess competitive dynamics"
          - "Identify shifts and trends"
        outputs:
          - "Competitive assessment section"

      - step: 4
        name: "Strategic Implications"
        actions:
          - "Identify key insights"
          - "Assess strategic implications"
          - "Develop recommendations"
          - "Highlight opportunities/threats"
        outputs:
          - "Strategic recommendations"

      - step: 5
        name: "Presentation"
        actions:
          - "Compile full report"
          - "Create executive summary"
          - "Present to CMO Agent"
          - "Brief leadership"
        outputs:
          - "Quarterly landscape review"
          - "Executive presentation"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 7: AD-HOC INTELLIGENCE REQUEST
  # ═══════════════════════════════════════════════════════════════════════════

  adhoc_intelligence_request:
    name: "Ad-Hoc Intelligence Request"
    description: "Process for handling intelligence requests"
    trigger: "Request received"

    steps:
      - step: 1
        name: "Request Intake"
        time_limit: "4 hours"
        actions:
          - "Receive and log request"
          - "Clarify requirements"
          - "Assess scope and priority"
          - "Confirm timeline"
        outputs:
          - "Confirmed request scope"

      - step: 2
        name: "Research"
        time_limit: "Varies by scope"
        actions:
          - "Gather relevant intelligence"
          - "Conduct additional research"
          - "Analyze findings"
          - "Synthesize insights"
        outputs:
          - "Research findings"

      - step: 3
        name: "Deliverable Creation"
        actions:
          - "Create requested deliverable"
          - "Review for accuracy"
          - "Format appropriately"
        outputs:
          - "Intelligence deliverable"

      - step: 4
        name: "Delivery"
        actions:
          - "Deliver to requestor"
          - "Offer to discuss/clarify"
          - "Log for future reference"
        outputs:
          - "Request fulfilled"

    slas:
      urgent: "24 hours"
      standard: "1 week"
      comprehensive: "2-3 weeks"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 8: NEW COMPETITOR TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  new_competitor_tracking:
    name: "New Competitor Identification & Tracking"
    description: "Process for identifying and tracking new competitors"
    trigger:
      - "New competitor identified"
      - "Market entrant detected"
      - "Adjacent company expanding"

    steps:
      - step: 1
        name: "Initial Assessment"
        time_limit: "48 hours"
        actions:
          - "Gather basic company information"
          - "Assess competitive relevance"
          - "Determine monitoring priority"
          - "Assign competitive tier"
        outputs:
          - "Initial assessment brief"

      - step: 2
        name: "Monitoring Setup"
        actions:
          - "Configure monitoring tools"
          - "Add to tracking systems"
          - "Set up alerts"
          - "Establish data collection"
        outputs:
          - "Monitoring active"

      - step: 3
        name: "Profile Development"
        time_limit: "2 weeks"
        actions:
          - "Develop initial competitor profile"
          - "Analyze product/offering"
          - "Assess go-to-market approach"
          - "Evaluate threat level"
        outputs:
          - "Initial competitor profile"

      - step: 4
        name: "Stakeholder Notification"
        actions:
          - "Brief CMO Agent"
          - "Notify relevant teams"
          - "Add to competitive landscape"
          - "Begin battlecard if warranted"
        outputs:
          - "Stakeholders informed"

      - step: 5
        name: "Ongoing Tracking"
        actions:
          - "Monitor per assigned tier"
          - "Update profile as intelligence gathered"
          - "Reassess tier periodically"
        outputs:
          - "Continuous tracking"
