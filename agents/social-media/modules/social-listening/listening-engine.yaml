# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL MEDIA AGENT - SOCIAL LISTENING MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "social-listening"
  name: "Intelligent Social Listening Engine"
  version: "1.0.0"
  category: "intelligence_monitoring"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  brand_monitoring:

    # ─────────────────────────────────────────────────────────────────────────
    # Mention Tracking
    # ─────────────────────────────────────────────────────────────────────────

    mention_tracking:
      tracked_elements:
        brand_mentions:
          - "Brand name"
          - "Brand name variations/misspellings"
          - "Brand hashtags"
          - "Brand handles/usernames"
          - "Brand slogans"

        product_mentions:
          - "Product names"
          - "Product nicknames"
          - "Product hashtags"
          - "SKU references"

        people_mentions:
          - "CEO/Executive names"
          - "Spokesperson names"
          - "Employee mentions (optional)"

        campaign_mentions:
          - "Campaign hashtags"
          - "Campaign slogans"
          - "Campaign-specific terms"

      platforms_monitored:
        primary:
          - "Twitter/X"
          - "Instagram"
          - "Facebook"
          - "LinkedIn"
          - "TikTok"
          - "YouTube"

        secondary:
          - "Reddit"
          - "Forums"
          - "Blogs"
          - "News sites"
          - "Review sites"

    # ─────────────────────────────────────────────────────────────────────────
    # Sentiment Analysis
    # ─────────────────────────────────────────────────────────────────────────

    sentiment_analysis:
      classification:
        categories:
          - "Positive"
          - "Negative"
          - "Neutral"
          - "Mixed"

        confidence_scoring:
          scale: "0-100"
          threshold_for_action: 80

      granularity:
        - "Overall brand sentiment"
        - "Sentiment by product"
        - "Sentiment by topic"
        - "Sentiment by platform"
        - "Sentiment by demographic"

      emotion_detection:
        emotions:
          - "Joy/Excitement"
          - "Trust/Confidence"
          - "Surprise"
          - "Frustration/Anger"
          - "Disappointment"
          - "Confusion"
          - "Fear/Concern"

      trend_analysis:
        - "Sentiment over time"
        - "Sentiment vs competitors"
        - "Sentiment by campaign"
        - "Sentiment correlation with events"

    # ─────────────────────────────────────────────────────────────────────────
    # Volume & Reach
    # ─────────────────────────────────────────────────────────────────────────

    volume_metrics:
      tracked_metrics:
        - "Total mentions"
        - "Unique authors"
        - "Potential reach"
        - "Impressions estimate"
        - "Engagement on mentions"

      trending_detection:
        - "Volume spike alerts"
        - "Viral content detection"
        - "Unusual activity patterns"
        - "Comparison to baseline"

      share_of_voice:
        calculation: "Brand mentions / (Brand + Competitor mentions)"
        benchmarks:
          - "Industry average"
          - "Top competitor"
          - "Historical baseline"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE INTELLIGENCE
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_intelligence:

    # ─────────────────────────────────────────────────────────────────────────
    # Competitor Monitoring
    # ─────────────────────────────────────────────────────────────────────────

    competitor_monitoring:
      tracked_competitors:
        primary: "Top 3-5 direct competitors"
        secondary: "5-10 adjacent competitors"
        emerging: "New market entrants"

      monitoring_dimensions:
        content_tracking:
          - "Posting frequency"
          - "Content types"
          - "Messaging themes"
          - "Campaign launches"
          - "New product announcements"

        engagement_tracking:
          - "Engagement rates"
          - "Follower growth"
          - "Comment sentiment"
          - "Share of voice"

        advertising_tracking:
          - "Ad frequency (via ad libraries)"
          - "Ad messaging"
          - "Promoted content"

    # ─────────────────────────────────────────────────────────────────────────
    # Competitive Benchmarking
    # ─────────────────────────────────────────────────────────────────────────

    benchmarking:
      metrics_compared:
        audience:
          - "Follower count"
          - "Follower growth rate"
          - "Audience demographics"
          - "Audience quality"

        engagement:
          - "Average engagement rate"
          - "Comments per post"
          - "Shares per post"
          - "Video views"

        content:
          - "Posting frequency"
          - "Content mix"
          - "Top performing content"
          - "Video content ratio"

        sentiment:
          - "Brand sentiment"
          - "Sentiment trends"
          - "Issue frequency"

      benchmarking_reports:
        - report: "Weekly Competitive Snapshot"
          contents: ["Key metric changes", "Notable activity"]

        - report: "Monthly Competitive Analysis"
          contents: ["Full benchmarking", "Trend analysis", "Recommendations"]

        - report: "Quarterly Strategic Review"
          contents: ["Market position", "Opportunity analysis", "Strategy recommendations"]

  # ═══════════════════════════════════════════════════════════════════════════
  # MARKET INTELLIGENCE
  # ═══════════════════════════════════════════════════════════════════════════

  market_intelligence:

    # ─────────────────────────────────────────────────────────────────────────
    # Industry Monitoring
    # ─────────────────────────────────────────────────────────────────────────

    industry_monitoring:
      tracked_topics:
        - "Industry keywords"
        - "Industry hashtags"
        - "Industry events"
        - "Regulatory changes"
        - "Technology trends"

      sources:
        - "Industry influencers"
        - "Trade publications"
        - "Industry associations"
        - "Conference discussions"
        - "Analyst commentary"

    # ─────────────────────────────────────────────────────────────────────────
    # Trend Detection
    # ─────────────────────────────────────────────────────────────────────────

    trend_detection:
      trend_types:
        emerging_topics:
          description: "New conversation topics gaining traction"
          detection_method: "Volume acceleration analysis"
          alert_threshold: "3x normal volume"

        viral_content:
          description: "Content spreading rapidly"
          detection_method: "Engagement velocity tracking"
          alert_threshold: "10x normal engagement rate"

        hashtag_trends:
          description: "Trending hashtags relevant to brand"
          detection_method: "Hashtag monitoring"
          action: "Assess relevance and opportunity"

        cultural_moments:
          description: "Cultural events/conversations"
          detection_method: "Broad social monitoring"
          action: "Real-time opportunity assessment"

      trend_analysis:
        - "Trend lifecycle stage"
        - "Relevance to brand"
        - "Participation opportunity"
        - "Risk assessment"
        - "Competitor participation"

    # ─────────────────────────────────────────────────────────────────────────
    # Consumer Insights
    # ─────────────────────────────────────────────────────────────────────────

    consumer_insights:
      insight_categories:
        needs_wants:
          - "Product requests"
          - "Feature requests"
          - "Unmet needs"
          - "Wish lists"

        pain_points:
          - "Complaints"
          - "Frustrations"
          - "Problems mentioned"
          - "Negative experiences"

        preferences:
          - "Liked features"
          - "Praised aspects"
          - "Purchase drivers"
          - "Brand loyalty factors"

        behaviors:
          - "Usage patterns"
          - "Purchase occasions"
          - "Decision factors"
          - "Alternative consideration"

      insight_mining:
        methods:
          - "Topic extraction"
          - "Theme clustering"
          - "Keyword analysis"
          - "Conversation analysis"

        outputs:
          - "Insight reports"
          - "Product feedback summary"
          - "Content ideas"
          - "Campaign opportunities"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFLUENCER INTELLIGENCE
  # ═══════════════════════════════════════════════════════════════════════════

  influencer_intelligence:

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer Discovery
    # ─────────────────────────────────────────────────────────────────────────

    influencer_discovery:
      discovery_methods:
        - "Brand mention analysis"
        - "Industry hashtag tracking"
        - "Competitor influencer analysis"
        - "Content topic analysis"
        - "Audience overlap analysis"

      filtering_criteria:
        quantitative:
          - "Follower count range"
          - "Engagement rate minimum"
          - "Post frequency"
          - "Growth rate"

        qualitative:
          - "Content quality"
          - "Brand alignment"
          - "Audience authenticity"
          - "Values alignment"

    # ─────────────────────────────────────────────────────────────────────────
    # Influencer Analysis
    # ─────────────────────────────────────────────────────────────────────────

    influencer_analysis:
      metrics_analyzed:
        reach_metrics:
          - "Follower count"
          - "Impressions"
          - "Potential reach"

        engagement_metrics:
          - "Engagement rate"
          - "Comments ratio"
          - "Share rate"
          - "Save rate"

        audience_metrics:
          - "Audience demographics"
          - "Audience interests"
          - "Audience authenticity"
          - "Audience overlap with brand"

        content_metrics:
          - "Content quality score"
          - "Brand mention history"
          - "Content categories"
          - "Posting consistency"

      authenticity_scoring:
        factors:
          - "Follower quality"
          - "Engagement authenticity"
          - "Growth patterns"
          - "Comment quality"
          - "Bot follower percentage"

  # ═══════════════════════════════════════════════════════════════════════════
  # CRISIS DETECTION
  # ═══════════════════════════════════════════════════════════════════════════

  crisis_detection:

    # ─────────────────────────────────────────────────────────────────────────
    # Early Warning System
    # ─────────────────────────────────────────────────────────────────────────

    early_warning:
      triggers:
        volume_based:
          - trigger: "Mention volume spike"
            threshold: "3x normal volume in 1 hour"
            action: "Alert + investigation"

          - trigger: "Negative mention spike"
            threshold: "2x normal negative volume"
            action: "Immediate escalation"

        sentiment_based:
          - trigger: "Sentiment shift"
            threshold: "20% shift to negative in 24h"
            action: "Investigation + alert"

          - trigger: "Viral negative content"
            threshold: "Single post with 10x normal engagement"
            action: "Immediate escalation"

        topic_based:
          - trigger: "Crisis keyword detected"
            keywords: ["lawsuit", "scandal", "recall", "investigation"]
            action: "Immediate review"

          - trigger: "Executive mention + negative"
            action: "Escalation to PR"

    # ─────────────────────────────────────────────────────────────────────────
    # Crisis Response Support
    # ─────────────────────────────────────────────────────────────────────────

    crisis_support:
      monitoring_mode:
        name: "Crisis Monitoring Mode"
        features:
          - "Real-time dashboard"
          - "Increased monitoring frequency"
          - "Expanded keyword tracking"
          - "Influencer activity tracking"
          - "Media coverage tracking"

      reporting:
        - "Real-time situation updates"
        - "Sentiment trajectory"
        - "Key voices analysis"
        - "Response effectiveness"
        - "Resolution indicators"

      escalation_matrix:
        - level: "Level 1 - Monitoring"
          criteria: "Minor uptick, isolated complaints"
          response: "Monitor, standard response"

        - level: "Level 2 - Attention"
          criteria: "Growing issue, increasing volume"
          response: "Team alert, response strategy"

        - level: "Level 3 - Action"
          criteria: "Significant issue, media attention"
          response: "Crisis team activation"

        - level: "Level 4 - Emergency"
          criteria: "Major crisis, viral negative content"
          response: "Executive involvement, all hands"

  # ═══════════════════════════════════════════════════════════════════════════
  # REPORTING & INSIGHTS
  # ═══════════════════════════════════════════════════════════════════════════

  reporting:

    standard_reports:
      - report: "Daily Listening Summary"
        contents:
          - "Mention volume"
          - "Sentiment snapshot"
          - "Notable mentions"
          - "Alerts"

      - report: "Weekly Listening Report"
        contents:
          - "Volume trends"
          - "Sentiment analysis"
          - "Top content"
          - "Competitive snapshot"
          - "Key insights"

      - report: "Monthly Listening Analysis"
        contents:
          - "Comprehensive metrics"
          - "Trend analysis"
          - "Consumer insights"
          - "Competitive analysis"
          - "Recommendations"

    custom_reports:
      - "Campaign listening report"
      - "Product launch monitoring"
      - "Event tracking report"
      - "Crisis post-mortem"

    dashboards:
      - "Real-time mention feed"
      - "Sentiment dashboard"
      - "Competitive dashboard"
      - "Trend dashboard"
      - "Crisis monitoring dashboard"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & INTEGRATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    to_content_strategy_agent:
      - "Trending topics"
      - "Content opportunities"
      - "Audience interests"
      - "Engagement insights"

    to_brand_agent:
      - "Brand sentiment reports"
      - "Brand health indicators"
      - "Crisis alerts"
      - "Competitive positioning"

    to_competitive_intel_agent:
      - "Competitor activity"
      - "Market trends"
      - "Share of voice"
      - "Competitive insights"

    to_cmo_agent:
      - "Executive summaries"
      - "Strategic insights"
      - "Crisis alerts"
      - "Market intelligence"

    to_engagement_module:
      - "Priority mentions"
      - "Influencer opportunities"
      - "Response needs"

  integrations:
    listening_platforms:
      - "Brandwatch"
      - "Sprout Social"
      - "Hootsuite Insights"
      - "Mention"
      - "Talkwalker"

    data_sources:
      - "Twitter API"
      - "Reddit API"
      - "News APIs"
      - "Review sites APIs"

    analytics:
      - "Data warehouses"
      - "BI tools"
      - "Custom dashboards"
