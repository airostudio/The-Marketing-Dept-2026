    version_control:
      versioning: "Major.minor (1.0, 1.1, 2.0)"
      changelog: "Document all changes"
      notification: "Announce updates"
      archive: "Keep previous versions"

    training:
      onboarding: "New user training"
      refreshers: "Periodic updates"
      certification: "Brand ambassador program"

    asset_library:
