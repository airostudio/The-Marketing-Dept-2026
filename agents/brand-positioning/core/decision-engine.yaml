# ═══════════════════════════════════════════════════════════════════════════════
# BRAND & POSITIONING AGENT - DECISION ENGINE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

decision_engine:
  version: "1.0.0"
  last_updated: "2026-01-22"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND CONSISTENCY DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  brand_consistency:
    name: "Brand Consistency Guardian"

    content_review_rules:
      automated_checks:
        visual_compliance:
          - check: "Logo usage"
            rules:
              - "Correct logo version"
              - "Minimum size requirements"
              - "Clear space maintained"
              - "Approved color versions"
            action_if_fail: "Flag for review"

          - check: "Color compliance"
            rules:
              - "Primary colors within tolerance"
              - "Secondary colors correct"
              - "Background combinations approved"
            action_if_fail: "Flag with recommendation"

          - check: "Typography compliance"
            rules:
              - "Approved fonts used"
              - "Hierarchy followed"
              - "Size guidelines met"
            action_if_fail: "Flag for correction"

        verbal_compliance:
          - check: "Brand voice alignment"
            rules:
              - "Tone appropriate for context"
              - "Vocabulary aligned"
              - "Style guidelines followed"
            action_if_fail: "Suggest revisions"

          - check: "Messaging accuracy"
            rules:
              - "Approved messages used"
              - "Claims verified"
              - "Value props accurate"
            action_if_fail: "Flag for review"

          - check: "Terminology consistency"
            rules:
              - "Brand terms correct"
              - "Product names accurate"
              - "Descriptors aligned"
            action_if_fail: "Auto-correct or flag"

    compliance_scoring:
      model: "Brand Compliance Score"
      scale: "0-100"

      thresholds:
        approved: { min: 90, action: "Auto-approve" }
        minor_issues: { min: 75, max: 89, action: "Approve with notes" }
        needs_revision: { min: 50, max: 74, action: "Revise required" }
        rejected: { max: 49, action: "Major revision needed" }

  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGING DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  messaging_decisions:
    name: "Message Optimization Engine"

    message_selection:
      context_rules:
        by_audience:
          enterprise:
            pillars: ["Trust", "Scale", "Security"]
            tone: "Professional, authoritative"
          smb:
            pillars: ["Ease", "Value", "Growth"]
            tone: "Friendly, practical"
          consumer:
            pillars: ["Benefit", "Experience", "Value"]
            tone: "Conversational, engaging"

        by_funnel_stage:
          awareness:
            focus: "Brand story, differentiation"
            messages: "Why we exist, what makes us different"
          consideration:
            focus: "Value proposition, proof"
            messages: "Benefits, social proof, comparison"
          decision:
            focus: "Conversion, confidence"
            messages: "Specific benefits, guarantees, CTAs"

        by_channel:
          social:
            length: "Short, punchy"
            style: "Conversational"
          email:
            length: "Medium"
            style: "Personal, direct"
          website:
            length: "Varied by page"
            style: "Clear, comprehensive"
          advertising:
            length: "Concise"
            style: "Compelling, action-oriented"

    message_performance:
      tracking:
        - "Engagement by message"
        - "Conversion by message"
        - "Sentiment by message"
      optimization:
        - "A/B test recommendations"
        - "Message rotation suggestions"
        - "Retirement recommendations"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND HEALTH DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  brand_health:
    name: "Brand Health Response System"

    health_triggers:
      awareness_decline:
        trigger: "Awareness drops > 5% quarter-over-quarter"
        assessment:
          - "Review media presence"
          - "Check share of voice"
          - "Analyze competitive activity"
        actions:
          - "Recommend awareness campaign"
          - "Increase brand content frequency"
          - "Review channel mix"

      consideration_decline:
        trigger: "Consideration drops > 5% quarter-over-quarter"
        assessment:
          - "Review value proposition clarity"
          - "Check competitive positioning"
          - "Analyze customer feedback"
        actions:
          - "Refresh messaging"
          - "Strengthen differentiation"
          - "Increase proof points"

      sentiment_shift:
        trigger: "Sentiment drops > 10% week-over-week"
        assessment:
          - "Identify sentiment drivers"
          - "Review recent activity"
          - "Check for issues"
        actions:
          - "Address specific concerns"
          - "Adjust messaging if needed"
          - "Escalate if crisis potential"

      nps_decline:
        trigger: "NPS drops > 5 points"
        assessment:
          - "Analyze detractor feedback"
          - "Review customer journey"
          - "Identify pain points"
        actions:
          - "Address detractor concerns"
          - "Enhance brand experience"
          - "Collaborate with product/service"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE RESPONSE DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_response:
    name: "Competitive Brand Response"

    trigger_scenarios:
      competitor_repositioning:
        trigger: "Competitor changes positioning"
        assessment:
          - "Analyze new positioning"
          - "Assess overlap with our position"
          - "Evaluate threat level"
        actions:
          low_threat:
            - "Monitor"
            - "Document changes"
          medium_threat:
            - "Strengthen differentiation messaging"
            - "Increase proof point visibility"
          high_threat:
            - "Escalate to CMO Agent"
            - "Recommend positioning refresh"

      competitive_campaign:
        trigger: "Competitor launches major brand campaign"
        assessment:
          - "Analyze campaign messaging"
          - "Check for direct comparisons"
          - "Assess market impact"
        actions:
          - "Monitor impact on our metrics"
          - "Prepare counter-messaging if needed"
          - "Recommend response strategy"

      attribute_encroachment:
        trigger: "Competitor claiming our key attribute"
        assessment:
          - "Verify attribute ownership status"
          - "Analyze competitor claim validity"
          - "Assess customer perception"
        actions:
          - "Reinforce attribute ownership"
          - "Increase proof points"
          - "Consider defensive campaign"

  # ═══════════════════════════════════════════════════════════════════════════
  # CRISIS RESPONSE DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  crisis_response:
    name: "Brand Crisis Management"

    severity_assessment:
      level_1_minor:
        indicators:
          - "Isolated negative mention"
          - "Minor complaint"
          - "Limited reach"
        response:
          - "Standard response"
          - "Monitor"
          - "Log incident"

      level_2_moderate:
        indicators:
          - "Multiple negative mentions"
          - "Influencer criticism"
          - "Growing visibility"
        response:
          - "Acknowledge issue"
          - "Prepare response"
          - "Alert team"

      level_3_significant:
        indicators:
          - "Viral negative content"
          - "Media coverage"
          - "Significant sentiment shift"
        response:
          - "Escalate to CMO Agent"
          - "Pause related content"
          - "Prepare holding statement"
          - "Coordinate response"

      level_4_critical:
        indicators:
          - "Major media coverage"
          - "Legal implications"
          - "Business impact"
        response:
          - "Immediate escalation"
          - "Executive involvement"
          - "Full crisis protocol"
          - "External communication"

    response_principles:
      - "Respond quickly but thoughtfully"
      - "Be transparent and honest"
      - "Take responsibility when appropriate"
      - "Show empathy"
      - "Provide clear next steps"
      - "Protect brand values"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND EVOLUTION DECISIONS
  # ═══════════════════════════════════════════════════════════════════════════

  brand_evolution:
    name: "Brand Evolution Guidance"

    evolution_triggers:
      market_shift:
        indicators:
          - "Category disruption"
          - "Consumer behavior change"
          - "New competitive landscape"
        assessment: "Evaluate brand relevance"
        recommendation: "Strategic refresh if needed"

      business_evolution:
        indicators:
          - "New product/service launch"
          - "New market entry"
          - "Business model change"
        assessment: "Evaluate brand fit"
        recommendation: "Extension or evolution"

      performance_plateau:
        indicators:
          - "Brand metrics stagnant"
          - "Declining resonance"
          - "Reduced differentiation"
        assessment: "Brand health audit"
        recommendation: "Refresh strategy"

    evolution_guidelines:
      principles:
        - "Protect core brand equity"
        - "Evolve, don't abandon"
        - "Test before committing"
        - "Communicate changes clearly"
        - "Maintain consistency during transition"

  # ═══════════════════════════════════════════════════════════════════════════
  # GUARDRAILS & SAFETY
  # ═══════════════════════════════════════════════════════════════════════════

  guardrails:
    brand_protection:
      non_negotiables:
        - "Never compromise brand values"
        - "Never make false claims"
        - "Never disparage competitors directly"
        - "Never use unauthorized assets"
        - "Never ignore trademark requirements"

      approval_requirements:
        always_approve:
          - "New brand elements"
          - "Major messaging changes"
          - "Crisis communications"
          - "Legal/regulatory content"
          - "Executive communications"

    audit_logging:
      logged_actions:
        - "All brand decisions"
        - "Compliance reviews"
        - "Message approvals"
        - "Crisis responses"
        - "Strategy changes"
      retention: "36 months"
      review_frequency: "Quarterly"
