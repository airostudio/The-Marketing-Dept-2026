# ═══════════════════════════════════════════════════════════════════════════════
# TOPIC AUTHORITY MODULE - CLUSTER MANAGEMENT ENGINE
# Content Strategy Agent - The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: topic-authority-cluster-management
  name: "Topic Cluster Management Engine"
  version: "1.0.0"
  category: "topic_authority"

  description: |
    Strategic topic cluster design and management system that builds topic
    authority through pillar-cluster architecture, internal linking optimization,
    and comprehensive coverage mapping.

  # ─────────────────────────────────────────────────────────────────────────────
  # CLUSTER ARCHITECTURE
  # ─────────────────────────────────────────────────────────────────────────────

  cluster_architecture:

    cluster_structure:
      pillar_content:
        description: "Comprehensive hub content covering broad topic"
        characteristics:
          - word_count: "5000-10000 words"
          - coverage: "All major subtopics"
          - linking: "Links to all cluster content"
          - keywords: "High-volume head terms"
          - update_frequency: "Quarterly minimum"

        requirements:
          - "Definitive resource on topic"
          - "Original insights or data"
          - "Expert authorship"
          - "Rich media elements"
          - "Strong E-E-A-T signals"

      cluster_content:
        description: "Focused content on specific subtopics"
        characteristics:
          - word_count: "1500-3000 words"
          - coverage: "Deep dive on one aspect"
          - linking: "Links to pillar + related clusters"
          - keywords: "Mid-tail keywords"
          - update_frequency: "Semi-annually"

        tiers:
          - tier: "Primary Cluster"
            description: "Core supporting content"
            count: "5-10 pieces per pillar"
            priority: "P1"

          - tier: "Secondary Cluster"
            description: "Extended coverage"
            count: "10-20 pieces per pillar"
            priority: "P2"

      supporting_content:
        description: "Tactical content supporting clusters"
        characteristics:
          - word_count: "500-1500 words"
          - coverage: "Specific questions/use cases"
          - linking: "Links to cluster content"
          - keywords: "Long-tail keywords"

        types:
          - "FAQ content"
          - "How-to guides"
          - "Quick reference"
          - "Comparison tables"
          - "Glossary entries"

  # ─────────────────────────────────────────────────────────────────────────────
  # CLUSTER DESIGN
  # ─────────────────────────────────────────────────────────────────────────────

  cluster_design:

    design_process:
      steps:
        - step: 1
          name: "Topic Selection"
          inputs:
            - "SEO Agent keyword data"
            - "Business priority alignment"
            - "Market opportunity analysis"
            - "Competitive positioning"
          outputs:
            - "Priority topic list"
            - "Topic opportunity scores"

        - step: 2
          name: "Topic Mapping"
          inputs:
            - "Selected topic"
            - "Keyword research"
            - "User intent analysis"
            - "Competitor coverage"
          outputs:
            - "Subtopic hierarchy"
            - "Semantic relationships"

        - step: 3
          name: "Content Audit"
          inputs:
            - "Existing content inventory"
            - "Performance data"
            - "Keyword mappings"
          outputs:
            - "Content-to-cluster mapping"
            - "Gap identification"
            - "Consolidation opportunities"

        - step: 4
          name: "Cluster Structure"
          inputs:
            - "Topic map"
            - "Content audit"
            - "SEO requirements"
          outputs:
            - "Pillar content definition"
            - "Cluster content plan"
            - "Internal linking architecture"

        - step: 5
          name: "Roadmap Creation"
          inputs:
            - "Cluster structure"
            - "Priority scoring"
            - "Resource capacity"
          outputs:
            - "Content creation sequence"
            - "Timeline and milestones"
            - "Success metrics"

    subtopic_discovery:
      methods:
        - method: "Keyword Clustering"
          source: "SEO Agent keyword data"
          approach: "Semantic similarity grouping"

        - method: "SERP Analysis"
          source: "Top-ranking content analysis"
          approach: "Topic coverage extraction"

        - method: "Entity Extraction"
          source: "Industry content corpus"
          approach: "NLP entity and relationship mapping"

        - method: "Question Mining"
          source: "PAA, forums, support tickets"
          approach: "Question pattern analysis"

        - method: "Competitor Analysis"
          source: "Competitor content inventory"
          approach: "Topic coverage comparison"

  # ─────────────────────────────────────────────────────────────────────────────
  # CLUSTER HEALTH MONITORING
  # ─────────────────────────────────────────────────────────────────────────────

  cluster_health:

    health_dimensions:
      - dimension: "Coverage Completeness"
        weight: 0.25
        metrics:
          - name: "Subtopic Coverage Rate"
            calculation: "Covered subtopics / Total required subtopics"
            target: ">= 80%"

          - name: "Content Depth Score"
            calculation: "Average content quality in cluster"
            target: ">= 75"

          - name: "Gap Count"
            calculation: "Number of uncovered subtopics"
            target: "<= 3"

      - dimension: "Internal Linking Health"
        weight: 0.20
        metrics:
          - name: "Pillar Connectivity"
            calculation: "Cluster content linking to pillar"
            target: "100%"

          - name: "Cross-Cluster Links"
            calculation: "Related cluster interconnections"
            target: ">= 50%"

          - name: "Link Equity Flow"
            calculation: "PageRank distribution score"
            target: "Optimal distribution"

      - dimension: "Performance Health"
        weight: 0.30
        metrics:
          - name: "Cluster Traffic"
            calculation: "Total organic traffic to cluster"
            target: "Growing trend"

          - name: "Ranking Distribution"
            calculation: "% keywords ranking top 10"
            target: ">= 60%"

          - name: "Featured Snippet Capture"
            calculation: "Snippets won / opportunities"
            target: ">= 30%"

      - dimension: "Freshness Health"
        weight: 0.15
        metrics:
          - name: "Average Content Age"
            calculation: "Average days since last update"
            target: "<= 365 days"

          - name: "Pillar Freshness"
            calculation: "Days since pillar update"
            target: "<= 90 days"

          - name: "Stale Content Ratio"
            calculation: "Content > 18 months old"
            target: "<= 20%"

      - dimension: "Authority Score"
        weight: 0.10
        metrics:
          - name: "Domain Authority Contribution"
            calculation: "Backlinks to cluster content"
            target: "Growing"

          - name: "E-E-A-T Signals"
            calculation: "Expert authorship, citations, reviews"
            target: "Strong presence"

    health_scoring:
      calculation: "Weighted sum of dimension scores"
      max_score: 100

      thresholds:
        - level: "Excellent"
          score: ">= 85"
          action: "Maintain and expand"
          color: "green"

        - level: "Good"
          score: "70-84"
          action: "Minor optimizations"
          color: "light-green"

        - level: "Needs Attention"
          score: "55-69"
          action: "Focused improvements"
          color: "yellow"

        - level: "At Risk"
          score: "40-54"
          action: "Priority intervention"
          color: "orange"

        - level: "Critical"
          score: "< 40"
          action: "Emergency action"
          color: "red"

  # ─────────────────────────────────────────────────────────────────────────────
  # CLUSTER VISUALIZATION
  # ─────────────────────────────────────────────────────────────────────────────

  visualization:

    cluster_map:
      description: "Interactive visual representation of cluster structure"
      elements:
        - "Pillar content (center node)"
        - "Cluster content (connected nodes)"
        - "Supporting content (outer nodes)"
        - "Internal links (connection lines)"
        - "External links (incoming arrows)"

      features:
        - "Color coding by health/status"
        - "Size by traffic/importance"
        - "Hover for content details"
        - "Click for full content view"
        - "Filter by content type/status"
        - "Zoom and pan navigation"

    coverage_heatmap:
      description: "Visual representation of topic coverage"
      dimensions:
        - "X-axis: Subtopics"
        - "Y-axis: Content depth levels"
        - "Color: Coverage intensity"

    authority_flow:
      description: "Visualization of link equity flow"
      elements:
        - "Node size = authority"
        - "Arrow thickness = link strength"
        - "Color = traffic flow"

    gap_visualization:
      description: "Visual identification of content gaps"
      elements:
        - "Covered areas (filled)"
        - "Gap areas (empty/highlighted)"
        - "Opportunity scores"

  # ─────────────────────────────────────────────────────────────────────────────
  # CLUSTER OPERATIONS
  # ─────────────────────────────────────────────────────────────────────────────

  operations:

    cluster_creation:
      workflow:
        - "Define pillar topic"
        - "Map subtopics"
        - "Audit existing content"
        - "Design cluster structure"
        - "Create content roadmap"
        - "Assign ownership"
        - "Begin content creation"

    cluster_expansion:
      triggers:
        - "New subtopic opportunities"
        - "Competitor gap identification"
        - "Audience interest signals"
        - "SEO opportunity alerts"

      process:
        - "Identify expansion opportunity"
        - "Validate with SEO Agent"
        - "Create content briefs"
        - "Update cluster structure"
        - "Adjust internal linking"

    cluster_optimization:
      activities:
        - "Content quality improvements"
        - "Internal linking optimization"
        - "Consolidation of weak content"
        - "Pillar content updates"
        - "Fresh content additions"

    cluster_retirement:
      criteria:
        - "Topic no longer strategic"
        - "Market relevance declined"
        - "Sustained poor performance"
        - "Better cluster opportunity"

      process:
        - "Performance review"
        - "Consolidation assessment"
        - "Redirect strategy"
        - "Archive content"
        - "Update related clusters"

  # ─────────────────────────────────────────────────────────────────────────────
  # REPORTING & ALERTS
  # ─────────────────────────────────────────────────────────────────────────────

  reporting:

    dashboards:
      - name: "Cluster Overview"
        widgets:
          - "All clusters health summary"
          - "Top performing clusters"
          - "Clusters needing attention"
          - "Recent cluster changes"

      - name: "Individual Cluster View"
        widgets:
          - "Cluster map visualization"
          - "Health score breakdown"
          - "Performance metrics"
          - "Content inventory"
          - "Gap analysis"

    reports:
      - report: "Monthly Cluster Health Report"
        frequency: "Monthly"
        recipients: ["CMO Agent", "SEO Agent"]
        contents:
          - "Cluster health scores"
          - "Performance trends"
          - "Gap identification"
          - "Recommendations"

    alerts:
      - trigger: "Cluster health drops below 55"
        severity: "High"
        recipients: ["Content Team", "CMO Agent"]

      - trigger: "Pillar content older than 90 days"
        severity: "Medium"
        recipients: ["Content Team"]

      - trigger: "New gap opportunity identified"
        severity: "Info"
        recipients: ["Content Team"]

      - trigger: "Competitor gains in cluster topic"
        severity: "Medium"
        recipients: ["Content Team", "Competitive Intel Agent"]
