# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT OPTIMIZATION & STRATEGY MODULE
# The Marketing Department 2026 - SEO Agent
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "content-optimization"
  name: "Content Strategy & Optimization Engine"
  version: "1.0.0"
  category: "content_optimization"

  # ═══════════════════════════════════════════════════════════════════════════
  # TOPIC CLUSTER MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  topic_clusters:

    cluster_architecture:
      pillar_pages:
        definition: "Comprehensive pages covering broad topics"
        characteristics:
          - "2000-5000+ words"
          - "Covers topic comprehensively"
          - "Links to all cluster content"
          - "Targets high-volume head terms"
          - "Serves as hub/authority page"

        structure:
          - "Introduction and overview"
          - "Table of contents"
          - "Major subtopic sections"
          - "Internal links to cluster content"
          - "FAQ section"
          - "Summary and next steps"

      cluster_content:
        definition: "Supporting content on specific subtopics"
        characteristics:
          - "1000-2500 words"
          - "Deep dive on specific subtopic"
          - "Links back to pillar page"
          - "Links to related cluster content"
          - "Targets long-tail keywords"

      supporting_content:
        definition: "Additional content supporting clusters"
        types:
          - "FAQ pages"
          - "Glossary entries"
          - "Case studies"
          - "Data studies"
          - "Comparison pages"

    cluster_design_process:
      steps:
        - step: 1
          action: "Identify pillar topics"
          inputs: ["Keyword research", "Business priorities", "Market analysis"]

        - step: 2
          action: "Map cluster topics"
          method: "Semantic relationship analysis"
          outputs: ["Topic hierarchy", "Keyword mapping"]

        - step: 3
          action: "Audit existing content"
          analysis: "Map current content to cluster structure"
          identify: ["Gaps", "Overlap", "Optimization opportunities"]

        - step: 4
          action: "Create content roadmap"
          outputs: ["Priority content list", "Production schedule"]

        - step: 5
          action: "Implement internal linking"
          strategy: "Hub and spoke linking model"

    cluster_health_metrics:
      - metric: "Cluster Coverage"
        calculation: "Content pages / Topic opportunities"
        target: "> 80%"

      - metric: "Internal Link Density"
        calculation: "Avg links per cluster page"
        target: "3-5 links"

      - metric: "Pillar Page Authority"
        measurement: "Rankings, traffic, backlinks"

      - metric: "Cluster Traffic"
        measurement: "Combined organic traffic"

      - metric: "Cannibalization Score"
        calculation: "Competing pages detected"
        target: "0"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT INVENTORY & AUDIT
  # ═══════════════════════════════════════════════════════════════════════════

  content_audit:

    inventory_analysis:
      crawl_data:
        - "All indexed URLs"
        - "Page titles and meta"
        - "Word count"
        - "Publication date"
        - "Last modified date"
        - "Internal links"
        - "External links"

      performance_data:
        - "Organic traffic (last 12 months)"
        - "Keyword rankings"
        - "Backlinks"
        - "Engagement metrics"
        - "Conversions"

      quality_signals:
        - "Content score"
        - "Readability score"
        - "Topic coverage"
        - "Uniqueness"
        - "E-E-A-T signals"

    content_classification:
      performance_tiers:
        - tier: "Top Performers"
          criteria: "Top 10% by traffic/conversions"
          action: "Protect, optimize, update"

        - tier: "Solid Performers"
          criteria: "Above average performance"
          action: "Monitor, optimize incrementally"

        - tier: "Underperformers"
          criteria: "Below average, has potential"
          action: "Optimize or consolidate"

        - tier: "Poor Performers"
          criteria: "Minimal traffic, low quality"
          action: "Consolidate, redirect, or remove"

        - tier: "Decay Content"
          criteria: "Declining performance"
          action: "Urgent refresh needed"

      content_decisions:
        - decision: "Keep"
          criteria: "Performing well, on-topic"

        - decision: "Optimize"
          criteria: "Good potential, needs improvement"

        - decision: "Consolidate"
          criteria: "Thin or overlapping content"

        - decision: "Redirect"
          criteria: "Outdated, better target exists"

        - decision: "Remove"
          criteria: "No value, harmful"

  # ═══════════════════════════════════════════════════════════════════════════
  # CANNIBALIZATION MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  cannibalization:

    detection:
      methods:
        - method: "Same keyword, multiple URLs"
          source: "Rank tracking data"
          signal: "Multiple pages ranking for same keyword"

        - method: "Ranking URL fluctuation"
          source: "Historical ranking data"
          signal: "Different URLs ranking over time"

        - method: "GSC query/page analysis"
          source: "Search Console data"
          signal: "Same queries driving multiple pages"

        - method: "Content similarity analysis"
          source: "Content analysis"
          signal: "High semantic overlap between pages"

      severity_scoring:
        factors:
          - "Traffic impact"
          - "Keyword importance"
          - "Position volatility"
          - "Page count competing"

        levels:
          critical: "High-volume keyword, major impact"
          high: "Important keyword, clear competition"
          medium: "Some overlap, moderate impact"
          low: "Minor overlap, low impact"

    resolution_strategies:
      - strategy: "Consolidate"
        when: "Similar content, one should remain"
        process:
          - "Choose strongest page"
          - "Merge best content"
          - "Redirect others to chosen page"
          - "Update internal links"

      - strategy: "Differentiate"
        when: "Both pages valuable, different purposes"
        process:
          - "Clarify target keyword per page"
          - "Differentiate content focus"
          - "Update titles and meta"
          - "Adjust internal linking"

      - strategy: "Canonical"
        when: "Technical duplicates"
        process:
          - "Implement canonical tags"
          - "Point to preferred version"

      - strategy: "Noindex"
        when: "Supporting page shouldn't rank"
        process:
          - "Add noindex tag"
          - "Keep for user experience"

    monitoring:
      - "Continuous cannibalization detection"
      - "Alert on new cannibalization"
      - "Track resolution effectiveness"
      - "Prevention through keyword mapping"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT FRESHNESS MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  freshness:

    freshness_signals:
      factors:
        - "Last modified date"
        - "Publication date"
        - "Content changes detected"
        - "User engagement trends"
        - "SERP volatility"
        - "Competitor freshness"

    freshness_scoring:
      model:
        - factor: "Age of content"
          weight: 0.25
          decay: "Logarithmic"

        - factor: "Last update"
          weight: 0.25

        - factor: "Topic freshness demand"
          weight: 0.20
          varies_by: "Query Deserves Freshness (QDF)"

        - factor: "Performance trend"
          weight: 0.15
          signal: "Declining = needs refresh"

        - factor: "Competitive freshness"
          weight: 0.15
          comparison: "Vs top rankers"

    update_prioritization:
      criteria:
        - "Traffic value (current + potential)"
        - "Freshness score (lower = priority)"
        - "Competitive pressure"
        - "Business importance"
        - "Update effort required"

      update_types:
        - type: "Quick Refresh"
          scope: "Minor updates"
          examples: ["Date update", "Statistics update", "Link fixes"]
          effort: "Low (1-2 hours)"

        - type: "Content Enhancement"
          scope: "Moderate updates"
          examples: ["New sections", "Updated examples", "Media addition"]
          effort: "Medium (4-8 hours)"

        - type: "Major Overhaul"
          scope: "Significant rewrite"
          examples: ["Complete restructure", "Topic expansion", "New angle"]
          effort: "High (1-3 days)"

        - type: "Republication"
          scope: "Content treated as new"
          examples: ["Major updates", "Date change", "Promotion push"]
          effort: "Medium"

    automation:
      - "Freshness score calculation (weekly)"
      - "Decay alerts for priority content"
      - "Competitor freshness comparison"
      - "Update recommendation queue"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT GAP ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  gap_analysis:

    gap_types:
      keyword_gaps:
        description: "Keywords with no targeting content"
        sources:
          - "Keyword research uncovered terms"
          - "Competitor keyword analysis"
          - "Search Console queries without content"

      topic_gaps:
        description: "Topics in cluster not covered"
        sources:
          - "Topic modeling analysis"
          - "People Also Ask questions"
          - "Related searches"
          - "Forum/community questions"

      format_gaps:
        description: "Content types missing"
        examples:
          - "No video content"
          - "No infographics"
          - "No comparison pages"
          - "No tools/calculators"

      funnel_gaps:
        description: "Missing content for user journey stages"
        stages:
          - "Awareness (problem-aware)"
          - "Consideration (solution-aware)"
          - "Decision (product-aware)"
          - "Retention (customer content)"

      intent_gaps:
        description: "Search intents not addressed"
        intents:
          - "Informational"
          - "Commercial"
          - "Transactional"
          - "Navigational"

    gap_prioritization:
      scoring_factors:
        - "Search volume opportunity"
        - "Business relevance"
        - "Competitive difficulty"
        - "Content effort required"
        - "Expected conversion impact"

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT PERFORMANCE TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  performance_tracking:

    metrics:
      traffic_metrics:
        - "Organic sessions"
        - "Organic users"
        - "Organic pageviews"
        - "Traffic trends"

      engagement_metrics:
        - "Time on page"
        - "Bounce rate"
        - "Scroll depth"
        - "Pages per session"

      seo_metrics:
        - "Keyword rankings"
        - "Ranking keywords count"
        - "Backlinks"
        - "SERP features"

      conversion_metrics:
        - "Goal completions"
        - "Conversion rate"
        - "Revenue (if applicable)"
        - "Lead generation"

    tracking_views:
      - view: "Individual Page Performance"
        metrics: "All metrics per page"

      - view: "Cluster Performance"
        metrics: "Aggregated by topic cluster"

      - view: "Content Type Performance"
        metrics: "By blog, product, landing, etc."

      - view: "Author Performance"
        metrics: "By content author"

      - view: "Cohort Analysis"
        metrics: "By publication date cohort"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & INTEGRATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    to_content_strategist:
      - "Topic cluster maps"
      - "Content gap reports"
      - "Content calendar priorities"
      - "Update schedule"

    to_copywriting_agent:
      - "Content briefs"
      - "Optimization recommendations"
      - "Keyword targeting guides"
      - "Competitive content analysis"

    reports:
      - report: "Content Performance Report"
        frequency: "Monthly"
        contents:
          - "Top performing content"
          - "Underperforming content"
          - "Freshness status"
          - "Cannibalization issues"
          - "Recommendations"

      - report: "Content Audit Summary"
        frequency: "Quarterly"
        contents:
          - "Full inventory analysis"
          - "Content decisions"
          - "Gap analysis"
          - "Strategic recommendations"

      - report: "Cluster Health Report"
        frequency: "Monthly"
        contents:
          - "Cluster coverage"
          - "Performance by cluster"
          - "Internal linking health"
          - "Expansion opportunities"

    dashboards:
      - dashboard: "Content Command Center"
        widgets:
          - "Content performance overview"
          - "Top/bottom performers"
          - "Freshness alerts"
          - "Gap opportunities"
          - "Cannibalization warnings"
