<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audema - Login / Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 32px;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .auth-header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      color: #6b7280;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }

    .auth-tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .auth-content {
      padding: 32px;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #d1fae5;
      color: #059669;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .demo-note {
      margin-top: 20px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .demo-note strong {
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🚀 Audema</h1>
      <p>Your AI Marketing Department</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <div class="auth-content">
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">
          Login
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signupForm">
        <div class="form-row">
          <div class="form-group">
            <label for="signupFirstName">First Name</label>
            <input type="text" id="signupFirstName" placeholder="John" required>
          </div>
          <div class="form-group">
            <label for="signupLastName">Last Name</label>
            <input type="text" id="signupLastName" placeholder="Doe" required>
          </div>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Minimum 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label for="signupOrganization">Organization Name</label>
          <input type="text" id="signupOrganization" placeholder="Acme Corp" required>
        </div>
        <button type="submit" class="submit-btn" id="signupBtn">
          Create Account
        </button>
      </form>

      <div class="demo-note">
        <strong>🔒 Production-Ready:</strong><br>
        Data persisted in PostgreSQL database.<br>
        Accessible across all browsers and devices.
      </div>
    </div>
  </div>

  <script src="js/api-client.js"></script>
  <script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;

        // Update tab active state
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // Update form active state
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        document.getElementById(`${tabName}Form`).classList.add('active');

        // Clear messages
        hideError();
        hideSuccess();
      });
    });

    // Error/success message helpers
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    function hideSuccess() {
      document.getElementById('successMessage').classList.remove('show');
    }

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = 'Logging in...<span class="loading"></span>';

      try {
        await window.apiClient.login(email, password);
        showSuccess('Login successful! Redirecting to dashboard...');
        setTimeout(() => {
          window.location.href = 'hub.html';
        }, 1000);
      } catch (error) {
        showError(error.message || 'Login failed. Please check your credentials.');
        btn.disabled = false;
        btn.innerHTML = 'Login';
      }
    });

    // Signup form
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();

      const firstName = document.getElementById('signupFirstName').value;
      const lastName = document.getElementById('signupLastName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const organizationName = document.getElementById('signupOrganization').value;
      const btn = document.getElementById('signupBtn');

      btn.disabled = true;
      btn.innerHTML = 'Creating account...<span class="loading"></span>';

      try {
        await window.apiClient.signup(email, password, firstName, lastName, organizationName);
        showSuccess('Account created successfully! Redirecting to dashboard...');
        setTimeout(() => {
          window.location.href = 'hub.html';
        }, 1000);
      } catch (error) {
        showError(error.message || 'Signup failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    });

    // Check if already authenticated
    if (window.apiClient.isAuthenticated()) {
      window.location.href = 'hub.html';
    }
  </script>
</body>
</html>
