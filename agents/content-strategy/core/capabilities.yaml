                - "Accuracy and factuality"
                - "Uniqueness/originality"
                - "E-E-A-T signals"
                - "Multimedia richness"
                - "Structure and formatting"

            - dimension: "Engagement Quality"
              factors:
                - "Time on page"
                - "Scroll depth"
                - "Social shares"
                - "Comments"
                - "Return visits"

            - dimension: "Conversion Quality"
