            - "Historical score trending"
            - "Benchmark comparisons"
            - "Score prediction for new content"

        - feature: "Score Actions"
          capabilities:
            - "Auto-flag underperforming content"
            - "Prioritized improvement recommendations"
            - "Score-based alerting"
            - "Archive recommendations"

