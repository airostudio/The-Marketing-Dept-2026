# ═══════════════════════════════════════════════════════════════════════════════
# BRAND & POSITIONING AGENT WORKFLOWS
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

workflows:
  version: "1.0.0"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 1: BRAND STRATEGY DEVELOPMENT
  # ═══════════════════════════════════════════════════════════════════════════

  brand_strategy_development:
    name: "Brand Strategy Development"
    description: "Comprehensive brand strategy creation or refresh"
    trigger:
      - "New brand launch"
      - "Brand refresh initiative"
      - "Annual strategy review"
    duration: "4-8 weeks"

    steps:
      - step: 1
        name: "Discovery & Research"
        duration: "1-2 weeks"
        actions:
          - "Stakeholder interviews"
          - "Customer research"
          - "Competitive analysis"
          - "Market assessment"
          - "Brand audit"
        outputs:
          - "Research findings"
          - "Insights summary"

      - step: 2
        name: "Brand Foundation"
        duration: "1 week"
        actions:
          - "Define purpose, vision, mission"
          - "Identify core values"
          - "Develop brand promise"
          - "Define brand personality"
        outputs:
          - "Brand foundation document"

      - step: 3
        name: "Positioning Development"
        duration: "1 week"
        actions:
          - "Define target audience"
          - "Identify competitive frame"
          - "Determine points of difference"
          - "Craft positioning statement"
        outputs:
          - "Positioning strategy"
          - "Positioning statement"

      - step: 4
        name: "Messaging Framework"
        duration: "1 week"
        actions:
          - "Develop master narrative"
          - "Create messaging pillars"
          - "Write key messages"
          - "Define brand voice"
        outputs:
          - "Messaging framework"
          - "Brand voice guide"

      - step: 5
        name: "Validation"
        duration: "1 week"
        actions:
          - "Test with stakeholders"
          - "Customer validation"
          - "Refine based on feedback"
        outputs:
          - "Validated strategy"

      - step: 6
        name: "Documentation & Rollout"
        duration: "1 week"
        actions:
          - "Finalize all documents"
          - "Create guidelines"
          - "Develop training materials"
          - "Roll out to teams"
        outputs:
          - "Complete brand strategy"
          - "Implementation plan"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 2: BRAND HEALTH MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  brand_health_monitoring:
    name: "Continuous Brand Health Monitoring"
    description: "Ongoing monitoring and reporting of brand health"
    trigger: "Continuous"

    daily_monitoring:
      time: "08:00"
      actions:
        - "Review sentiment data"
        - "Check mention volume"
        - "Assess alert triggers"
        - "Monitor competitive activity"
      outputs:
        - "Daily brand pulse"
      automated: true

    weekly_analysis:
      time: "Monday 10:00"
      actions:
        - "Compile week's data"
        - "Analyze trends"
        - "Compare to benchmarks"
        - "Identify issues/opportunities"
        - "Generate weekly report"
      outputs:
        - "Weekly brand summary"

    monthly_review:
      time: "1st of month"
      actions:
        - "Full metric analysis"
        - "Competitive comparison"
        - "Strategic assessment"
        - "Generate monthly report"
        - "Present to CMO Agent"
      outputs:
        - "Monthly brand health report"

    quarterly_deep_dive:
      time: "First week of quarter"
      actions:
        - "Analyze tracking study results"
        - "Conduct brand audit"
        - "Update competitive analysis"
        - "Strategic recommendations"
        - "Present to leadership"
      outputs:
        - "Quarterly brand review"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 3: BRAND CRISIS RESPONSE
  # ═══════════════════════════════════════════════════════════════════════════

  brand_crisis_response:
    name: "Brand Crisis Response Protocol"
    description: "Rapid response to brand reputation threats"
    trigger:
      - "Reputation threat detected"
      - "Negative viral content"
      - "Media crisis"
    priority: "Critical"
    response_time: "30 minutes"

    steps:
      - step: 1
        name: "Alert & Assessment"
        time_limit: "15 minutes"
        actions:
          - "Confirm threat level"
          - "Assess scope and severity"
          - "Alert CMO Agent"
          - "Assemble response team"
        outputs:
          - "Crisis assessment"
          - "Severity classification"

      - step: 2
        name: "Information Gathering"
        time_limit: "30 minutes"
        actions:
          - "Gather all relevant facts"
          - "Identify source/cause"
          - "Map spread and impact"
          - "Identify key stakeholders"
        outputs:
          - "Situation brief"

      - step: 3
        name: "Response Strategy"
        time_limit: "1 hour"
        actions:
          - "Develop response approach"
          - "Draft communications"
          - "Identify spokesperson"
          - "Get necessary approvals"
        outputs:
          - "Approved response plan"
        collaboration: "CMO Agent, Legal (if needed)"

      - step: 4
        name: "Response Execution"
        actions:
          - "Issue official response"
          - "Brief internal teams"
          - "Monitor reception"
          - "Engage with stakeholders"
        outputs:
          - "Response deployed"

      - step: 5
        name: "Ongoing Management"
        actions:
          - "Monitor developments"
          - "Adjust response as needed"
          - "Track resolution metrics"
          - "Provide updates"
        outputs:
          - "Status reports"

      - step: 6
        name: "Resolution & Recovery"
        actions:
          - "Confirm crisis resolved"
          - "Assess brand impact"
          - "Plan recovery activities"
          - "Document learnings"
        outputs:
          - "Post-crisis assessment"
          - "Recovery plan"

      - step: 7
        name: "Post-Crisis Review"
        timeline: "Within 1 week"
        actions:
          - "Full crisis debrief"
          - "Analyze response effectiveness"
          - "Update crisis protocols"
          - "Share learnings"
        outputs:
          - "Crisis post-mortem"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 4: MESSAGING APPROVAL
  # ═══════════════════════════════════════════════════════════════════════════

  messaging_approval:
    name: "Brand Messaging Approval Process"
    description: "Review and approval of brand messaging"
    trigger:
      - "New messaging request"
      - "Campaign messaging"
      - "Major content pieces"

    steps:
      - step: 1
        name: "Submission"
        actions:
          - "Receive messaging request"
          - "Log request"
          - "Assign to queue"
        outputs:
          - "Request logged"

      - step: 2
        name: "Initial Review"
        actions:
          - "Check brand alignment"
          - "Verify messaging accuracy"
          - "Assess tone and voice"
          - "Check for claims"
        outputs:
          - "Initial assessment"

      - step: 3
        name: "Feedback/Revision"
        conditional: "If revisions needed"
        actions:
          - "Provide specific feedback"
          - "Suggest alternatives"
          - "Request revision"
          - "Review revised version"
        outputs:
          - "Revised messaging"

      - step: 4
        name: "Approval"
        actions:
          - "Final review"
          - "Approve or escalate"
          - "Document approval"
        outputs:
          - "Approved messaging"

      - step: 5
        name: "Distribution"
        actions:
          - "Share approved messaging"
          - "Add to message library"
          - "Update relevant teams"
        outputs:
          - "Messaging distributed"

    slas:
      standard: "48 hours"
      urgent: "24 hours"
      critical: "4 hours"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 5: BRAND GUIDELINES UPDATE
  # ═══════════════════════════════════════════════════════════════════════════

  guidelines_update:
    name: "Brand Guidelines Update Process"
    description: "Process for updating brand guidelines"
    trigger:
      - "Scheduled review"
      - "Change request"
      - "New brand element"

    steps:
      - step: 1
        name: "Change Request"
        actions:
          - "Document proposed change"
          - "Assess impact"
          - "Prioritize request"
        outputs:
          - "Change request logged"

      - step: 2
        name: "Review & Approval"
        actions:
          - "Review change rationale"
          - "Assess brand impact"
          - "Get necessary approvals"
        outputs:
          - "Change approved"
        conditional: "Major changes require CMO approval"

      - step: 3
        name: "Implementation"
        actions:
          - "Update guidelines document"
          - "Update asset library"
          - "Create new templates if needed"
        outputs:
          - "Guidelines updated"

      - step: 4
        name: "Distribution"
        actions:
          - "Version control update"
          - "Notify stakeholders"
          - "Distribute new version"
          - "Archive old version"
        outputs:
          - "Updates distributed"

      - step: 5
        name: "Training"
        conditional: "If significant change"
        actions:
          - "Develop training materials"
          - "Conduct training sessions"
          - "Update onboarding materials"
        outputs:
          - "Teams trained"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 6: BRAND CAMPAIGN SUPPORT
  # ═══════════════════════════════════════════════════════════════════════════

  brand_campaign_support:
    name: "Brand Campaign Support"
    description: "Support major marketing campaigns with brand guidance"
    trigger:
      - "Campaign brief received"
      - "Campaign planning request"

    steps:
      - step: 1
        name: "Brief Review"
        actions:
          - "Review campaign brief"
          - "Assess brand alignment"
          - "Identify brand requirements"
        outputs:
          - "Brand assessment"

      - step: 2
        name: "Brand Guidance Development"
        actions:
          - "Develop campaign messaging guidelines"
          - "Provide creative direction"
          - "Specify brand requirements"
        outputs:
          - "Campaign brand guidelines"

      - step: 3
        name: "Creative Review"
        actions:
          - "Review creative concepts"
          - "Assess brand compliance"
          - "Provide feedback"
        outputs:
          - "Creative approved/feedback"

      - step: 4
        name: "Launch Support"
        actions:
          - "Final approval"
          - "Monitor launch"
          - "Address any issues"
        outputs:
          - "Campaign launched"

      - step: 5
        name: "Post-Campaign Review"
        actions:
          - "Analyze brand impact"
          - "Assess messaging effectiveness"
          - "Document learnings"
        outputs:
          - "Campaign brand impact report"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 7: COMPETITIVE POSITIONING RESPONSE
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_positioning_response:
    name: "Competitive Positioning Response"
    description: "Respond to competitive positioning challenges"
    trigger:
      - "Competitor repositioning"
      - "Competitive threat identified"
      - "Attribute encroachment"

    steps:
      - step: 1
        name: "Threat Assessment"
        actions:
          - "Analyze competitive move"
          - "Assess impact on our position"
          - "Evaluate customer perception risk"
        outputs:
          - "Threat assessment report"

      - step: 2
        name: "Strategy Development"
        actions:
          - "Develop response options"
          - "Evaluate options"
          - "Recommend approach"
        outputs:
          - "Response strategy recommendation"

      - step: 3
        name: "Approval"
        actions:
          - "Present to CMO Agent"
          - "Get approval for response"
        outputs:
          - "Approved response strategy"

      - step: 4
        name: "Implementation"
        actions:
          - "Update messaging if needed"
          - "Brief relevant teams"
          - "Execute response activities"
        outputs:
          - "Response implemented"

      - step: 5
        name: "Monitoring"
        actions:
          - "Track effectiveness"
          - "Monitor competitive reaction"
          - "Adjust as needed"
        outputs:
          - "Effectiveness assessment"
