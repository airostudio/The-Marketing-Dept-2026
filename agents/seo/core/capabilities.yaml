    # 1.2 INDEXATION & CRAWLABILITY
    # ─────────────────────────────────────────────────────────────────────────

    indexation:
      id: "TECH-003"
      name: "Index Coverage Manager"
      description: "Monitor and optimize search engine indexation"

      features:
        - feature: "Index Status Tracking"
          capabilities:
            - "Google Search Console integration"
            - "Bing Webmaster Tools integration"
            - "Index coverage monitoring"
            - "Indexed vs submitted URLs"
            - "Index bloat detection"
            - "Thin content identification"

        - feature: "Indexation Issues"
          capabilities:
            - "Crawled - currently not indexed"
            - "Discovered - currently not indexed"
            - "Excluded by noindex tag"
            - "Blocked by robots.txt"
            - "Redirect issues"
            - "404 not found"
            - "Soft 404 detection"
            - "Server errors (5xx)"
            - "Duplicate content issues"
            - "Alternate page with canonical"

        - feature: "Index Control"
          capabilities:
            - "Meta robots analysis"
            - "X-Robots-Tag header analysis"
            - "Robots.txt validation"
            - "Noindex/nofollow audit"
            - "Canonical tag validation"
            - "Index bloat prevention"

      outputs:
        - "Index coverage dashboard"
        - "Issue trend tracking"
        - "Priority fix recommendations"
        - "Index health score"

    robots_sitemaps:
      id: "TECH-004"
      name: "Robots & Sitemap Manager"
      description: "Manage crawl directives and sitemaps"

      features:
