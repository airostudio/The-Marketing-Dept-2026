          platforms: ["Google Ads", "Meta Ads", "Microsoft Ads"]

        - strategy: "Target CPA"
          description: "Optimize bids for target cost per acquisition"
          platforms: ["All platforms"]

        - strategy: "Maximize Conversions"
          description: "Get maximum conversions within budget"
          platforms: ["All platforms"]

        - strategy: "Enhanced CPC"
          description: "Automated bid adjustments with manual base"
          platforms: ["Google Ads", "Microsoft Ads"]

        - strategy: "Portfolio Bidding"
          description: "Cross-campaign bid optimization"
          platforms: ["Google Ads"]

        - strategy: "Value-Based Bidding"
          description: "Bid based on predicted customer value"
