# ═══════════════════════════════════════════════════════════════════════════════
# RANK TRACKING & SERP ANALYSIS MODULE
# The Marketing Department 2026 - SEO Agent
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "rank-tracking-serp"
  name: "Rank Tracking & SERP Intelligence Engine"
  version: "1.0.0"
  category: "rank_tracking"

  # ═══════════════════════════════════════════════════════════════════════════
  # POSITION TRACKING ENGINE
  # ═══════════════════════════════════════════════════════════════════════════

  position_tracking:

    tracking_configuration:
      search_engines:
        - engine: "Google"
          primary: true
          coverage: "200+ countries"

        - engine: "Bing"
          coverage: "Major markets"

        - engine: "Yahoo"
          coverage: "Selected markets"

        - engine: "Yandex"
          coverage: "Russia, CIS countries"

        - engine: "Baidu"
          coverage: "China"

      device_types:
        - "Desktop"
        - "Mobile"
        - "Tablet"

      frequency_options:
        - "Real-time (on-demand)"
        - "Daily"
        - "Weekly"
        - "Custom schedule"

      location_granularity:
        - "Country"
        - "State/Region"
        - "City"
        - "ZIP/Postal code"
        - "GPS coordinates"

    tracked_data:
      per_keyword:
        - field: "Position"
          type: "integer"
          range: "1-100 (or 'not ranking')"

        - field: "Previous Position"
          type: "integer"
          comparison: "Last check"

        - field: "Position Change"
          type: "integer"
          calculation: "Previous - Current"

        - field: "Best Position"
          type: "integer"
          timeframe: "All time"

        - field: "Worst Position"
          type: "integer"
          timeframe: "All time"

        - field: "Average Position"
          type: "float"
          timeframe: "30/60/90 days"

        - field: "Ranking URL"
          type: "URL"
          tracking: "Detect changes"

        - field: "SERP Features"
          type: "array"
          values: "All detected features"

        - field: "Featured Snippet Owner"
          type: "URL"
          tracking: "You vs competitor"

        - field: "Local Pack Position"
          type: "integer"
          when: "Local intent keyword"

    position_history:
      retention: "24 months minimum"
      granularity: "Daily snapshots"
      visualization:
        - "Position trend charts"
        - "Volatility indicators"
        - "Milestone markers"

  # ═══════════════════════════════════════════════════════════════════════════
  # SERP FEATURE TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  serp_features:

    tracked_features:
      knowledge_features:
        - feature: "Featured Snippet"
          types:
            - "Paragraph"
            - "List (ordered/unordered)"
            - "Table"
            - "Video"
          tracking:
            - "Presence"
            - "Owner (you/competitor)"
            - "Content"
            - "Source URL"

        - feature: "Knowledge Panel"
          tracking:
            - "Entity type"
            - "Information displayed"
            - "Source links"

        - feature: "Knowledge Card"
          tracking: "Presence and content"

        - feature: "Instant Answer"
          tracking: "Answer content"

      engagement_features:
        - feature: "People Also Ask (PAA)"
          tracking:
            - "Questions displayed"
            - "Your presence in answers"
            - "Expansion opportunities"
          expansion_depth: "3 levels"

        - feature: "Related Searches"
          tracking:
            - "Related queries"
            - "Trend analysis"

      media_features:
        - feature: "Image Pack"
          tracking:
            - "Position in SERP"
            - "Your images present"
            - "Image count"

        - feature: "Video Carousel"
          tracking:
            - "Video sources"
            - "Your videos present"
            - "YouTube dominance %"

        - feature: "Top Stories"
          tracking:
            - "News sources"
            - "Your articles"
            - "Freshness requirement"

      commercial_features:
        - feature: "Shopping Results"
          tracking:
            - "Position"
            - "Product count"
            - "Your products"

        - feature: "Product Listing Ads"
          tracking:
            - "Presence"
            - "Competitors shown"

        - feature: "Local Pack"
          tracking:
            - "Position (1-3)"
            - "Your listing"
            - "Competitors"
            - "Review counts"

        - feature: "Local Services Ads"
          tracking: "Presence"

      rich_results:
        - feature: "Review Stars"
          tracking:
            - "Rating displayed"
            - "Review count"

        - feature: "FAQ Rich Result"
          tracking:
            - "Questions shown"
            - "Your FAQ presence"

        - feature: "How-To Rich Result"
          tracking:
            - "Steps displayed"
            - "Images included"

        - feature: "Recipe Rich Result"
          tracking: "For food-related queries"

        - feature: "Event Rich Result"
          tracking: "Event details shown"

        - feature: "Job Posting"
          tracking: "Job listings displayed"

      site_enhancements:
        - feature: "Sitelinks"
          tracking:
            - "Sitelinks present"
            - "Number shown"
            - "Links displayed"

        - feature: "Sitelinks Searchbox"
          tracking: "Present for brand queries"

        - feature: "Breadcrumbs"
          tracking: "Displayed in result"

    feature_opportunity_analysis:
      scoring:
        - "Current feature capture rate"
        - "Competitor feature capture"
        - "Optimization potential"
        - "Traffic impact of features"

      recommendations:
        - "Content optimizations for featured snippets"
        - "Schema additions for rich results"
        - "FAQ content for PAA"
        - "Video content opportunities"

  # ═══════════════════════════════════════════════════════════════════════════
  # VISIBILITY SCORING
  # ═══════════════════════════════════════════════════════════════════════════

  visibility:

    visibility_score:
      name: "Organic Visibility Score"
      scale: "0-100"

      calculation:
        method: "Weighted position scoring"
        formula: "Sum of (keyword_volume * position_weight * ctr_modifier)"

        position_weights:
          position_1: 1.0
          position_2: 0.85
          position_3: 0.75
          position_4: 0.60
          position_5: 0.50
          position_6: 0.40
          position_7: 0.30
          position_8: 0.25
          position_9: 0.20
          position_10: 0.15
          position_11_20: 0.08
          position_21_plus: 0.02

        modifiers:
          featured_snippet: 1.5
          local_pack_position_1: 1.3
          rich_result_present: 1.2

    visibility_breakdown:
      segments:
        - "By keyword group"
        - "By page"
        - "By category"
        - "By intent type"
        - "By device"
        - "By location"

      trending:
        - "Daily visibility trend"
        - "Week-over-week change"
        - "Month-over-month change"
        - "Year-over-year change"

    share_of_voice:
      definition: "Your visibility / total market visibility"
      calculation: "Your visibility score / sum of all competitors"
      tracking:
        - "Overall market share"
        - "Share by keyword group"
        - "Share vs specific competitors"
        - "Share trends over time"

  # ═══════════════════════════════════════════════════════════════════════════
  # RANKING ALERTS
  # ═══════════════════════════════════════════════════════════════════════════

  alerts:

    alert_types:
      position_alerts:
        - alert: "Top 3 Achieved"
          trigger: "Keyword enters position 1-3"
          priority: "info"
          notification: "immediate"

        - alert: "First Page Achieved"
          trigger: "Keyword enters position 1-10"
          priority: "info"
          notification: "daily_digest"

        - alert: "Significant Gain"
          trigger: "Position improves by 10+"
          priority: "info"
          notification: "daily_digest"

        - alert: "Significant Drop"
          trigger: "Position drops by 10+"
          priority: "high"
          notification: "immediate"

        - alert: "Left First Page"
          trigger: "Keyword drops from top 10 to 11+"
          priority: "high"
          notification: "immediate"

        - alert: "Left Top 3"
          trigger: "Keyword drops from top 3 to 4+"
          priority: "high"
          notification: "immediate"

        - alert: "Lost Ranking"
          trigger: "Previously ranking keyword no longer found"
          priority: "critical"
          notification: "immediate"

      feature_alerts:
        - alert: "Featured Snippet Won"
          trigger: "Your URL wins featured snippet"
          priority: "info"
          notification: "immediate"

        - alert: "Featured Snippet Lost"
          trigger: "You lose featured snippet"
          priority: "high"
          notification: "immediate"

        - alert: "Local Pack Position Change"
          trigger: "Position in local pack changes"
          priority: "medium"
          notification: "daily_digest"

      competitor_alerts:
        - alert: "Competitor Overtakes"
          trigger: "Competitor passes your position"
          priority: "medium"
          notification: "daily_digest"

        - alert: "New Competitor Ranking"
          trigger: "New domain appears in top 10"
          priority: "low"
          notification: "weekly_digest"

    alert_configuration:
      channels:
        - "Email"
        - "Slack"
        - "Webhook"
        - "Dashboard notification"
        - "SMS (critical only)"

      personalization:
        - "Keywords by priority tier"
        - "Alert threshold customization"
        - "Digest frequency"
        - "Recipients by alert type"

  # ═══════════════════════════════════════════════════════════════════════════
  # SERP VOLATILITY MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  volatility:

    volatility_index:
      name: "SERP Volatility Score"
      scale: "0-10"
      interpretation:
        0-2: "Stable - Normal fluctuations"
        3-4: "Moderate - Some movement"
        5-6: "Elevated - Significant changes"
        7-8: "High - Major reshuffling"
        9-10: "Extreme - Algorithm update likely"

    calculation:
      method: "Average position change magnitude"
      scope:
        - "Your tracked keywords"
        - "Industry benchmark keywords"
        - "Broad market sample"

    tracking:
      dimensions:
        - "Overall volatility"
        - "By keyword category"
        - "By industry vertical"
        - "By country"
        - "By device type"

      visualization:
        - "Daily volatility chart"
        - "Historical volatility timeline"
        - "Algorithm update overlay"

    algorithm_update_detection:
      signals:
        - "Volatility spike above threshold"
        - "Widespread ranking changes"
        - "Industry-wide patterns"
        - "Google announcements"

      response:
        - "Alert CMO Agent"
        - "Pause automated optimizations"
        - "Initiate impact analysis"
        - "Compare to industry trends"
        - "Develop recovery strategy"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE SERP ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  competitor_serp:

    tracking:
      - "Competitor positions for your keywords"
      - "Competitor visibility scores"
      - "Competitor feature capture"
      - "Competitor ranking URLs"

    analysis:
      - analysis: "Position Gap"
        output: "Keywords where competitors outrank you"

      - analysis: "Feature Gap"
        output: "SERP features competitors own"

      - analysis: "Movement Correlation"
        output: "When you drop, who gains?"

      - analysis: "Market Share Trends"
        output: "Share of voice over time"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS & REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:

    dashboards:
      - dashboard: "Ranking Overview"
        widgets:
          - "Visibility score trend"
          - "Position distribution pie chart"
          - "Top movers (up/down)"
          - "Feature capture summary"

      - dashboard: "Keyword Performance"
        widgets:
          - "Individual keyword tracking"
          - "Position history charts"
          - "SERP feature status"
          - "Competitor comparison"

      - dashboard: "Competitive Landscape"
        widgets:
          - "Share of voice comparison"
          - "Competitor visibility trends"
          - "Head-to-head positions"

    reports:
      - report: "Daily Ranking Summary"
        contents:
          - "Winners and losers"
          - "New rankings achieved"
          - "Rankings lost"
          - "Key position changes"

      - report: "Weekly Performance Report"
        contents:
          - "Visibility trend"
          - "Position distribution changes"
          - "SERP feature analysis"
          - "Competitor movements"
          - "Action recommendations"

      - report: "Monthly Strategic Report"
        contents:
          - "Full ranking analysis"
          - "Traffic correlation"
          - "Goal progress"
          - "Strategic recommendations"

    exports:
      formats:
        - "CSV"
        - "Excel"
        - "PDF"
        - "JSON API"
        - "Google Sheets integration"
        - "Data Studio connector"
