# ═══════════════════════════════════════════════════════════════════════════════
# BRAND & POSITIONING AGENT - MESSAGING FRAMEWORK MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "messaging-framework"
  name: "Messaging Framework Engine"
  version: "1.0.0"
  category: "messaging"

  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGING ARCHITECTURE
  # ═══════════════════════════════════════════════════════════════════════════

  messaging_architecture:

    master_narrative:
      definition: "Core brand story"
      components:
        - "Brand origin/why"
        - "Problem we solve"
        - "Our approach"
        - "Vision for the future"
        - "Call to action"
      length: "250-500 words"
      use_cases:
        - "About us sections"
        - "Investor communications"
        - "Media backgrounders"
        - "Executive speeches"

    messaging_pillars:
      definition: "Core message themes"
      structure:
        pillar_count: "3-5 pillars"
        per_pillar:
          - "Pillar name"
          - "Pillar statement (1-2 sentences)"
          - "Supporting messages (3-5)"
          - "Proof points (3-5)"
          - "Keywords"

      example_pillars:
        - pillar: "Innovation"
          statement: "We continuously push boundaries to deliver solutions that don't exist yet."
          messages:
            - "First to market with X technology"
            - "R&D investment exceeds industry average"
            - "Patent portfolio demonstrates innovation commitment"
          proof_points:
            - "50+ patents"
            - "30% of revenue from products < 3 years old"
            - "Industry innovation awards"

    message_hierarchy:
      levels:
        level_1:
          name: "Brand-level messaging"
          purpose: "Universal brand messages"
          scope: "Applies everywhere"

        level_2:
          name: "Audience-level messaging"
          purpose: "Tailored by segment"
          scope: "Specific audiences"

        level_3:
          name: "Product/Service messaging"
          purpose: "Offering-specific"
          scope: "Individual products"

        level_4:
          name: "Campaign messaging"
          purpose: "Time-bound initiatives"
          scope: "Specific campaigns"

  # ═══════════════════════════════════════════════════════════════════════════
  # VALUE PROPOSITIONS
  # ═══════════════════════════════════════════════════════════════════════════

  value_propositions:

    core_value_proposition:
      framework:
        headline: "Compelling statement of value (5-10 words)"
        subheadline: "Elaboration (15-25 words)"
        key_benefits: "3 primary benefits"
        proof: "Credibility statement"

      development_process:
        - "Customer research on needs"
        - "Competitive analysis"
        - "Benefit prioritization"
        - "Draft and test"
        - "Refine and finalize"

    segment_value_propositions:
      structure:
        per_segment:
          - "Segment definition"
          - "Primary pain point"
          - "Tailored value proposition"
          - "Specific benefits"
          - "Relevant proof points"

    product_value_propositions:
      structure:
        per_product:
          - "Product description"
          - "Target user"
          - "Key benefit"
          - "Differentiator"
          - "Proof"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND VOICE & TONE
  # ═══════════════════════════════════════════════════════════════════════════

  brand_voice:

    voice_characteristics:
      definition: "Consistent personality across all communications"
      format:
        characteristic_count: "4-6 characteristics"
        per_characteristic:
          - "Trait name"
          - "Description"
          - "We are..."
          - "We are not..."
          - "Examples"

      example:
        trait: "Confident"
        description: "We speak with authority based on expertise"
        we_are: "Assured, knowledgeable, decisive"
        we_are_not: "Arrogant, dismissive, know-it-all"
        examples:
          do: "Our research shows..."
          dont: "Obviously, everyone knows..."

    tone_guidelines:
      definition: "Contextual adjustment of voice"

      tone_matrix:
        by_context:
          educational:
            tone: "Helpful, patient, clear"
            characteristics: ["Explanatory", "Encouraging", "Step-by-step"]

          celebratory:
            tone: "Enthusiastic, warm, proud"
            characteristics: ["Exclamatory", "Appreciative", "Energetic"]

          apologetic:
            tone: "Sincere, humble, solution-focused"
            characteristics: ["Empathetic", "Direct", "Action-oriented"]

          sales:
            tone: "Confident, benefit-focused, urgent"
            characteristics: ["Persuasive", "Value-driven", "Clear CTA"]

          support:
            tone: "Patient, understanding, helpful"
            characteristics: ["Empathetic", "Solution-oriented", "Reassuring"]

        by_channel:
          social_media:
            tone: "Conversational, engaging, timely"
            adjustments: "More casual, emoji acceptable"

          email:
            tone: "Personal, direct, actionable"
            adjustments: "Medium formality"

          website:
            tone: "Clear, comprehensive, professional"
            adjustments: "More formal than social"

          advertising:
            tone: "Compelling, concise, memorable"
            adjustments: "High impact, action-oriented"

  # ═══════════════════════════════════════════════════════════════════════════
  # WRITING GUIDELINES
  # ═══════════════════════════════════════════════════════════════════════════

  writing_guidelines:

    style_principles:
      clarity:
        - "Use simple, clear language"
        - "Avoid jargon unless audience-appropriate"
        - "One idea per sentence"
        - "Active voice preferred"

      concision:
        - "Edit ruthlessly"
        - "Remove filler words"
        - "Every word earns its place"

      consistency:
        - "Follow style guide"
        - "Use approved terminology"
        - "Maintain voice across content"

    grammar_and_style:
      capitalization:
        - "Sentence case for headlines"
        - "Capitalize brand terms per guide"
        - "Product names as trademarked"

      punctuation:
        - "Oxford comma: Yes"
        - "Exclamation points: Sparingly"
        - "Ellipses: Avoid in formal content"

      formatting:
        - "Bulleted lists for scannability"
        - "Short paragraphs (2-4 sentences)"
        - "Subheadings for long content"

    terminology:
      approved_terms:
        - "Product names and spellings"
        - "Feature names"
        - "Industry terms"

      prohibited_terms:
        - "Competitor names (in most cases)"
        - "Outdated product names"
        - "Informal variants"

  # ═══════════════════════════════════════════════════════════════════════════
  # STORYTELLING
  # ═══════════════════════════════════════════════════════════════════════════

  storytelling:

    brand_story:
      structure:
        origin: "How/why we started"
        journey: "Key milestones"
        challenge: "Problems we solve"
        impact: "Difference we make"
        future: "Where we're going"

    story_frameworks:
      customer_success:
        structure:
          challenge: "Customer's situation"
          solution: "How we helped"
          results: "Outcomes achieved"
          quote: "Customer voice"

      thought_leadership:
        structure:
          trend: "Industry context"
          insight: "Our perspective"
          implications: "What it means"
          guidance: "What to do"

      product_narrative:
        structure:
          need: "Problem addressed"
          innovation: "Our solution"
          benefit: "Value delivered"
          proof: "Evidence"

  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGE TESTING
  # ═══════════════════════════════════════════════════════════════════════════

  message_testing:

    testing_methods:
      qualitative:
        - "Focus groups"
        - "In-depth interviews"
        - "Message reaction testing"

      quantitative:
        - "Survey testing"
        - "A/B testing"
        - "Message tracking"

    testing_criteria:
      - "Comprehension"
      - "Relevance"
      - "Differentiation"
      - "Credibility"
      - "Motivation"
      - "Memorability"

    optimization_cycle:
      - "Test messages"
      - "Analyze results"
      - "Refine messaging"
      - "Implement updates"
      - "Monitor performance"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_content_strategy_agent:
      - "Messaging framework document"
      - "Key messages by pillar"
      - "Voice and tone guidelines"
      - "Approved proof points"

    to_paid_media_agent:
      - "Ad messaging guidelines"
      - "Value proposition variations"
      - "Approved claims"

    to_social_media_agent:
      - "Social voice guidelines"
      - "Response messaging"
      - "Platform-specific guidance"

    deliverables:
      - "Complete messaging framework"
      - "Value proposition deck"
      - "Brand voice guide"
      - "Message cheat sheet"
