    # ─────────────────────────────────────────────────────────────────────────
    # 3.2 OUTLINE GENERATION
    # ─────────────────────────────────────────────────────────────────────────

    outline_generation:
      id: "BRIEFS-002"
      name: "Content Outline Generator"
