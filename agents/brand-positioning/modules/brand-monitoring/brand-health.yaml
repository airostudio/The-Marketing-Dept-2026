# ═══════════════════════════════════════════════════════════════════════════════
# BRAND & POSITIONING AGENT - BRAND MONITORING MODULE
# The Marketing Department 2026
# ═══════════════════════════════════════════════════════════════════════════════

module:
  id: "brand-monitoring"
  name: "Brand Health & Monitoring Engine"
  version: "1.0.0"
  category: "monitoring"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND HEALTH TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  brand_health:

    awareness_tracking:
      metrics:
        aided_awareness:
          definition: "Recognition when prompted"
          measurement: "Survey question"
          frequency: "Quarterly"
          target: "80%+"

        unaided_awareness:
          definition: "Spontaneous recall"
          measurement: "Open-ended survey"
          frequency: "Quarterly"
          target: "30%+"

        top_of_mind:
          definition: "First brand mentioned"
          measurement: "First mention in category"
          frequency: "Quarterly"
          target: "Top 3"

    consideration_tracking:
      metrics:
        consideration_set:
          definition: "Would consider purchasing"
          measurement: "Survey"
          frequency: "Quarterly"

        preference:
          definition: "Preferred over alternatives"
          measurement: "Forced choice"
          frequency: "Quarterly"

        purchase_intent:
          definition: "Likely to purchase"
          measurement: "Intent scale"
          frequency: "Quarterly"

    perception_tracking:
      metrics:
        brand_attributes:
          definition: "Association with key attributes"
          attributes_tracked:
            - "Innovative"
            - "Trustworthy"
            - "High quality"
            - "Good value"
            - "Customer-focused"
            - "[Category-specific attributes]"
          measurement: "Attribute rating scales"
          frequency: "Quarterly"

        brand_personality:
          definition: "Perceived personality traits"
          measurement: "Personality scale"
          frequency: "Bi-annually"

        brand_differentiation:
          definition: "Perceived uniqueness"
          measurement: "Differentiation questions"
          frequency: "Quarterly"

    loyalty_tracking:
      metrics:
        net_promoter_score:
          definition: "Likelihood to recommend"
          measurement: "0-10 scale"
          frequency: "Monthly"
          calculation: "Promoters% - Detractors%"

        customer_satisfaction:
          definition: "Overall satisfaction"
          measurement: "Satisfaction scale"
          frequency: "Monthly"

        brand_love:
          definition: "Emotional attachment"
          measurement: "Brand love scale"
          frequency: "Quarterly"

  # ═══════════════════════════════════════════════════════════════════════════
  # SENTIMENT MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  sentiment_monitoring:

    real_time_sentiment:
      sources:
        - "Social media mentions"
        - "Review sites"
        - "News mentions"
        - "Forum discussions"
        - "Customer feedback"

      analysis:
        sentiment_classification:
          categories: ["Positive", "Neutral", "Negative", "Mixed"]
          confidence_threshold: 0.80

        emotion_detection:
          emotions:
            - "Joy"
            - "Trust"
            - "Surprise"
            - "Sadness"
            - "Anger"
            - "Fear"

      metrics:
        overall_sentiment:
          calculation: "Weighted average sentiment"
          target: ">70% positive"

        sentiment_trend:
          calculation: "Week-over-week change"
          alert_threshold: "±10%"

        sentiment_by_topic:
          tracking: "Sentiment per topic/product"
          reporting: "Topic sentiment breakdown"

    sentiment_alerts:
      - alert: "Negative spike"
        trigger: "Negative sentiment > 30% for 4 hours"
        action: "Immediate investigation"

      - alert: "Viral negative"
        trigger: "Single negative with >1000 engagements"
        action: "Crisis protocol consideration"

      - alert: "Sentiment shift"
        trigger: "10%+ shift in 24 hours"
        action: "Investigation and report"

  # ═══════════════════════════════════════════════════════════════════════════
  # REPUTATION MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  reputation_monitoring:

    reputation_score:
      components:
        media_coverage:
          weight: 0.25
          factors:
            - "Volume of coverage"
            - "Sentiment of coverage"
            - "Reach of outlets"

        social_sentiment:
          weight: 0.25
          factors:
            - "Overall sentiment"
            - "Share of voice"
            - "Engagement quality"

        review_ratings:
          weight: 0.25
          factors:
            - "Average star rating"
            - "Review volume"
            - "Review sentiment"

        search_results:
          weight: 0.25
          factors:
            - "First page results"
            - "Sentiment of results"
            - "Owned vs. earned"

      scoring:
        scale: "0-100"
        excellent: { min: 80 }
        good: { min: 60, max: 79 }
        fair: { min: 40, max: 59 }
        poor: { max: 39 }

    reputation_threats:
      monitoring:
        - "Negative news coverage"
        - "Viral complaints"
        - "Competitive attacks"
        - "Legal/regulatory mentions"
        - "Executive criticism"

      alerts:
        - level: "Watch"
          trigger: "Potential threat detected"
          action: "Monitor closely"

        - level: "Warning"
          trigger: "Growing threat"
          action: "Prepare response"

        - level: "Critical"
          trigger: "Active reputation damage"
          action: "Crisis response"

  # ═══════════════════════════════════════════════════════════════════════════
  # BRAND AUDIT
  # ═══════════════════════════════════════════════════════════════════════════

  brand_audit:

    audit_framework:
      internal_audit:
        scope:
          - "Brand assets review"
          - "Guideline compliance"
          - "Messaging consistency"
          - "Employee alignment"

        frequency: "Quarterly"

        deliverables:
          - "Compliance scorecard"
          - "Issue identification"
          - "Remediation plan"

      external_audit:
        scope:
          - "Customer perceptions"
          - "Competitive position"
          - "Market relevance"
          - "Brand equity"

        frequency: "Annually"

        deliverables:
          - "Brand health report"
          - "Competitive analysis"
          - "Recommendations"

    audit_checklist:
      visual_consistency:
        - "Logo usage"
        - "Color application"
        - "Typography"
        - "Imagery"

      verbal_consistency:
        - "Messaging alignment"
        - "Voice and tone"
        - "Terminology"

      experience_consistency:
        - "Customer journey"
        - "Touchpoint quality"
        - "Service delivery"

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPETITIVE BRAND TRACKING
  # ═══════════════════════════════════════════════════════════════════════════

  competitive_tracking:

    share_of_voice:
      definition: "Brand's portion of total category conversation"
      measurement: "Mentions / Total category mentions"
      tracking: "Weekly"
      benchmarking: "vs. top 5 competitors"

    competitive_perception:
      tracking:
        - "Attribute comparison"
        - "Preference comparison"
        - "Positioning overlap"

      analysis:
        - "Positioning map updates"
        - "Competitive advantage/gap"
        - "Opportunity identification"

    competitive_alerts:
      - "Competitor repositioning"
      - "New competitor entry"
      - "Competitive campaign launch"
      - "Competitor attribute claim"

  # ═══════════════════════════════════════════════════════════════════════════
  # REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  reporting:

    standard_reports:
      daily_brand_pulse:
        contents: ["Sentiment", "Mentions", "Alerts"]
        distribution: "Brand team"

      weekly_brand_summary:
        contents:
          - "Sentiment trends"
          - "Share of voice"
          - "Notable mentions"
          - "Competitive activity"
        distribution: "Marketing team"

      monthly_brand_health:
        contents:
          - "All brand health metrics"
          - "Trend analysis"
          - "Competitive comparison"
          - "Recommendations"
        distribution: "CMO Agent, Leadership"

      quarterly_brand_review:
        contents:
          - "Comprehensive brand analysis"
          - "Tracking study results"
          - "Strategic assessment"
          - "Action plan"
        distribution: "Executive team"

    dashboards:
      real_time:
        - "Sentiment monitor"
        - "Mention feed"
        - "Alert tracker"

      strategic:
        - "Brand health scorecard"
        - "Competitive positioning"
        - "Trend analysis"

  # ═══════════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ═══════════════════════════════════════════════════════════════════════════

  outputs:
    to_cmo_agent:
      - "Brand health reports"
      - "Crisis alerts"
      - "Strategic recommendations"

    to_social_media_agent:
      - "Sentiment data"
      - "Alert triggers"
      - "Response requirements"

    to_competitive_intel_agent:
      - "Competitive brand data"
      - "Share of voice"
      - "Positioning insights"

    to_content_strategy_agent:
      - "Message performance"
      - "Topic sentiment"
      - "Content opportunities"
