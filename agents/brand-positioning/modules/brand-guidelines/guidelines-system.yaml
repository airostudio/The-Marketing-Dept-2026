  # VISUAL IDENTITY GUIDELINES
  # ═══════════════════════════════════════════════════════════════════════════

  visual_identity:

    logo_guidelines:
      primary_logo:
        versions:
          - "Full color"
          - "Single color"
          - "Reversed (white)"
          - "Black"
        usage_rules:
          minimum_size: "Specified in pixels/inches"
          clear_space: "X measurement around logo"
          placement: "Preferred positions"

      logo_lockups:
        with_tagline: "When and how to use"
        with_sub_brands: "Co-branding rules"
        stacked_vs_horizontal: "When to use each"

      logo_dont:
        - "Do not stretch or distort"
        - "Do not change colors"
        - "Do not add effects"
        - "Do not rotate"
        - "Do not place on busy backgrounds"

    color_system:
      primary_colors:
        format:
          - color_name: "Primary Blue"
            hex: "#0066CC"
            rgb: "0, 102, 204"
            cmyk: "100, 60, 0, 20"
            pantone: "PMS 285 C"
            usage: "Primary brand color, CTAs, headers"

      secondary_colors:
        format:
          - color_name: "Accent Green"
            hex: "#00CC66"
            usage: "Accent, success states"

      neutral_colors:
        - "Grays for text and backgrounds"
        - "Black and white specifications"

      color_usage:
        ratios: "60% primary, 30% secondary, 10% accent"
        accessibility: "WCAG 2.1 AA compliance required"
        combinations: "Approved color pairings"

    typography:
      primary_typeface:
        name: "Brand Font Name"
        weights: ["Light", "Regular", "Medium", "Bold"]
        usage: "Headlines, body copy"

      secondary_typeface:
        name: "Secondary Font Name"
        usage: "Accents, special use"

      web_fonts:
        primary: "Google Font or hosted"
        fallbacks: "System font stack"

      type_hierarchy:
        h1: "Size, weight, line-height"
        h2: "Size, weight, line-height"
        h3: "Size, weight, line-height"
        body: "Size, weight, line-height"
        caption: "Size, weight, line-height"

    imagery_guidelines:
      photography_style:
        subjects: "People, products, environments"
        aesthetic: "Bright, authentic, diverse"
        composition: "Clean, focused, purposeful"
        treatment: "Natural color, minimal filters"

      illustration_style:
        type: "Line, flat, 3D, etc."
        colors: "Brand color palette"
        usage: "Icons, infographics, decorative"

      iconography:
        style: "Outlined, filled, etc."
        stroke_width: "Consistent weight"
        grid: "Pixel grid for consistency"

